# Provider compatibility is decided by runtime identity, handshake, protocol
# negotiation and capability checks. Provider versions and executable or schema
# digests are observations only and are never recorded or gated here.
schema_version: 1
activation_policy:
  real_adapters_require_separate_gate: true
  default_enabled: false
  executable_resolution_version: 2

adapters:
  claude-agent-sdk:
    enabled: true
    delivery_stage: 3
    implementation:
      kind: npm-package
      package: "@anthropic-ai/claude-agent-sdk"
      executable: "claude"
      provider_identity: apple-designated
    contract:
      protocol: claude-agent-sdk+claude-code-cli
    runtime_range:
      fabric_node: ">=24.15.0 <25"
      upstream_node: ">=18.0.0"
      platforms:
        - darwin-arm64
    model_family_constraints:
      allowed:
        - anthropic
      requires_explicit_model: true
    official_source_url: "https://github.com/anthropics/claude-agent-sdk-typescript"

  codex-app-server:
    enabled: true
    delivery_stage: 3
    implementation:
      kind: native-cli
      executable: "codex"
      provider_identity: apple-designated
    contract:
      protocol: codex-app-server
    runtime_range:
      platforms:
        - darwin-arm64
    model_family_constraints:
      allowed:
        - openai
      requires_explicit_model: true
    official_source_url: "https://github.com/openai/codex"

  herdr:
    enabled: false
    delivery_stage: 3
    implementation:
      kind: native-cli
      command: herdr
      executable: "herdr"
    contract:
      protocol: herdr-local-api
    runtime_range:
      platforms:
        - darwin-arm64
    model_family_constraints:
      allowed: []
      requires_explicit_model: true
      route_role: visibility-and-wakeup-only
    official_source_url: "https://github.com/ogulcancelik/herdr"

  pi-rpc:
    enabled: false
    disabled_reason: "No trusted open-weight Pi provider/model is currently available in the installed account; activation would route to an unavailable provider."
    delivery_stage: 4
    implementation:
      kind: npm-cli
      package: "@earendil-works/pi-coding-agent"
      executable: "pi"
    contract:
      protocol: pi-jsonl-rpc
    runtime_range:
      fabric_node: ">=24.15.0 <25"
      upstream_node: ">=22.19.0"
      platforms:
        - darwin-arm64
    model_family_constraints:
      allowed:
        - generic-open
        - open-weight
      allowed_model_patterns:
        - "deepseek-*"
        - "glm-*"
        - "kimi-*"
        - "llama-*"
        - "minimax-*"
        - "mistral-*"
        - "mixtral-*"
        - "qwen*"
      requires_explicit_model: true
      route_role: generic-or-open-model-worker
    official_source_url: "https://github.com/earendil-works/pi"

  agy:
    enabled: true
    delivery_stage: 4
    implementation:
      kind: native-cli
      command: agy
      executable: "agy"
      provider_identity: apple-designated
    contract:
      protocol: agy-cli
    runtime_range:
      platforms:
        - darwin-arm64
    model_family_constraints:
      allowed:
        - google
        - anthropic
      requires_explicit_model: true
      route_role: google-primary-anthropic-fallback-worker
    official_source_url: "https://github.com/google-antigravity/antigravity-cli"

  cursor-agent:
    enabled: true
    delivery_stage: 4
    implementation:
      kind: bundled-cli
      command: cursor-agent
      executable: "cursor-agent"
      cursor_install_root: "${USER_HOME}/.local/share/cursor-agent"
      provider_identity: cursor-partial-signed-helpers
    contract:
      protocol: cursor-agent-stream-json-cli
    runtime_range:
      platforms:
        - darwin-arm64
    model_family_constraints:
      allowed:
        - cursor-composer
        - xai
        - anthropic
        - openai
        - google
      requires_explicit_model: true
    official_source_url: "https://cursor.com/docs/cli/overview"

  kiro-acp:
    enabled: false
    disabled_reason: "Provider execution is dormant until one bounded ordinary Kiro invocation and safety boundary are verified."
    delivery_stage: 4
    implementation:
      kind: native-cli
      command: kiro-cli
      executable: "kiro-cli"
      provider_identity: apple-designated
    contract:
      protocol: agent-client-protocol
    runtime_range:
      minimum_macos: "10.13"
      platforms:
        - darwin-arm64
        - darwin-x86_64
    model_family_constraints:
      allowed:
        - open-weight
      allowed_model_patterns:
        - "auto"
        - "deepseek-*"
        - "glm-*"
        - "minimax-*"
        - "qwen*"
      requires_explicit_model: true
      route_role: open-model-worker
    official_source_url: "https://kiro.dev/docs/cli/acp/"

  opencode-acp:
    enabled: false
    disabled_reason: "Provider execution is unavailable because the direct dispatch owner has no verified OpenCode invocation or receipt contract."
    delivery_stage: 4
    implementation:
      kind: native-cli
      command: opencode
      executable: "opencode"
      provider_identity: owner-controlled-install-root
    contract:
      protocol: agent-client-protocol
    runtime_range:
      platforms:
        - darwin-arm64
    model_family_constraints:
      allowed:
        - generic-open
      allowed_model_patterns:
        - "opencode/*"
      requires_explicit_model: true
      route_role: optional-free-account-worker
    official_source_url: "https://opencode.ai/docs/acp/"
