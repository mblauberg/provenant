# Provider compatibility is decided by runtime identity, handshake, protocol
# negotiation and capability checks. Provider versions and executable or schema
# digests are observations only and are never recorded or gated here.
schema_version: 1
activation_policy:
  real_adapters_require_separate_gate: true
  default_enabled: false
  executable_resolution_version: 2

adapters:
  claude-agent-sdk:
    enabled: true
    delivery_stage: 3
    implementation:
      kind: npm-package
      package: "@anthropic-ai/claude-agent-sdk"
      executable: "claude"
      provider_identity: apple-designated
    contract:
      protocol: claude-agent-sdk+claude-code-cli
    runtime_range:
      fabric_node: ">=24.15.0 <25"
      upstream_node: ">=18.0.0"
      platforms:
        - darwin-arm64
    model_family_constraints:
      # The families below anthropic are reachable only through an endpoint
      # profile in `config/model-routing.json`, which points the CLI at a
      # provider's Anthropic-compatible base URL. Without `--endpoint` the
      # catalogue's `fixed_model_family` still pins the adapter to anthropic.
      allowed:
        - anthropic
        - zhipu
        - moonshot
        - deepseek
        - generic-open
      requires_explicit_model: true
    official_source_url: "https://github.com/anthropics/claude-agent-sdk-typescript"

  codex-app-server:
    enabled: true
    delivery_stage: 3
    implementation:
      kind: native-cli
      executable: "codex"
      provider_identity: apple-designated
    contract:
      protocol: codex-app-server
    runtime_range:
      platforms:
        - darwin-arm64
    model_family_constraints:
      # The families below openai are reachable only through an endpoint
      # profile in `config/model-routing.json` that lists `codex` among its
      # adapters. The profile is passed to the CLI as an inline provider
      # override; without `--endpoint` the catalogue's `fixed_model_family`
      # still pins the adapter to openai.
      allowed:
        - openai
        - zhipu
        - moonshot
        - deepseek
        - generic-open
      requires_explicit_model: true
    official_source_url: "https://github.com/openai/codex"

  herdr:
    enabled: false
    delivery_stage: 3
    implementation:
      kind: native-cli
      command: herdr
      executable: "herdr"
    contract:
      protocol: herdr-local-api
    runtime_range:
      platforms:
        - darwin-arm64
    model_family_constraints:
      allowed: []
      requires_explicit_model: true
      route_role: visibility-and-wakeup-only
    official_source_url: "https://github.com/ogulcancelik/herdr"

  pi-rpc:
    enabled: false
    disabled_reason: "No trusted open-weight Pi provider/model is currently available in the installed account; activation would route to an unavailable provider."
    delivery_stage: 4
    implementation:
      kind: npm-cli
      package: "@earendil-works/pi-coding-agent"
      executable: "pi"
    contract:
      protocol: pi-jsonl-rpc
    runtime_range:
      fabric_node: ">=24.15.0 <25"
      upstream_node: ">=22.19.0"
      platforms:
        - darwin-arm64
    model_family_constraints:
      allowed:
        - generic-open
        - open-weight
      allowed_model_patterns:
        - "deepseek-*"
        - "glm-*"
        - "kimi-*"
        - "llama-*"
        - "minimax-*"
        - "mistral-*"
        - "mixtral-*"
        - "qwen*"
      requires_explicit_model: true
      route_role: generic-or-open-model-worker
    official_source_url: "https://github.com/earendil-works/pi"

  agy:
    enabled: true
    delivery_stage: 4
    implementation:
      kind: native-cli
      command: agy
      executable: "agy"
      provider_identity: apple-designated
    contract:
      protocol: agy-cli
    runtime_range:
      platforms:
        - darwin-arm64
    model_family_constraints:
      allowed:
        - google
        - anthropic
      requires_explicit_model: true
      route_role: google-primary-anthropic-fallback-worker
    official_source_url: "https://github.com/google-antigravity/antigravity-cli"

  cursor-agent:
    enabled: true
    delivery_stage: 4
    implementation:
      kind: bundled-cli
      command: cursor-agent
      executable: "cursor-agent"
      cursor_install_root: "${USER_HOME}/.local/share/cursor-agent"
      provider_identity: cursor-partial-signed-helpers
    contract:
      protocol: cursor-agent-stream-json-cli
    runtime_range:
      platforms:
        - darwin-arm64
    model_family_constraints:
      allowed:
        - generic-open
        - cursor-composer
        - xai
        - anthropic
        - openai
        - google
      requires_explicit_model: true
    official_source_url: "https://cursor.com/docs/cli/overview"

  copilot:
    enabled: false
    disabled_reason: "Copilot CLI execution is dormant: non-interactive mode may require broad tool permissions, and no bounded ordinary invocation is verified. Requires CF_DISPATCH_ENABLE_COPILOT=1 at the dispatcher."
    delivery_stage: 4
    implementation:
      kind: native-cli
      command: copilot
      executable: "copilot"
      provider_identity: github-broker
    contract:
      protocol: copilot-cli
    runtime_range:
      platforms:
        - darwin-arm64
    model_family_constraints:
      allowed:
        - github
      requires_explicit_model: true
      route_role: optional-broker-worker
    official_source_url: "https://docs.github.com/en/copilot/how-tos/use-copilot-cli"

  kiro-acp:
    enabled: true
    delivery_stage: 4
    implementation:
      kind: native-cli
      command: kiro-cli
      executable: "kiro-cli"
      provider_identity: apple-designated
    contract:
      protocol: agent-client-protocol
    runtime_range:
      minimum_macos: "10.13"
      platforms:
        - darwin-arm64
        - darwin-x86_64
    model_family_constraints:
      # Attribution follows the upstream slug (claude → anthropic, deepseek →
      # deepseek, …). `auto` and unparseable ids stay open-weight and are not
      # assurance-eligible.
      allowed:
        - open-weight
        - anthropic
        - deepseek
        - zhipu
        - alibaba
        - minimax
      allowed_model_patterns:
        - "auto"
        - "claude-*"
        - "deepseek-*"
        - "glm-*"
        - "minimax-*"
        - "qwen*"
      requires_explicit_model: true
      route_role: open-model-worker
    official_source_url: "https://kiro.dev/docs/cli/acp/"

  opencode-acp:
    enabled: true
    delivery_stage: 4
    implementation:
      kind: native-cli
      command: opencode
      executable: "opencode"
      provider_identity: owner-controlled-install-root
    contract:
      protocol: opencode-run-cli
    runtime_range:
      platforms:
        - darwin-arm64
    model_family_constraints:
      # Brokers may front many vendors; allow the upstream families slug
      # inference can produce. Unparseable / stealth stay generic-open.
      allowed:
        - generic-open
        - anthropic
        - openai
        - google
        - deepseek
        - moonshot
        - zhipu
        - alibaba
        - minimax
        - mistral
        - meta
        - xai
        - cursor-composer
      allowed_model_patterns:
        - "opencode/*"
        - "opencode-go/*"
        - "openrouter/*"
        - "*/*"
      requires_explicit_model: false
      route_role: optional-free-account-worker
    official_source_url: "https://opencode.ai/docs/"

# ---------------------------------------------------------------------------
# Dispatch registry (P1b of #827): the product-owned single source for which
# adapters the dispatcher knows and how it may run them. `model-routing.json`
# is instance-owned (ADR 0019) and must never carry these policy facts.
#
# dispatch:  implemented — the dispatcher has an executing arm in
#            cf_dispatch.sh and Fabric may stage runs for it.
#            dormant — declared for routing; the dispatcher refuses with a
#            typed dormant status until an arm and a safety boundary exist.
#            unsupported — routing-only; no dispatcher arm is planned.
# write_modes — access modes the dispatcher arm can enforce. read_only is
#            implicit for every implemented adapter; worktree_write is listed
#            only where the arm actually enforces the one-writer lease.
# read_only_guarantee — what the dispatcher arm proves on a read-only route:
#            enforced | oauth_safe_mode | prompt_only | best_effort | none.
#            Mirrored for drift-testing from the dispatcher arms; never fed
#            into them.
# ---------------------------------------------------------------------------
dispatch_registry:
  agy:
    dispatch: implemented
    read_only_guarantee: prompt_only
  claude:
    dispatch: implemented
    read_only_guarantee: enforced
    write_modes: [worktree_write]
  codex:
    dispatch: implemented
    read_only_guarantee: enforced
    write_modes: [worktree_write]
  copilot:
    dispatch: implemented
    read_only_guarantee: none
  cursor:
    dispatch: implemented
    read_only_guarantee: enforced
  herdr:
    dispatch: unsupported
  kiro:
    dispatch: implemented
    read_only_guarantee: prompt_only
    write_modes: [worktree_write]
  opencode:
    dispatch: implemented
    read_only_guarantee: best_effort
    write_modes: [worktree_write]
