# CI suites: which jobs ci-status gates, when each runs, and what may skip it.
# Read by scripts/select-ci-suites (selection), scripts/check-ci-status (gate)
# and scripts/check-ci-suites (manifest against .github/workflows/ci.yml).
# Spec: docs/specs/ci.md. Decision: docs/adr/0041-tiered-ci-from-green-evidence.md.
#
# Globs match whole repository-relative paths: `**` spans any number of
# directories, `*` and `?` stay within one path segment. No braces.
schema_version = 1

# Jobs outside every suite. `always` jobs must succeed on every run; `ungated`
# jobs run after ci-status and never gate it.
[jobs]
always = ["scope"]
# `rerun-failed` produces re-run evidence for main-health before ci-status but
# never gates it: a skipped re-run on a green main must not stall the gate.
ungated = ["main-health", "rerun-failed"]

# Cheap jobs that must finish before an expensive suite's jobs start. A failed
# gate leaves those jobs skipped, so no scarce runner is claimed for a change
# that does not compile; a skipped gate (its own suite covered by evidence)
# still lets an independently selected gated suite run. The workflow edge is
# asserted by scripts/check-ci-suites.
[[gate]]
job = "rust-lint"
suites = ["macos_lint", "macos_native", "macos_release"]

[evidence]
# Green ci-status push runs of this workflow on this branch are evidence.
workflow = "ci.yml"
branch = "main"
# Newest runs searched for a green ancestor of the tested commit; none found
# runs every suite.
lookback = 30
# The artifact ci-status uploads; a pull request's next run reads it.
artifact = "ci-evidence"

[request]
# A pull request carrying this label, or a dispatch with tier=full, runs
# every suite. Push after labelling, or dispatch, to start the full run.
full_label = "ci:full"
# A PR label forces these suites on the next run. Dispatches run them too.
macos_label = "ci:macos"
macos_suites = ["macos_lint", "macos_native", "macos_release"]

# A change to any of these runs every suite: the pipeline or toolchain moved.
[full]
paths = [
  ".github/workflows/ci.yml",
  ".github/actions/**",
  "config/ci-suites.toml",
  "scripts/select-ci-suites",
  "scripts/check-ci-status",
  "rust-toolchain.toml",
  "tools/front-door/rust-toolchain.toml",
  "tools/front-door/Cargo.lock",
  "tools/front-door/.cargo/**",
]

# Prose and media that no build or test reads. A suite inherits this list
# unless it sets its own `inert`; `watch` re-admits paths a suite does read.
[defaults]
inert = [
  "*.md",
  "docs/**/*.md",
  "docs/**/*.png",
  "docs/**/*.jpg",
  "docs/**/*.jpeg",
  "docs/**/*.svg",
  "docs/**/*.gif",
  "docs/**/*.webp",
  "docs/**/*.pdf",
  "skills/**/*.md",
  "roles/**/*.md",
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  "LICENSE",
  "NOTICE",
]

# Harness, prose, link, spelling, workflow and script checks: every change.
[[suite]]
name = "checks"
tier = "pr"
cost_minutes = 5
jobs = ["repo-checks"]
inert = []

# Linux Rust: format, lint, dependency policy, generated reference and
# artefacts, and the affected-crate test partitions.
[[suite]]
name = "rust"
tier = "pr"
cost_minutes = 12
jobs = [
  "generated-reference",
  "generated",
  "rust-lint",
  "rust-dependencies",
  "rust-test-archive",
  "quarantine-filter",
  "quarantine-validation",
  "rust",
]
# Rust tests read these prose files.
watch = ["skills/legal-writing/references/**"]
# Main-tier tests: a nextest filterset these Linux partitions skip on pull
# requests and run on main and full runs. Tag a test by putting it in a module
# named `main_tier`, or add a filterset term here. Empty runs every test.
main_tests = "test(/(^|::)main_tier::/)"

# macOS Clippy: inventory of files with macOS-specific cfg, checked for drift.
# Cross-platform changes may still break macOS; main runs every suite.
