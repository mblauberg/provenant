name: Feature
description: One user-visible outcome; this issue is the spec.
type: Feature
body:
  - type: markdown
    attributes:
      value: >-
        The issue body is the spec and expires with the delivering pull request. Remove secrets and private material. Cite code as path#Symbol, never line numbers or scratch files. Set the parent as a native sub-issue, not in the body.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: >-
        The user-visible result and why.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and out of scope
      description: >-
        The bounded change and what stays untouched.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: >-
        One observable statement per line, each tagged with how it is verified: [test], [command], [capture] or [review]. Implementers cannot weaken these.
    validations:
      required: true

  - type: textarea
    id: must-not-change
    attributes:
      label: Must not change
      description: >-
        Behaviour that has to survive.
    validations:
      required: false

  - type: textarea
    id: verify
    attributes:
      label: Verify
      description: >-
        The command or check that proves it.
    validations:
      required: true

  - type: textarea
    id: durable-home
    attributes:
      label: Durable home
      description: >-
        The doc that absorbs any settled rule in the same PR, or None.
    validations:
      required: true
