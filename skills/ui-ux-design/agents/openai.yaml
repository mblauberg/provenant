interface:
  display_name: UI/UX Design
  short_description: Read-only UI/UX review by default; changes go through deliver
  default_prompt: Use $ui-ux-design. Infer intent from the whole request. Review, audit, comparison, and advice without change intent are read-only. A clear review-and-fix, build, redesign or polish request routes to `deliver` as primary with UI/UX as companion. Never require harness terminology from the user.
