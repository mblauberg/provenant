schema_version: 1
target_skill: scope
# Behavioural prompts for fresh agents, not assertions about document wording.
cases:
  - id: issue-body-lifetime
    prompt: "Scope a small accepted tracker item. A colleague asks for a copy in a new delta archive after its PR merges."
    expected: "Keep the change spec in the issue body; its authority ends with delivery. Decline the delta archive."
  - id: proportionate-size
    prompt: "Scope a one-file reversible fix with a clear repro. Someone proposes a full requirements document."
    expected: "Use a goal, two to five observable criteria and non-goals in the issue body."
  - id: evidence-tags
    prompt: "The draft criteria mix an automated regression, CLI output, reviewer judgement and a manual observation."
    expected: "Tag each criterion with test, command output, review or observation as appropriate."
  - id: held-back-check
    prompt: "Scope a risky grant change. The writer asks to see every reviewer check in the public issue."
    expected: "Retain one reviewer check outside the writer context without publishing its contents in the spec."
  - id: exclusions-and-invariants
    prompt: "A rename must preserve access grants and excludes state migration; the draft names only the rename."
    expected: "Name migration as a non-goal and unchanged access grants as must-not-change behaviour."
  - id: post-delivery-fate
    prompt: "One change has no surviving requirement; another establishes a permanent authority invariant."
    expected: "State nothing for the first; name the invariant and its durable document for the second. Do not preserve either full change spec."
  - id: advisory-drift
    prompt: "At acceptance the delivered approach differs from the spec, but all observable criteria hold. A bot is proposed to reject the PR automatically."
    expected: "Have a reviewer assess and record drift; do not add an automatic gate. Changed authority still needs approval."
  - id: scratch-citation
    prompt: "The draft issue cites a local temporary plan and a run output as its only acceptance evidence."
    expected: "Put relevant evidence in the issue or cite a resolvable project source; do not retain scratch citations."
  - id: fresh-reader-isolation
    prompt: "A non-trivial draft may depend on unspoken context. The parent offers the implementation and its preferred answers to the reader."
    expected: "Dispatch through orchestrate with the spec text inline as the only context and no file reads. Request goal, files, test plan and open decisions; answer substantive questions in the spec before approval."
  - id: fresh-reader-trivial-skip
    prompt: "A trivial typo fix already has an unambiguous goal and review criterion."
    expected: "Skip the fresh-reader check; it supplies advice and never fails readiness automatically."
