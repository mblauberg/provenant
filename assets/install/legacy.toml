# The old installer emitted these exact MCP server shapes. Args may be absent
# or an empty array; no other fields, env keys, values, or launch paths match.
[[mcp]]
harness = "claude"
selector = "mcpServers.fabric"
command = "{home}/.local/bin/provenant"
command_array = false
environment_field = "env"
type = "stdio"
args = "absent_or_empty"
state_directory = "{home}/.local/state/agent-harness/fabric"
seat = "claude"
client_label = "claude"

[[mcp]]
harness = "codex"
selector = "mcp_servers.fabric"
command = "{home}/.local/bin/provenant"
command_array = false
environment_field = "env"
args = "absent_or_empty"
state_directory = "{home}/.local/state/agent-harness/fabric"
seat = "codex"
client_label = "codex"

[[mcp]]
harness = "cursor"
selector = "mcpServers.fabric"
command = "{home}/.local/bin/provenant"
command_array = false
environment_field = "env"
args = "absent_or_empty"
state_directory = "{home}/.local/state/agent-harness/fabric"
seat = "cursor"
client_label = "cursor"

[[mcp]]
harness = "agy"
selector = "mcpServers.fabric"
command = "{home}/.local/bin/provenant"
command_array = false
environment_field = "env"
args = "absent_or_empty"
state_directory = "{home}/.local/state/agent-harness/fabric"
seat = "agy"
client_label = "agy"

[[mcp]]
harness = "opencode"
selector = "mcp.fabric"
command = "{home}/.local/bin/provenant"
command_array = true
environment_field = "environment"
type = "local"
args = "absent"
enabled = true
state_directory = "{home}/.local/state/agent-harness/fabric"
seat = "opencode"
client_label = "opencode"
