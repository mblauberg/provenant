# Git hook links are matched under the verified Git hooks directory by the
# binary composition edge; only the source target is compiled here.
[[git_hooks]]
name = "pre-push"
source = "scripts/hooks/pre-push"
disposition = "replace"

[[git_hooks]]
name = "post-merge"
source = "scripts/hooks/post-merge"
disposition = "remove"

# The absolute interpreter used by utility_output_hook.py is host-specific.
# No literal is accepted without a recorded fixture, so the root list remains empty.

# Claude hooks are exact event, matcher, command, and command-leaf fixtures.
[[hooks]]
id = "compact_reinject"
harness = "claude"
event = "SessionStart"
matcher = "compact"
command_form = "python3_double_quoted"
source = "skills/session/scripts/compact_reinject.py"
args = []
disposition = "replace"

[[hooks]]
id = "state_check"
harness = "claude"
event = "PreCompact"
command_form = "python3_double_quoted"
source = "skills/session/scripts/state_check.py"
args = ["--hook"]
disposition = "replace"

[[hooks]]
id = "lane_safety_guard"
harness = "claude"
event = "PreToolUse"
matcher = "Bash"
command_form = "python3_shell_quoted"
source = "scripts/lane_safety_guard.py"
args = []
disposition = "replace"

[[hooks]]
id = "routing_context_session"
harness = "claude"
event = "SessionStart"
matcher = "startup|resume|clear|compact"
command_form = "python3_shell_quoted"
source = "scripts/routing_context_hook.py"
args = []
disposition = "remove"

[[hooks]]
id = "routing_context_pre_tool"
harness = "claude"
event = "PreToolUse"
matcher = "Agent|.*fabric_dispatch"
command_form = "python3_shell_quoted"
source = "scripts/routing_context_hook.py"
args = ["--pre-tool"]
disposition = "remove"

[[hooks]]
id = "utility_output"
harness = "claude"
event = "PostToolUse"
matcher = "Bash"
command_form = "absolute_python_shell_quoted"
source = "scripts/utility_output_hook.py"
args = []
timeout = 30
disposition = "remove"

