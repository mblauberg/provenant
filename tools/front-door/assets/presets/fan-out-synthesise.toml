stages = [{ id = "branch", count = "${width}", min_successful = "${min_branches}" }, { id = "synthesis", kind = "synthesise" }]

[pattern]
level = "recommended"
summary = "Independent read-only branches, then one synthesis of their results."
cost = "width + 1 attempts"
select_when = "Several views must be reconciled into one answer."
tags = ["primitive"]

[plan]
# With --plan on, a principal planner replaces the static branch stage with
# workers it chooses. It instantiates only this pattern.
replaces = "branch"
explicit = ["width"]
guidance = """Choose how many workers to run and give each one distinct question to answer, on a route that suits its difficulty. Prefer the default width unless the brief clearly needs fewer or more, and never repeat a question."""

[[plan.patterns]]
name = "worker"
exports = [{ node = "worker", outputs = ["result"] }]
nodes = [
  { id = "worker", brief = "Your question: ${question}", tier = "${route}", acceptance_checks = ["Answer the question from the repository and cite the evidence"] },
]

[plan.patterns.parameters]
question = { type = "string", doc = "The one question this worker answers." }
route = { type = "string", default = "senior", enum = ["junior", "senior", "principal"], doc = "Route alias for the worker." }

[parameters]
route = { type = "string", default = "senior", doc = "Routing pool for every branch and the synthesis." }
min_branches = { type = "integer", optional = true, min = 1, doc = "Minimum successful branches; by default all must succeed." }
width = { type = "integer", default = 2, min = 1, max = 32, doc = "Number of parallel branches." }
