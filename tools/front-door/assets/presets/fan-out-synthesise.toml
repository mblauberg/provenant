stages = [{ id = "branch", count = "${width}", for_each_if_nonempty = "${branches}", item_route_field = "tier", item_fields = { prompt = "${item.brief}", tier = "${item.tier}" }, min_successful = "${min_branches}" }, { id = "synthesis", kind = "synthesise", tier = "${synthesis_route}" }]

[pattern]
level = "recommended"
summary = "Independent read-only branches, then one synthesis of their results."
cost = "width + 1 attempts"
select_when = "Several views must be reconciled into one answer."
tags = ["primitive"]


[parameters]
route = { type = "string", default = "senior", doc = "Default routing pool for branches and synthesis." }
synthesis_route = { type = "string", optional = true, doc = "Route for synthesis; defaults to route." }
branches = { type = "list", default = [], max = 32, doc = "Optional branch entries with id, brief and tier." }
min_branches = { type = "integer", optional = true, min = 1, doc = "Minimum successful branches; by default all must succeed." }
width = { type = "integer", default = 2, min = 1, max = 32, doc = "Number of parallel branches." }
