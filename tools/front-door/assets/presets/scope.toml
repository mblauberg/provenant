stages = [{ id = "scope", role = "scope", read_only_floor = true }]

[pattern]
level = "recommended"
summary = "Read the repository and produce a bounded implementation brief without tree writes."
cost = "1 senior attempt"
select_when = "A task needs an implementation scope and acceptance criteria before writing code."
tags = ["read-only", "scoping"]

[parameters]
read_roots = { type = "list", default = [], doc = "Additional repository read roots." }

[roles.scope]
tier = "senior"
access = "read_only"
read_roots = "${read_roots}"
outputs = ["result", "findings"]
prompt = """
Scope this task: ${prompt}
Read the repository and return the affected surfaces, a literal write scope,
acceptance criteria, targeted checks, risks and unresolved owner decisions.
Do not modify the repository. Put temporary notes in attempt-private scratch.
"""
