shape_stages = { frame = "subject", panel = "lenses", verifier = "verify", synthesis = "synthesis" }
stages = [
  { id = "subject", role = "plan.review" },
  { id = "lenses", min_successful = "${min_reviews}", parallel = [
    { id = "lens", for_each = "${lenses}", review_lenses = true, role = "lens.${item.name}", require_findings = true },
  ], source = { type = "node", node = "subject" } },
  { id = "verify", role = "review.verify", count = "${verifiers}", source = { type = "node", node = "subject" } },
  { id = "synthesis", role = "review.synthesis", depends_on = ["lenses"] },
]
exports = [{ node = "synthesis", outputs = ["result", "findings", "verdict", "commit"] }]

[pattern]
level = "default"
summary = "Independent lenses review one immutable subject; a verifier, preferably from another model family through configured routing, tries to falsify the findings; a senior synthesis reconciles them with a disposition per finding."
citations = ["Google engineering practices, code review", "Claude Code review and Bugbot vendor reports (vendor-reported)"]
cost = "1 framing attempt + one attempt per selected lens + verifiers + 1 synthesis"
select_when = "A change needs review before it lands; depth follows the routing review shape."
tags = ["review"]

[plan]
# With --plan on, a principal planner replaces the static lens stage. The
# routing review panel decides which lenses are allowed for the subject; the
# planner picks among them and sets each lens's tier. Verification and the
# synthesis still run.
replaces = "lenses"
explicit = ["lenses"]
by_size = true
subject_types = ["commit"]
guidance = """Each catalogue pattern is one lens the review panel allows for this subject. Instantiate the lenses the change needs, at most once each, and choose a tier for each: a lower tier for mechanical checks, a higher one where a miss would be costly. Always include the correctness lens. You cannot add a lens the catalogue does not list."""

[[plan.patterns]]
for_each = "lenses"
name = "lens-${item.name}"
exports = [{ node = "lens", outputs = ["result", "findings", "verdict", "commit"] }]
nodes = [
  { id = "lens", role = "lens.${item.name}", source = "${subject}", tier = "${tier}", require_findings = true, acceptance_checks = ["Review the pinned commit through this lens only", "End with one exact VERDICT line"] },
]

[plan.patterns.parameters]
tier = { type = "string", default = "${item.tier}", enum = ["junior", "senior", "principal"], doc = "Route alias for the lens." }

[parameters]
local_check_policy = { type = "string", inherit = true, default = "", doc = "Local check policy inherited by nested presets; empty uses the layered roles library." }
subject = { type = "table", inherit = true, default = { type = "commit", commit = "HEAD" }, doc = "Immutable review subject: a commit, a node or the integration head." }
worktree = { type = "string", default = "", doc = "Worktree the reviewers may read." }
base = { type = "string", default = "", doc = "Diff reference the change is measured from, for example origin/main." }
selection_range = { type = "string", default = "", doc = "Optional Git range used to select lenses and shape; empty measures the subject against base." }
spec_max_bytes = { type = "integer", default = 16384, min = 1, max = 65536, doc = "Maximum bytes of a file spec included in each review brief." }
spec = { type = "string", default = "", doc = "Issue number or file the change answers." }
review_shape = { type = "string", default = "", doc = "Review depth override from routing review shapes (quick, standard, deep)." }
risk_tier = { type = "string", inherit = true, bind = "risk_tier", default = "", doc = "Risk tier that selects the review shape." }
kind = { type = "string", bind = "kind", default = "", doc = "Change kind, for example refactor, integration, or docs." }
size = { type = "string", default = "", doc = "Review size override: small, medium, or large." }
min_reviews = { type = "integer", default = 0, min = 0, max = 32, doc = "Lenses that must succeed. Fewer fails the lens group, which stops the council for the chair to substitute a lens or decide. 0 takes the review ladder minimum for risk_tier, at least 1." }
verifiers = { type = "integer", default = 1, min = 0, max = 1, doc = "Verifier stages between the lenses and the synthesis, preferably from another model family; 0 skips verification." }
verifier_tier = { type = "string", default = "verifier", doc = "Route for the verifier. Define a route named verifier in another model family; without one the senior route is used and the substitution is recorded." }
risk_tags = { type = "list", default = [], doc = "Tags that trigger conditional lenses: security, concurrency, terminal." }
# Lens tiers left empty come from the routing review shape. Set a tier to override.
# Slots fill in this order; routing's review.lenses.order and kind rules reorder or
# extend it unless a caller supplies its own list, which keeps its order.
[parameters.lenses]
type = "list"
inherit_explicit = true
default = [
  { name = "correctness-spec", tier = "", when = "" },
  { name = "tests", tier = "", when = "" },
  { name = "design-fit-reuse", tier = "", when = "" },
  { name = "simplicity", tier = "", when = "" },
  { name = "reliability", tier = "", when = "" },
  { name = "conventions-readability", tier = "", when = "" },
  { name = "refactor-cleanup", tier = "", when = "" },
  { name = "flexibility", tier = "", when = "" },
  { name = "security-privacy", tier = "", when = "security" },
  { name = "concurrency-data-errors", tier = "", when = "concurrency" },
  { name = "adversarial", tier = "", when = "terminal" },
]
