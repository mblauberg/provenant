stages = [
  { id = "scouts", parallel = [
    { id = "scout", role = "scout.codebase", count = "${width}" },
    { id = "external", role = "scout.external", count = "${external}" },
  ] },
  { id = "synthesis", role = "plan.research" },
]
exports = [{ node = "synthesis", outputs = ["result", "findings"] }]

[pattern]
level = "recommended"
summary = "Junior read-only scouts map the problem in parallel; a senior synthesis reconciles their evidence."
citations = ["Anthropic, how we built our multi-agent research system"]
cost = "width junior attempts + 1 senior synthesis"
select_when = "The scope of a task is unclear and a wide read-only survey is cheaper than guessing."
tags = ["research", "read-only"]

[parameters]
width = { type = "integer", default = 4, min = 1, max = 32, doc = "Number of parallel scouts." }
external = { type = "integer", default = 1, min = 0, max = 8, doc = "External scouts that research outward; 0 opts out and is recorded as an explicit parameter." }
read_roots = { type = "list", default = [], doc = "Extra read roots, for example another worktree." }
