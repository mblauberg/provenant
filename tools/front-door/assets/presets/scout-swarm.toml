stages = [
  { id = "scouts", parallel = [
    { id = "scout", role = "scout.codebase", count = "${width}" },
    { id = "external", role = "scout.external", count = "${external}" },
  ] },
  { id = "synthesis", role = "plan.research" },
]
exports = [{ node = "synthesis", outputs = ["result", "findings"] }]

[pattern]
level = "recommended"
summary = "Junior read-only scouts map the problem in parallel; a senior synthesis reconciles their evidence."
citations = ["Anthropic, how we built our multi-agent research system"]
cost = "width junior attempts + 1 senior synthesis"
select_when = "The scope of a task is unclear and a wide read-only survey is cheaper than guessing."
tags = ["research", "read-only"]

[plan]
# With --plan on, a principal planner replaces the static scouts stage. It
# instantiates only these patterns; the synthesis stage still runs.
replaces = "scouts"
explicit = ["width"]
guidance = """Choose how many scouts to run and give each one distinct question to answer. Use codebase scouts for questions the repository can answer and an external scout for questions that need documentation, upstream source or prior art. Prefer the default width unless the brief clearly needs fewer or more, and never repeat a question."""

[[plan.patterns]]
name = "scout"
exports = [{ node = "scout", outputs = ["result", "findings"] }]
nodes = [
  { id = "scout", role = "scout.codebase", brief = "Your question: ${question}", tier = "${route}", acceptance_checks = ["Answer the question from the repository", "Cite the files and evidence behind each claim"] },
]

[plan.patterns.parameters]
question = { type = "string", doc = "The one question this scout answers." }
route = { type = "string", default = "junior", enum = ["junior", "senior", "principal"], doc = "Route alias for the scout." }

[[plan.patterns]]
name = "external-scout"
exports = [{ node = "scout", outputs = ["result", "findings"] }]
nodes = [
  { id = "scout", role = "scout.external", brief = "Your question: ${question}", acceptance_checks = ["Answer the question from primary sources", "Give each source with its URL and date"] },
]

[plan.patterns.parameters]
question = { type = "string", doc = "The one question this external scout researches." }

[parameters]
width = { type = "integer", default = 4, min = 1, max = 32, doc = "Number of parallel scouts." }
external = { type = "integer", default = 1, min = 0, max = 8, doc = "External scouts that research outward; 0 opts out and is recorded as an explicit parameter." }
read_roots = { type = "list", default = [], doc = "Extra read roots, for example another worktree." }
