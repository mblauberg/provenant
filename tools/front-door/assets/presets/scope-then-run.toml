stages = [
  { id = "scout", preset = "scout-swarm", parameters = { width = "${width}", external = "${external}", read_roots = "${read_roots}" } },
  { id = "scope", role = "plan.scope" },
  { id = "ready", kind = "gate", condition = { type = "verdict", expected = "VERDICT: PASS", threshold = "all" }, inputs = [{ node = "scope", outputs = ["verdict"] }] },
  { id = "run", preset = "generator-evaluator", depends_on = ["scope"], inputs = [{ node = "scope", outputs = ["result"] }], parameters = { worktree = "${worktree}", scope = "${write_scope}", base = "${base}", spec = "${spec}", delivery = "${delivery}", review_shape = "${review_shape}", risk_tags = "${risk_tags}" } },
]
exports = [{ node = "run", outputs = ["result", "findings"] }]

[pattern]
level = "recommended"
summary = "Scout the problem, turn the evidence into acceptance criteria and a write scope, gate on the scope being ready, then implement and evaluate."
citations = ["Anthropic, how we built our multi-agent research system"]
cost = "scouts + 1 scoping attempt + generator-evaluator"
select_when = "The brief is not yet an approved slice: scope is unclear or acceptance criteria are missing."
tags = ["research", "write", "review"]

[plan]
# With --plan on, a principal planner replaces the static scouts stage. It
# instantiates only these patterns; the scope and run stages still follow.
replaces = "scout"
explicit = ["width"]
# The static scout stage reconciles its scouts in a synthesis; the planned one
# does it here, ahead of scoping.
after = [{ id = "synthesis", role = "plan.research" }]
guidance = """Decide whether to scout at all: when the brief and the spec already answer what the scope stage needs, instantiate no-scout once and say why. Otherwise choose how many scouts to run and give each one distinct question to answer. Use codebase scouts for questions the repository can answer and, when the catalogue offers one, an external scout for questions that need documentation, upstream source or prior art. Prefer the default width unless the brief clearly needs fewer or more, and never repeat a question."""

[[plan.patterns]]
name = "scout"
exports = [{ node = "scout", outputs = ["result", "findings"] }]
nodes = [
  { id = "scout", role = "scout.codebase", brief = "Your question: ${question}", tier = "${route}", acceptance_checks = ["Answer the question from the repository", "Cite the files and evidence behind each claim"] },
]

[plan.patterns.parameters]
question = { type = "string", doc = "The one question this scout answers." }
route = { type = "string", default = "junior", enum = ["junior", "senior", "principal"], doc = "Route alias for the scout." }

[[plan.patterns]]
name = "external-scout"
enabled_by = "external"
exports = [{ node = "scout", outputs = ["result", "findings"] }]
nodes = [
  { id = "scout", role = "scout.external", brief = "Your question: ${question}", acceptance_checks = ["Answer the question from primary sources", "Give each source with its URL and date"] },
]

[plan.patterns.parameters]
question = { type = "string", doc = "The one question this external scout researches." }

[[plan.patterns]]
name = "no-scout"
exports = [{ node = "note", outputs = ["result", "findings"] }]
nodes = [
  { id = "note", tier = "junior", brief = "No scouting is needed because: ${reason}. Write a short note of the facts in the brief that the scoping stage can rely on and what it must still decide.", acceptance_checks = ["State what the scoping stage can rely on", "Name anything still unknown"] },
]

[plan.patterns.parameters]
reason = { type = "string", doc = "Why the brief already answers what the scope stage needs." }

[parameters]
local_check_policy = { type = "string", inherit = true, default = "", doc = "Local check policy inherited by nested presets; empty uses the layered roles library." }
width = { type = "integer", default = 3, min = 1, max = 32, doc = "Number of parallel scouts." }
external = { type = "integer", default = 1, min = 0, max = 8, doc = "External scouts that research outward; 0 opts out." }
read_roots = { type = "list", default = [], doc = "Extra read roots for the scouts." }
worktree = { type = "string", default = "", doc = "Registered writer worktree for the run stage." }
write_scope = { type = "list", default = ["."], doc = "Literal relative paths the writer may change." }
base = { type = "string", default = "", doc = "Diff reference the slice is measured from." }
spec = { type = "string", default = "", doc = "Issue number or file holding any existing acceptance criteria." }
delivery = { type = "string", default = "none", doc = "Delivery mode for the writer commit." }
review_shape = { type = "string", default = "", doc = "Explicit review shape override." }
risk_tags = { type = "list", default = [], doc = "Tags that trigger conditional lenses." }
