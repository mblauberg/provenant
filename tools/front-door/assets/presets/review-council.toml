stages = [
  { id = "subject", role = "review-subject" },
  { id = "lenses", parallel = [
    { id = "lens", for_each = "${lenses}", role = "lens" },
  ], source = { type = "node", node = "subject" } },
  { id = "synthesis", role = "synthesiser" },
]
exports = [{ node = "synthesis", outputs = ["result", "findings", "verdict", "commit"] }]

[pattern]
level = "default"
summary = "Independent lenses review one immutable subject; a senior synthesis reconciles them without voting."
citations = ["Google engineering practices, code review", "Claude Code review and Bugbot vendor reports (vendor-reported)"]
cost = "1 framing attempt + one attempt per selected lens + 1 synthesis"
select_when = "A change needs review before it lands; depth follows the routing review shape."
tags = ["review"]

[parameters]
subject = { type = "table", default = { type = "commit", commit = "HEAD" }, doc = "Immutable review subject: a commit, a node or the integration head." }
worktree = { type = "string", default = "", doc = "Worktree the reviewers may read." }
base = { type = "string", default = "", doc = "Diff reference the change is measured from, for example origin/main." }
spec = { type = "string", default = "", doc = "Issue number or file the change answers." }
review_shape = { type = "string", default = "", doc = "Review depth override from routing review shapes (quick, standard, deep)." }
risk_tier = { type = "string", default = "", doc = "Risk tier that selects the review shape." }
risk_tags = { type = "list", default = [], doc = "Tags that trigger conditional lenses: security, concurrency, terminal." }
# Lens tiers left empty come from the routing review shape. Set a tier to override.
lenses = [
  { name = "correctness-spec", tier = "", prompt_file = "code-review/lenses/correctness-spec", distinct_from = "writer", when = "" },
  { name = "design-fit-reuse", tier = "", prompt_file = "code-review/lenses/design-fit-reuse", distinct_from = "", when = "" },
  { name = "simplicity", tier = "", prompt_file = "code-review/lenses/simplicity", distinct_from = "", when = "" },
  { name = "conventions-readability", tier = "", prompt_file = "code-review/lenses/conventions-readability", distinct_from = "", when = "" },
  { name = "tests", tier = "", prompt_file = "code-review/lenses/tests", distinct_from = "", when = "" },
  { name = "security-privacy", tier = "", prompt_file = "code-review/lenses/security-privacy", distinct_from = "", when = "security" },
  { name = "concurrency-data-errors", tier = "", prompt_file = "code-review/lenses/concurrency-data-errors", distinct_from = "", when = "concurrency" },
  { name = "adversarial", tier = "", prompt_file = "code-review/lenses/adversarial", distinct_from = "", when = "terminal" },
]

[roles.review-subject]
tier = "senior"
worktree = "${worktree}"
source = "${subject}"
prompt = """
Frame the immutable review subject for: ${prompt}
Base (diff reference): ${base}
Spec (acceptance criteria): ${spec}
Identify acceptance criteria and risk areas from the pinned source commit,
reading the spec where one is named. Do not edit files. Subsequent independent
lenses review this exact commit against the base and the spec.
"""

[roles.lens]
tier = "${item.tier}"
worktree = "${worktree}"
distinct_from = "${item.distinct_from}"
prompt_file = ["code-review/reviewer-context", "${item.prompt_file}"]
prompt = """
Lens: ${item.name}. Subject: ${prompt}
Base (diff reference): ${base}
Spec (acceptance criteria): ${spec}
"""

[roles.synthesiser]
tier = "senior"
kind = "synthesise"
worktree = "${worktree}"
source = { type = "node", node = "subject" }
prompt = """
Reconcile independent review findings against evidence for: ${prompt}
Do not take a majority vote. Preserve all actionable findings and unresolved
uncertainty, and weigh each finding by its evidence. Emit one exact
VERDICT: PASS only when acceptance evidence is satisfied, otherwise
VERDICT: FAIL.
"""
