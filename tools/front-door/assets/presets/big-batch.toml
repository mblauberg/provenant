integration_branch = "${integration_branch}"
stages = [
  { id = "scout", preset = "scout-swarm", count = "${scout}", advisory = true, parameters = { width = "${width}", external = "${external}", read_roots = "${read_roots}" } },
  { id = "lanes", parallel = [
    { id = "lane", for_each = "${lanes}", preset = "generator-evaluator", parameters = { worktree = "${item.worktree}", scope = "${item.scope}", spec = "${item.spec}", spec_max_bytes = "${spec_max_bytes}", base = "${base}", delivery = "integrate:${integration_branch}" } },
  ] },
  { id = "council", preset = "review", parameters = { subject = { type = "integration" }, worktree = "${batch_worktree}", base = "${base}", spec = "${spec}", spec_max_bytes = "${spec_max_bytes}", risk_tier = "${risk_tier}", review_shape = "${review_shape}", kind = "${kind}", size = "${size}", risk_tags = "${risk_tags}" } },
  { id = "refactor", role = "refactor-principal" },
  { id = "repair", loop = { max_rounds = 2, until = "accept", stages = [
    { id = "fix", role = "repairer" },
    { id = "review", preset = "review", parameters = { subject = { type = "node", node = "fix" }, worktree = "${batch_worktree}", base = "${base}", spec = "${spec}", spec_max_bytes = "${spec_max_bytes}", risk_tier = "${risk_tier}", review_shape = "${review_shape}", kind = "${kind}", size = "${size}", risk_tags = "${risk_tags}" } },
    { id = "accept", kind = "gate", condition = { type = "verdict", expected = "VERDICT: PASS", threshold = "all" }, inputs = [{ node = "review", outputs = ["verdict"] }] },
  ] } },
]

[pattern]
level = "recommended"
summary = "Scout, parallel writer lanes with lenses, a combined council, a principal refactor and bounded repair."
citations = []
cost = "scouts + lanes x (1 writer + lenses) + council + refactor + up to 2 repair rounds"
select_when = "Several partitioned slices of one approved spec land together on a batch branch."
tags = ["write", "review", "batch"]

[plan]
# With --plan on, a principal planner replaces the static lanes stage. It
# instantiates only these patterns; the council and repair stages still run.
replaces = "lanes"
explicit = ["lanes"]
guidance = """Split the work into waves of writer lanes. Give each lane its own worktree, a literal write scope disjoint from the other lanes in its wave, the subset of acceptance items it owns, a route and a budget. Prefer junior for mechanical, well-specified lanes, senior for contained design, and at most one principal lane per wave; override these suggestions as needed. End every wave with a wave-barrier whose depends_on and inputs name that wave's lanes, and make the next wave's lanes depend on the barrier."""

[[plan.patterns]]
name = "writer-lane"
# The lane uses the same review flow as the static generator-evaluator lane.
exports = [
  { node = "implement", outputs = ["branch", "commit"] },
  { node = "evaluate", outputs = ["result", "findings", "verdict"] },
]
nodes = [
  { id = "implement", role = "write.implement", title = "Lane ${lane}", brief = "Lane ${lane}. Time budget: ${budget_seconds} seconds; commit your work and stop with a handoff before it passes.", deadline_seconds = "${budget_seconds}", worktree = "${worktree}", delivery = "integrate:${integration_branch}", tier = "${route}", write_scope = "${scope}", acceptance_checks = "${acceptance}" },
  { id = "review", preset = "review", depends_on = ["implement"], parameters = { subject = { type = "node", node = "implement" }, worktree = "${worktree}", base = "${base}", spec = "${spec}", spec_max_bytes = "${spec_max_bytes}", risk_tier = "${risk_tier}", review_shape = "${review_shape}", kind = "${kind}", size = "${size}", risk_tags = "${risk_tags}" } },
  { id = "evaluate", role = "review.evaluator", tier = "senior", depends_on = ["review", "implement"], source = { type = "node", node = "implement" }, inputs = [{ node = "review", outputs = ["result", "findings"] }], acceptance_checks = ["Give every finding one disposition", "End with one exact VERDICT line"] },
]

[plan.patterns.parameters]
lane = { type = "string", doc = "Short lane name." }
worktree = { type = "string", enum = "${worktrees}", doc = "Registered writer worktree for the lane." }
scope = { type = "list", min = 1, doc = "Literal relative paths the lane may change; disjoint within a wave." }
acceptance = { type = "list", min = 1, doc = "The acceptance items this lane owns." }
route = { type = "string", default = "junior", enum = ["junior", "senior", "principal"], doc = "Route alias for the lane; override for its scope." }
budget_seconds = { type = "integer", default = "${plan_lane_deadline_seconds}", min = 60, max = "${plan_lane_deadline_seconds}", doc = "Wall-clock deadline for the lane, at most the graph timeout." }

[[plan.patterns]]
name = "wave-barrier"
exports = [{ node = "barrier", outputs = ["result", "findings"] }]
nodes = [
  { id = "barrier", role = "plan.wave", title = "Wave ${wave} barrier", acceptance_checks = ["Every lane in the wave met its acceptance subset", "Cross-lane conflicts are recorded"] },
]

[plan.patterns.parameters]
wave = { type = "string", doc = "Wave name." }

[parameters]
scout = { type = "integer", default = 1, min = 0, max = 1, doc = "Run the advisory scout stage; 0 skips it." }
width = { type = "integer", default = 4, min = 1, max = 32, doc = "Scouts in the opening swarm." }
external = { type = "integer", default = 1, min = 0, max = 8, doc = "External scouts that research outward; 0 opts out." }
read_roots = { type = "list", default = [], doc = "Extra read roots for the scouts." }
integration_branch = { type = "string", default = "batch/graph", doc = "Branch that lane heads integrate into." }
batch_worktree = { type = "string", default = "", doc = "Registered worktree on its own branch, not the integration branch." }
base = { type = "string", default = "", doc = "Diff reference the batch is measured from." }
spec = { type = "string", default = "", doc = "Issue number or file the batch answers." }
spec_max_bytes = { type = "integer", default = 16384, min = 1, max = 65536, doc = "Maximum bytes of a file spec included in each review brief." }
risk_tier = { type = "string", inherit = true, bind = "risk_tier", default = "", doc = "Risk tier that selects the review shape." }
review_shape = { type = "string", default = "", doc = "Explicit review shape override." }
kind = { type = "string", bind = "kind", default = "", doc = "Change kind that scales the review panel: refactor, integration, docs. Empty uses the task kind." }
size = { type = "string", default = "", doc = "Review size override (small, medium, large). Empty defers the choice: the host measures the pinned reviewed commit against base when the review starts, so the panel fits the work actually written; pass a size to fix it now." }
risk_tags = { type = "list", default = [], doc = "Tags that trigger conditional lenses." }
local_check_policy = { type = "string", inherit = true, default = "", doc = "Local check policy inherited by nested presets; empty uses the layered roles library." }
worktrees = { type = "list", default = [], doc = "Registered writer worktrees a planner may assign to its lanes; empty leaves the choice open." }
# One entry per lane: name, worktree, scope and spec. Supply with --params-file.
lanes = [
  { name = "one", worktree = "", scope = ["."], spec = "" },
  { name = "two", worktree = "", scope = ["."], spec = "" },
]

[roles.refactor-principal]
tier = "principal"
access = "worktree_write"
worktree = "${batch_worktree}"
write_scope = ["."]
source = { type = "node", node = "council" }
outputs = ["result", "findings", "commit"]
delivery = "integrate:${integration_branch}"
acceptance_checks = ["Preserve externally observable behaviour", "Run targeted checks and commit"]
prompt = """
At batch end, inspect long-horizon boundaries, migrations and SOLID for:
${prompt}
Start from the council's pinned combined commit. Remove unnecessary machinery
and improve the approved design without speculative abstraction. Run checks
and commit. Independent principal review follows in the repair loop.
${local_check_policy}
"""

[roles.repairer]
tier = "senior"
access = "worktree_write"
worktree = "${batch_worktree}"
write_scope = ["."]
delivery = "integrate:${integration_branch}"
inputs = [{ node = "previous.review", outputs = ["result", "findings"] }]
acceptance_checks = ["Resolve accepted findings", "Run targeted checks and commit"]
prompt = """
Repair accepted batch findings for: ${prompt}
Use the serial batch worktree advanced by the principal and earlier repairs.
Inspect preceding review evidence, preserve scope, run targeted checks and
commit. Reviewers will pin and review this round's changed head.
${local_check_policy}
"""
