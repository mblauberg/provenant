stages = [
  { id = "implement", role = "implementer" },
  { id = "lens", parallel = [
    { id = "lens", for_each = "${lenses}", role = "lane-lens" },
  ], source = { type = "node", node = "implement" } },
]
exports = [
  { node = "implement", outputs = ["branch", "commit"] },
  { node = "lens", outputs = ["result", "findings", "verdict"] },
]

[parameters]
worktree = ""
scope = ["."]
subject = { type = "commit", commit = "HEAD" }
delivery = "none"
# The diff reference the slice is measured from, and the spec it answers.
base = ""
spec = ""
risk = ""
review_shape = ""
risk_tags = []
lenses = [
  { name = "correctness-spec", tier = "", prompt_file = "code-review/lenses/correctness-spec", distinct_from = "writer", when = "" },
  { name = "simplicity", tier = "", prompt_file = "code-review/lenses/simplicity", distinct_from = "", when = "" },
]

[roles.implementer]
tier = "senior"
access = "worktree_write"
worktree = "${worktree}"
write_scope = "${scope}"
source = "${subject}"
delivery = "${delivery}"
acceptance_checks = ["Run targeted tests and required static checks", "Commit the completed slice"]
prompt = """
Implement one bounded approved slice: ${prompt}
Spec (acceptance criteria): ${spec}
Keep changes within the supplied write scope. Run targeted checks and commit.
"""

[roles.lane-lens]
tier = "${item.tier}"
worktree = "${worktree}"
distinct_from = "${item.distinct_from}"
outputs = ["result", "commit"]
prompt_file = ["code-review/reviewer-context", "${item.prompt_file}"]
prompt = """
Lens: ${item.name}. Subject: the implementation of ${prompt}
Base (diff reference): ${base}
Spec (acceptance criteria): ${spec}
Check correctness against the spec as well as this lens.
"""
