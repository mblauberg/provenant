stages = [{ id = "branch", count = "${width}", min_successful = "${min_branches}", distinct_families = "${distinct_families}" }]

[pattern]
level = "recommended"
summary = "Independent read-only branches run side by side."
cost = "width attempts"
select_when = "Several unrelated views of the brief are wanted and nothing reconciles them."
tags = ["primitive"]


[parameters]
route = { type = "string", default = "senior", doc = "Routing pool for every branch." }
min_branches = { type = "integer", optional = true, min = 1, doc = "Minimum successful branches; by default all must succeed." }
width = { type = "integer", default = 2, min = 1, max = 32, doc = "Number of parallel branches." }
distinct_families = { type = "boolean", default = false, doc = "Prefer different model families across the branches. A preference only: every branch still runs." }
