[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

# The only direct dependencies allowed (ADR 0028, PORTING.md R6). Member crates
# use `{ workspace = true }`; an entry here enters Cargo.lock only once used.
[workspace.dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
jiff = "0.2"
libc = "0.2"
regex = "1.13"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
thiserror = "2.0"
toml_edit = { version = "0.25", features = ["serde"] }

# Internal crates. Each member may depend only on the crates PORTING.md R2
# allows it, as `provenant-<name> = { workspace = true }`.
provenant-core = { path = "crates/core" }
provenant-records = { path = "crates/records" }
provenant-config = { path = "crates/config" }
provenant-supervisor = { path = "crates/supervisor" }
provenant-confinement = { path = "crates/confinement" }
provenant-providers = { path = "crates/providers" }
provenant-quota = { path = "crates/quota" }
provenant-telemetry = { path = "crates/telemetry" }
provenant-routing = { path = "crates/routing" }
provenant-run = { path = "crates/run" }
provenant-fabric-store = { path = "crates/fabric-store" }
provenant-fabric-runtime = { path = "crates/fabric-runtime" }
provenant-fabric-mcp = { path = "crates/fabric-mcp" }
provenant-workflow = { path = "crates/workflow" }
provenant-cli = { path = "crates/cli" }

# Rewrite lanes land inert (ADR 0028). Keep their shared path declarations
# until cutover gives each a consumer; remove its ignore at that point.
[workspace.metadata.cargo-shear]
# Empty rewrite crates and the retained CLI-owned generated scaffold are
# deliberate until their owner slices land. Remove each path as it gains code.
ignored-paths = [
  "crates/cli/src/lib.rs",
  "crates/confinement/src/lib.rs",
  "crates/fabric-mcp/src/lib.rs",
  "crates/providers/src/lib.rs",
  "crates/run/src/lib.rs",
]
ignored = [
  "provenant-cli",
  "provenant-confinement",
  "provenant-fabric-mcp",
  "provenant-fabric-runtime",
  "provenant-fabric-store",
  "provenant-providers",
  "provenant-quota",
  "provenant-routing",
  "provenant-run",
  "provenant-telemetry",
  "provenant-workflow",
]

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
float_cmp = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
disallowed_methods = "deny"

[package]
name = "provenant"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Provenant front door: resolves the product checkout and execs the owner of each verb"
publish = false
license.workspace = true

[features]
fault-injection = ["provenant-supervisor/fault-injection"]

[dependencies]
provenant-core = { workspace = true }
provenant-records = { workspace = true }
provenant-config = { workspace = true }
provenant-supervisor = { workspace = true }

[build-dependencies]
provenant-records = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
toml_edit = { workspace = true }
provenant-supervisor = { workspace = true, features = ["test-fixtures"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
debug = 0
strip = true

# Stripping a proc-macro dylib (serde_derive, thiserror-impl) on macOS leaves a
# malformed LINKEDIT that rustc cannot load (E0463). Strip only the binary.
[profile.release.build-override]
strip = false

[lints]
workspace = true
