[package]
name = "provenant"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Provenant front door: resolves the product checkout and execs the owner of each verb"
publish = false
license = "MIT"

[features]
fault-injection = []

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
