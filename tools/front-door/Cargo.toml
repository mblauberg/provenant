[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

# The only direct dependencies allowed (ADR 0028; docs/specs/rust-workspace.md#dependencies). Member crates
# use `{ workspace = true }`; an entry here enters Cargo.lock only once used.
[workspace.dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
jiff = "0.2"
libc = "0.2"
regex = "1.13"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2.0"
toml_edit = { version = "0.25", features = ["serde"] }
unicode-normalization = "0.1"

# Internal crates. Each member may depend only on the crates docs/specs/rust-workspace.md#crate-layering
# allows it, as `provenant-<name> = { workspace = true }`.
provenant-core = { path = "crates/core" }
provenant-records = { path = "crates/records" }
provenant-config = { path = "crates/config" }
provenant-os = { path = "crates/os" }
provenant-supervisor = { path = "crates/supervisor" }
provenant-confinement = { path = "crates/confinement" }
provenant-providers = { path = "crates/providers" }
provenant-quota = { path = "crates/quota" }
provenant-telemetry = { path = "crates/telemetry" }
provenant-routing = { path = "crates/routing" }
provenant-run = { path = "crates/run" }
provenant-fabric-store = { path = "crates/fabric-store" }
provenant-sqlite = { path = "crates/sqlite" }
provenant-fabric-runtime = { path = "crates/fabric-runtime" }
provenant-fabric-mcp = { path = "crates/fabric-mcp" }
provenant-workflow = { path = "crates/workflow" }
provenant-cli = { path = "crates/cli" }

[workspace.metadata.cargo-shear]
ignored-paths = []
ignored = []

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
float_cmp = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
disallowed_methods = "deny"

[package]
name = "provenant"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
description = "Provenant command composition and transport edge"
publish = false
license.workspace = true

[dependencies]
jiff = { workspace = true }
provenant-os = { workspace = true }
provenant-quota = { workspace = true }
provenant-telemetry = { workspace = true }
provenant-fabric-mcp = { workspace = true }
provenant-fabric-runtime = { workspace = true }
provenant-fabric-store = { workspace = true }
provenant-workflow = { workspace = true }
provenant-run = { workspace = true }
provenant-providers = { workspace = true }
provenant-routing = { workspace = true }
provenant-cli = { workspace = true }
provenant-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
provenant-records = { workspace = true }
provenant-config = { workspace = true }
provenant-supervisor = { workspace = true }
provenant-confinement = { workspace = true }
provenant-sqlite = { workspace = true }

[build-dependencies]
provenant-os = { workspace = true }
provenant-records = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
provenant-os = { workspace = true, features = ["fixture"] }
regex = { workspace = true }
rusqlite = { workspace = true }
provenant-cli = { workspace = true, features = ["fixture"] }
provenant-run = { workspace = true, features = ["fixture"] }
provenant-core = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }
provenant-supervisor = { workspace = true, features = ["fixture"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
debug = 0
strip = true

# Stripping a proc-macro dylib (serde_derive, thiserror-impl) on macOS leaves a
# malformed LINKEDIT that rustc cannot load (E0463). Strip only the binary.
[profile.release.build-override]
strip = false

[lints]
workspace = true

[[test]]
name = "worktrees"
path = "tests/worktree_driver.rs"
harness = false

[[test]]
name = "fake_provider"
path = "tests/fake_provider.rs"
harness = false

[[test]]
name = "dispatch_provider"
path = "tests/dispatch_provider.rs"
harness = false

[[test]]
name = "pr"
path = "tests/pr.rs"
harness = false
