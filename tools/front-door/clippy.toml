allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

disallowed-methods = [
  { path = "std::thread::sleep", reason = "Use an injected clock or the supervisor wait boundary so cancellation remains observable." },
  { path = "std::process::Command::new", reason = "Process creation belongs in supervisor, which owns process custody." },
  { path = "std::env::remove_var", reason = "Pass environment explicitly to functions and child commands; process-wide mutation races with threads." },
  { path = "std::env::set_var", reason = "Pass environment explicitly to functions and child commands; process-wide mutation races with threads." },
]
