[profile.default]
slow-timeout = { period = "10s", terminate-after = 3 }

[profile.ci]
# These native cases run in the heavy tier, with no 30-second limit.
default-filter = 'not (test(=lane_prepare_isolates_nested_claude_state) | test(=lane_builds_and_tests_swift_in_a_registered_worktree))'
retries = 0
flaky-result = "fail"
fail-fast = false
leak-timeout = { period = "500ms", result = "fail" }
slow-timeout = { period = "10s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"

[profile.lane]
# Filtersets cannot contain comments, so reasons are keyed by test name here.
# CI still runs these host-only fixtures.
#
# Hard links are denied:
# install_refuses_oversize_and_linked_sources: creates a linked source.
# linked_worktree_grants_derive_from_verified_git_paths_and_ref: links Git logs.
# native_sandbox_blocks_path_escape_probes: creates hard-link escape probes.
# cleanup_refuses_hard_links: creates a linked cleanup entry.
# measurement_counts_hard_links_once_and_sizes_target_contents: links two files.
# owner_lock_refuses_cancelled_requests_hardlinks_and_writable_anchors: links a lock.
# retained_state_never_follows_a_symlink: also creates a hard-linked state file.
# retained_state_copy_refuses_a_file_swapped_for_a_hard_link: swaps in a hard link.
#
# Pathname socket binds are denied; /tmp is unwritable and lane TMPDIR paths
# also exceed Unix socket limits:
# process and custody binaries: every case unconditionally calls short_tempdir.
# process_crash_at_publication_boundaries_leaves_old_or_new_complete_bytes:
#   needs a short socket root and SIGKILL.
# concurrent_process_writers_on_one_revision_have_one_winner: short socket root.
# retained_state_copy_skips_entries_swapped_after_their_check: binds a socket.
# forward_falls_back_only_when_no_agent_accepts: binds a socket.
# listen_replaces_a_stale_socket_but_not_a_live_agent: binds a socket.
# lane_mcp_refuses_coordination_but_allows_reads_and_child_submission: binds a socket.
default-filter = '''
not (
    (package(=provenant-confinement) & (
        test(=output_custody::tests::install_refuses_oversize_and_linked_sources) |
        test(=permissions::tests::grants::linked_worktree_grants_derive_from_verified_git_paths_and_ref) |
        test(=permissions::tests::escape::native_sandbox_blocks_path_escape_probes)
    )) |
    (package(=provenant-fabric-runtime) & test(=fetch::tests::cleanup_refuses_hard_links)) |
    (package(=provenant-supervisor) & (
        test(=disk::tests::measurement_counts_hard_links_once_and_sizes_target_contents) |
        test(=fs::tests::owner_lock_refuses_cancelled_requests_hardlinks_and_writable_anchors)
    )) |
    (package(=provenant-cli) & (
        test(=run::provider::tests::retained_state_never_follows_a_symlink) |
        test(=run::provider::tests::retained_state_copy_refuses_a_file_swapped_for_a_hard_link)
    )) |
    (package(=provenant-supervisor) & (
        binary(=process) | binary(=custody) |
        test(=fs::tests::process_crash_at_publication_boundaries_leaves_old_or_new_complete_bytes)
    )) |
    (package(=provenant-workflow) & test(=store::tests::concurrency::concurrent_process_writers_on_one_revision_have_one_winner)) |
    (package(=provenant-cli) & test(=run::provider::tests::retained_state_copy_skips_entries_swapped_after_their_check)) |
    (package(=provenant-fabric-runtime) & (
        test(=peer_agent::tests::forward_falls_back_only_when_no_agent_accepts) |
        test(=peer_agent::tests::listen_replaces_a_stale_socket_but_not_a_live_agent)
    )) |
    (package(=provenant) & binary(=fabric_transport) & test(=lane_mcp_refuses_coordination_but_allows_reads_and_child_submission)) |
    (package(=provenant) & binary(=worktrees) & (
        test(=lane_prepare_isolates_nested_claude_state) |
        test(=lane_builds_and_tests_swift_in_a_registered_worktree)
    ))
)
'''

[test-groups]
serial-process = { max-threads = 1 }

# Nextest runs each test in its own process, so this group orders only state
# shared across processes. The supervisor suites launch child processes, bind
# Unix sockets and observe the live process table. The worktree driver copies
# its own binary and executes the copy; a fork that inherits the copy's write
# descriptor makes that exec fail with ETXTBSY. Other suites use per-test
# temporary directories and pass their environment explicitly, so they run in
# parallel.
[[profile.ci.overrides]]
filter = 'package(provenant-supervisor) | (package(=provenant) & binary(=worktrees))'
test-group = "serial-process"

[[profile.lane.overrides]]
filter = 'package(provenant-supervisor) | (package(=provenant) & binary(=worktrees))'
test-group = "serial-process"

# A real SwiftPM compile and test run cannot fit the 30 s default budget.
[[profile.default.overrides]]
filter = 'test(=lane_builds_and_tests_swift_in_a_registered_worktree)'
slow-timeout = { period = "30s", terminate-after = 4 }

# The nightly CI-profile run carries the real Swift writer build.
[[profile.ci.overrides]]
filter = 'test(=lane_builds_and_tests_swift_in_a_registered_worktree)'
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'test(=read_only_lane_builds_and_tests_swift_in_scratch) | test(=read_only_lane_builds_and_tests_cargo_in_scratch)'
slow-timeout = { period = "30s", terminate-after = 4 }

# Creates and settles over a thousand durable lanes to exercise a stale cursor.
[[profile.default.overrides]]
filter = 'test(=run::tests::wait_handles_a_stale_default_cursor)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'test(=run::tests::wait_handles_a_stale_default_cursor)'
slow-timeout = { period = "60s", terminate-after = 5 }

# This real-Git fixture creates several worktrees and follows the CLI remedy.
[[profile.default.overrides]]
filter = 'test(=run::tests::dispatch_reuses_only_free_lane_or_unowned_worktree)'
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = 'test(=run::tests::dispatch_reuses_only_free_lane_or_unowned_worktree)'
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.lane.overrides]]
filter = 'test(=run::tests::dispatch_reuses_only_free_lane_or_unowned_worktree)'
slow-timeout = { period = "30s", terminate-after = 4 }
