# Tests are run with nextest, which gives each test its own process; the
# `serial-process` group in .config/nextest.toml orders the ones that share
# cross-process state. Plain `cargo test` is multi-threaded; test support
# serialises child spawns with executable copies to avoid Linux ETXTBSY.
#
# Release packaging and distribution builds configure RUSTC_WRAPPER explicitly
# to invoke .cargo/rustc-wrapper.sh for reproducible path remapping. Everyday
# development and test builds run without the wrapper.
#
# Linker source: the pinned Rust toolchain bundles and defaults to LLD on
# x86_64-unknown-linux-gnu since Rust 1.90 (no system lld install required):
# https://blog.rust-lang.org/2025/09/18/Rust-1.90.0/
# macOS uses the current Xcode system linker. No host-specific override here.

# Graph execution needs a larger stack than the 2 MiB default of a spawned
# thread in a debug build: one launch nests several large executor frames, which
# #3542 shrinks but cannot remove. Production workers size their own stack from
# `provenant_fabric_runtime::graph::GRAPH_STACK_BYTES`; test harness threads can
# only be sized through this variable, so it repeats that constant (8 MiB) and a
# fabric-runtime test pins the two together. A larger stack set by the caller is
# not overridden.
[env]
RUST_MIN_STACK = "8388608"
