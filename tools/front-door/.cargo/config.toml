# Tests are run with nextest, which gives each test its own process; the
# `serial-process` group in .config/nextest.toml orders the ones that share
# cross-process state. Plain `cargo test` is multi-threaded; test support
# serialises child spawns with executable copies to avoid Linux ETXTBSY.
#
# Release packaging and distribution builds configure RUSTC_WRAPPER explicitly
# to invoke .cargo/rustc-wrapper.sh for reproducible path remapping. Everyday
# development and test builds run without the wrapper.
