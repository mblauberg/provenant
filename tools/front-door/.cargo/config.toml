[env]
# The integration tests copy the binary and execute it. On Linux a parallel
# test's fork can inherit the copy's write descriptor, and exec then fails with
# ETXTBSY, so the suite runs serially; it takes well under a second.
RUST_TEST_THREADS = "1"

[build]
rustc-wrapper = ".cargo/rustc-wrapper.sh"

[target.'cfg(target_vendor = "apple")']
rustflags = ["-C", "link-arg=-Wl,-S", "-C", "link-arg=-Wl,-x"]
