# Operating defaults, evaluated by the same selectors and schedules as overrides.
[defaults.lane]
stop_early_ok = false

[defaults.cache]
read_share_target = 0.90

[[rules]]
adapter = "claude"
[rules.policy.compaction]
window = 275000
mode = "task_boundary"
min_turns = 14
[rules.policy.cache]
write_ratio = 1.25
output_ratio = 5.0

[[rules]]
adapter = "codex"
[rules.policy.cache]
write_ratio = 1.25
output_ratio = 5.0

[[rules]]
adapter = "opencode"
model_suffix = "-free"
[rules.policy.result]
check = true
fallback_family = "codex/gpt-*-luna"
fallback_effort = "high"
