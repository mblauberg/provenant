settlement_retries = 2
capacity_retry_seconds = 30
capacity_retry_max_seconds = 600
retry_delay_ceiling_seconds = 3600
pacing_overrides = []
[review.size]
small_lines = 150
small_files = 3
small_crates = 1
medium_lines = 1000
medium_files = 15
medium_crates = 3
[opencode_go]
min_monthly_allowance_usd = 60
[routes]
[pools]
[pacing]
[pacing_reserve]
# Path classes are owner-configurable. Unknown paths use the unknown class.
# Crucial selects the deep shape, so a crucial floor covers only paths that
# implement a hard boundary of ADR 0035 or an irreversible external effect,
# where a missed defect cannot be reverted or recovered afterwards. Each floor
# states which. A broad change reaches deep through its integration head, not
# through a path name. Match whole path segments or file stems, never loose
# substrings: a word such as "build" or "object" appears in many files that
# guard nothing. Projects add their own boundaries as further floors in their
# routing configuration; the `provenant_*` floors below are this repository's.
[review.floors.routine]
# Documentation and prose carry no executable behaviour.
paths = ["docs/**", "**/*.md"]
tier = "routine"
lenses = []
[review.floors.unknown]
# A path no class names gets one correctness reviewer, not a guess.
paths = []
tier = "substantial"
lenses = ["correctness-spec"]
[review.floors.security]
# Credentials and secrets (ADR 0035 boundary 2): they must never cross hosts or
# reach prompts, receipts or output, and a leak cannot be recalled.
paths = [
  "**/credentials/**",
  "**/credentials.*",
  "**/secrets/**",
  "**/secrets.*",
  "**/auth/**",
  "**/auth.*",
  "**/.env",
  "**/.env.*",
]
tier = "crucial"
lenses = ["correctness-spec", "security-privacy"]
[review.floors.external_effects]
# Workflows that publish, deploy, release or merge without a person: a
# published release cannot be unpublished and an auto-merge changes the default
# branch.
paths = [
  "**/.github/workflows/release*.y*ml",
  "**/.github/workflows/publish*.y*ml",
  "**/.github/workflows/deploy*.y*ml",
  "**/.github/workflows/*merge*.y*ml",
]
tier = "crucial"
lenses = ["correctness-spec", "reliability"]
[review.floors.authority]
# Who must approve a change (ADR 0035 boundary 4, authority gates): editing
# code ownership changes who can land to the default branch.
paths = ["**/CODEOWNERS"]
tier = "crucial"
lenses = ["correctness-spec", "adversarial"]

# This repository's own boundaries. They name its modules, so they do nothing
# in another project; there is no repository-tracked project layer to hold them,
# which is why they ship here.
[review.floors.provenant_credentials]
# ADR 0035 boundary 2: host-only GitHub login lookup, secret-pattern scan and
# output redaction.
paths = [
  "tools/front-door/crates/cli/src/run/provider/gh_auth.rs",
  "tools/front-door/crates/confinement/src/disclosure.rs",
  "tools/front-door/crates/confinement/src/redact.rs",
]
tier = "crucial"
lenses = ["correctness-spec", "security-privacy"]
[review.floors.provenant_lane_git]
# ADR 0035 boundary 1: a writer lane reaches shared refs only through
# host-owned delivery. A lane that escapes can rewrite shared history.
paths = [
  "tools/front-door/crates/confinement/src/worktrees.rs",
  "tools/front-door/crates/confinement/src/worktrees/**",
  "tools/front-door/crates/confinement/src/permissions/**",
  "tools/front-door/crates/confinement/src/push.rs",
  "tools/front-door/crates/confinement/src/transport.rs",
  "tools/front-door/crates/confinement/src/repo.rs",
  "tools/front-door/crates/confinement/tests/lane_git_conformance.rs",
  "tools/front-door/crates/os/src/git.rs",
  "tools/front-door/crates/fabric-runtime/src/git_transport.rs",
]
tier = "crucial"
lenses = ["correctness-spec", "adversarial"]
[review.floors.provenant_object_integrity]
# ADR 0035 boundary 3: lane objects are digest-checked and fsck-verified on
# receipt. A corrupt or substituted object lands in shared history unnoticed.
paths = [
  "tools/front-door/crates/run/src/objects.rs",
  "tools/front-door/crates/run/src/objects/**",
  "tools/front-door/crates/run/src/objects_tests.rs",
]
tier = "crucial"
lenses = ["correctness-spec", "adversarial"]
[review.floors.provenant_authority]
# ADR 0035 boundary 4: landing, publishing, handoff acceptance and chair
# switching need held authority. Merging and publishing are external effects.
paths = [
  "tools/front-door/crates/fabric-store/src/landing.rs",
  "tools/front-door/crates/fabric-store/src/chairs.rs",
  "tools/front-door/crates/fabric-runtime/src/chairs.rs",
  "tools/front-door/crates/fabric-runtime/src/graph/land.rs",
  "tools/front-door/crates/fabric-runtime/src/handoff.rs",
  "tools/front-door/crates/fabric-runtime/src/handoff/**",
  "tools/front-door/crates/records/src/handoff.rs",
  "tools/front-door/src/handoff.rs",
  "tools/front-door/src/pr/land.rs",
  "tools/front-door/src/pr/landing/**",
  "tools/front-door/src/fabric/landing.rs",
]
tier = "crucial"
lenses = ["correctness-spec", "adversarial"]
[review.floors.provenant_release]
# Release packaging and upgrade: a published release cannot be unpublished.
paths = [
  "tools/front-door/src/bin/package-release.rs",
  "tools/front-door/src/upgrade-release.sh",
]
tier = "crucial"
lenses = ["correctness-spec", "reliability"]
[review.floors.contract]
# A public interface or schema change is costly to undo but recoverable, so it
# keeps the standard panel rather than deep.
paths = ["**/cli/**", "**/config/**", "**/schema/**", "**/*config*", "**/*schema*"]
tier = "substantial"
lenses = ["correctness-spec", "design-fit-reuse"]

[review.shapes.quick]
reviewers = [{ pool = "junior", count = 1 }]
frame = false
verifiers = 0
synthesis = "reduce"
[review.shapes.standard]
reviewers = [{ pool = "junior", count = 5, distinct_families = true }]
frame = true
verifiers = 1
synthesis = "model"
[review.shapes.deep]
reviewers = [
  { pool = "junior", count = 4, distinct_families = true },
  { pool = "senior", count = 4, distinct_families = true },
]
frame = true
verifiers = 1
synthesis = "model"
[review.select]
default = "standard"
[review.select.by_risk]
routine = "quick"
substantial = "standard"
crucial = "deep"
terminal = "deep"
[review.select.by_kind]
integration = "deep"
docs = "quick"
refactor = "standard"
[review.select.by_paths]
# Size never reaches deep. Deep is for integration heads and boundary paths.
[review.select.by_size]
small = "quick"
medium = "standard"
large = "standard"
# Base lenses fill a shape's slots in this order. A kind may replace the order
# (docs) or add lenses outside the slot cap (refactor); risk tags add more.
[review.lenses]
order = [
  "correctness-spec",
  "tests",
  "design-fit-reuse",
  "simplicity",
  "reliability",
  "conventions-readability",
  "refactor-cleanup",
  "flexibility",
]
[review.lenses.by_kind.docs]
order = ["conventions-readability"]
[review.lenses.by_kind.refactor]
add = ["refactor-cleanup", "design-fit-reuse"]
[review.lenses.by_paths."**/tests/**"]
add = ["tests"]
[review.lenses.by_paths."**/test/**"]
add = ["tests"]
[review.lenses.by_paths."**/__tests__/**"]
add = ["tests"]
[review.lenses.by_paths."**/*_tests.rs"]
add = ["tests"]
[review.lenses.by_paths."**/*_test.*"]
add = ["tests"]
[review.lenses.by_paths."**/*.test.*"]
add = ["tests"]
[review.lenses.by_paths."**/*.spec.*"]
add = ["tests"]
[review.lenses.by_paths."**/test_*.py"]
add = ["tests"]
[review.lenses.by_paths."**/*Tests.swift"]
add = ["tests"]
[review.lenses.by_paths.".config/nextest.toml"]
add = ["tests"]
[review.lenses.by_paths."**/vitest.config.*"]
add = ["tests"]
[review.lenses.by_paths."**/jest.config.*"]
add = ["tests"]
[review.lenses.by_paths."**/pytest.ini"]
add = ["tests"]
[review.lenses.by_paths."**/conftest.py"]
add = ["tests"]
