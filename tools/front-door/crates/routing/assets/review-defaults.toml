suppress_opus_writer_warning = false
capacity_cooldown_seconds = 600
settlement_retries = 2
capacity_retry_seconds = 30
capacity_retry_max_seconds = 600
retry_delay_ceiling_seconds = 3600
pacing_overrides = []
[outcome_priors]
enabled = true
exploration_percent = 10
[review.size]
small_lines = 150
small_files = 3
small_crates = 1
medium_lines = 1000
medium_files = 15
medium_crates = 3
[opencode_go]
min_monthly_allowance_usd = 60
[routes]
[pools]
[pacing]
[pacing_reserve]
# Path classes are owner-configurable. Unknown paths use the unknown class.
# The bundled floors are repo-neutral: they may add a lens or raise a panel to
# the standard shape, never to deep, and a shortfall against them only warns.
# A project declares its own boundaries as further floors, and `hard = true` on
# one of its own floors makes a coverage shortfall against it refuse. Match
# whole path segments or file stems, never loose substrings: a word such as
# "build" or "object" appears in many files that guard nothing.
[review.floors.routine]
# Documentation and prose carry no executable behaviour.
paths = ["docs/**", "**/*.md"]
tier = "routine"
lenses = []
[review.floors.unknown]
# A path no class names gets one correctness reviewer, not a guess.
paths = []
tier = "substantial"
lenses = ["correctness-spec"]
[review.floors.security]
# Credentials and secrets: they must never cross hosts or
# reach prompts, receipts or output, and a leak cannot be recalled.
paths = [
  "**/credentials/**",
  "**/credentials.*",
  "**/secrets/**",
  "**/secrets.*",
  "**/auth/**",
  "**/auth.*",
  "**/.env",
  "**/.env.*",
]
tier = "substantial"
lenses = ["correctness-spec", "security-privacy"]
[review.floors.external_effects]
# Workflows that publish, deploy, release or merge without a person: a
# published release cannot be unpublished and an auto-merge changes the default
# branch.
paths = [
  "**/.github/workflows/release*.y*ml",
  "**/.github/workflows/publish*.y*ml",
  "**/.github/workflows/deploy*.y*ml",
  "**/.github/workflows/*merge*.y*ml",
]
tier = "substantial"
lenses = ["correctness-spec", "reliability"]
[review.floors.authority]
# Who must approve a change: editing
# code ownership changes who can land to the default branch.
paths = ["**/CODEOWNERS"]
tier = "substantial"
lenses = ["correctness-spec", "adversarial"]

[review.floors.contract]
# A public interface or schema change is costly to undo but recoverable, so it
# keeps the standard panel rather than deep.
paths = ["**/cli/**", "**/config/**", "**/schema/**", "**/*config*", "**/*schema*"]
tier = "substantial"
lenses = ["correctness-spec", "design-fit-reuse"]

[review.shapes.quick]
reviewers = [{ pool = "junior", count = 1 }]
frame = false
verifiers = 0
synthesis = "reduce"
[review.shapes.standard]
reviewers = [{ pool = "junior", count = 3, distinct_families = true }]
frame = true
verifiers = 1
synthesis = "model"
[review.shapes.deep]
reviewers = [
  { pool = "junior", count = 2, distinct_families = true },
  { pool = "senior", count = 2, distinct_families = true },
]
frame = true
verifiers = 1
synthesis = "model"
[review.select]
default = "standard"
[review.select.by_risk]
routine = "quick"
substantial = "standard"
crucial = "deep"
terminal = "deep"
[review.select.by_kind]
integration = "deep"
docs = "quick"
refactor = "standard"
[review.select.by_paths]
# Size never reaches deep. Deep is for integration heads and boundary paths.
[review.select.by_size]
small = "quick"
medium = "standard"
large = "standard"
# Panels stay small: risk floors add the lenses a boundary needs, and base
# lenses fill the remaining slots in this order. A kind may replace the order
# (docs) or add lenses outside the slot cap (refactor); risk tags add more.
[review.lenses]
order = [
  "correctness-spec",
  "tests",
  "reliability",
  "design-fit-reuse",
  "simplicity",
  "conventions-readability",
  "refactor-cleanup",
  "flexibility",
]
[review.lenses.by_kind.docs]
order = ["conventions-readability"]
[review.lenses.by_kind.refactor]
add = ["refactor-cleanup", "design-fit-reuse"]
[review.lenses.by_paths."**/tests/**"]
add = ["tests"]
[review.lenses.by_paths."**/test/**"]
add = ["tests"]
[review.lenses.by_paths."**/__tests__/**"]
add = ["tests"]
[review.lenses.by_paths."**/*_tests.rs"]
add = ["tests"]
[review.lenses.by_paths."**/*_test.*"]
add = ["tests"]
[review.lenses.by_paths."**/*.test.*"]
add = ["tests"]
[review.lenses.by_paths."**/*.spec.*"]
add = ["tests"]
[review.lenses.by_paths."**/test_*.py"]
add = ["tests"]
[review.lenses.by_paths."**/*Tests.swift"]
add = ["tests"]
[review.lenses.by_paths.".config/nextest.toml"]
add = ["tests"]
[review.lenses.by_paths."**/vitest.config.*"]
add = ["tests"]
[review.lenses.by_paths."**/jest.config.*"]
add = ["tests"]
[review.lenses.by_paths."**/pytest.ini"]
add = ["tests"]
[review.lenses.by_paths."**/conftest.py"]
add = ["tests"]
# Depletion ladder: where work goes when its account or model is spent, in
# order. Tiers are pool names, lowest to highest; adjacent tiers are tried
# lower first.
[depletion]
rungs = ["same_model_other_account", "other_provider_same_tier", "adjacent_tier", "host_native"]
tiers = ["utility", "junior", "senior", "principal"]
adjacent = ["lower", "higher"]
