[pools]
utility = [
    # Lowest weight: Cursor's allowance is small and resets monthly, so it must last the month.
    { selector = "cursor/composer-*", weight = 1, efforts = [] },
    { selector = "claude/claude-haiku-*", weight = 4, effort = "low", efforts = ["low"] },
    { selector = "codex/gpt-*-luna", weight = 2, effort = "low", efforts = ["low"] },
]
junior = [
    # Lowest weight: Cursor's allowance is small and resets monthly, so it must last the month.
    { selector = "cursor/composer-*", weight = 1, efforts = [] },
    # Prefer free capacity while it is eligible and available.
    { selector = "opencode/opencode/deepseek-v*-flash-free", weight = 50, free = true, efforts = [] },
    { selector = "opencode/opencode/glm-*-flash-free", weight = 50, free = true, efforts = [] },
    # Provisional pending local trial evidence.
    { selector = "opencode/opencode-go/deepseek-v*-flash", weight = 2, efforts = [] },
    { selector = "opencode/opencode-go/glm-*-flash", weight = 1, efforts = [] },
    { selector = "codex/gpt-*-terra", weight = 2, effort = "low", efforts = ["low", "medium"] },
    { selector = "codex/gpt-*-luna", weight = 4, effort = "high", efforts = ["medium", "high", "xhigh"] },
    { selector = "claude/claude-haiku-*", weight = 4, effort = "high", efforts = ["medium", "high", "xhigh"] },
    { selector = "agy/gemini-*-flash", weight = 2, effort = "medium", efforts = ["low", "medium", "high"] },
    { selector = "agy/claude-sonnet-*", weight = 1, efforts = [] },
]
senior = [
    # Provisional pending local trial evidence.
    { selector = "opencode/opencode-go/deepseek-v*-flash", weight = 1, efforts = [] },
    { selector = "opencode/opencode-go/glm-*-flash", weight = 1, efforts = [] },
    # Writer work stopped early more often and cost more per success on terra at
    # high effort than on the other routes, while terra at low or medium effort and
    # on read-only work did well. A hash-assigned pool makes that a fair comparison.
    # Terra stays here at low or medium effort; its weight moved to codex sol, which
    # the codex provider paces to spend, since Claude quota is the scarcer one.
    # Exact routes and user-configured pools can still select terra at high effort.
    { selector = "codex/gpt-*-sol", weight = 6, effort = "medium", efforts = ["low", "medium", "high"] },
    { selector = "codex/gpt-*-terra", weight = 2, effort = "medium", efforts = ["low", "medium"] },
    { selector = "claude/claude-sonnet-*", weight = 4, efforts = ["medium", "high", "xhigh"] },
    { selector = "agy/gemini-*-flash", weight = 2, effort = "high", efforts = ["low", "medium", "high"] },
    { selector = "agy/claude-opus-*-thinking", weight = 1, efforts = [] },
    # Lowest weight for the same reason as Composer above.
    { selector = "cursor/grok-*", weight = 1, efforts = ["low", "medium", "high", "xhigh"] },
]
principal = [
    { selector = "claude/claude-opus-*", weight = 1, efforts = ["low", "medium", "high", "xhigh"] },
    { selector = "codex/gpt-*-sol", weight = 1, effort = "high", efforts = ["medium", "high", "xhigh"] },
]
writing = [
    # Lowest weight: Cursor's allowance is small and resets monthly, so it must last the month.
    { selector = "cursor/composer-*", weight = 1, efforts = [] },
    { selector = "agy/gemini-*-flash", weight = 4, efforts = ["low", "medium", "high"] },
    { selector = "claude/claude-haiku-*", weight = 4, efforts = ["low", "medium", "high", "xhigh"] },
    { selector = "agy/claude-sonnet-*", weight = 2, efforts = [] },
    { selector = "claude/claude-sonnet-*", weight = 1, efforts = ["medium", "high", "xhigh"] },
    { selector = "codex/gpt-*-luna", weight = 1, effort = "high", efforts = ["high", "xhigh"] },
]
design = [
    { selector = "claude/claude-sonnet-*", weight = 4, efforts = ["medium", "high", "xhigh"] },
    { selector = "agy/gemini-*-flash", weight = 2, effort = "high", efforts = ["low", "medium", "high"] },
    { selector = "claude/claude-opus-*", weight = 1, efforts = ["low", "medium", "high", "xhigh"] },
]

