[package]
name = "provenant-providers"
version = "2.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
provenant-os = { workspace = true }
provenant-core = { workspace = true }
jiff = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
toml_edit = { workspace = true }
provenant-config = { workspace = true }
provenant-records = { workspace = true }
provenant-confinement = { workspace = true }
provenant-quota = { workspace = true }

[features]
fixture = [
    "recording",
    "provenant-os/fixture",
    "provenant-core/fixture",
    "provenant-config/fixture",
    "provenant-records/fixture",
    "provenant-confinement/fixture",
    "provenant-quota/fixture",
]
# Enables the recorder example for collecting redacted replay fixtures.
recording = ["provenant-os/fixture"]

[dev-dependencies]
provenant-test-support = { path = "../test-support", features = ["fixture"] }
provenant-os = { workspace = true, features = ["fixture"] }
provenant-confinement = { workspace = true, features = ["fixture"] }
tempfile = { workspace = true }

[[example]]
name = "record"
required-features = ["recording"]

[lints]
workspace = true
