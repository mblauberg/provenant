[package]
name = "provenant-confinement"
version = "2.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
provenant-redact = { workspace = true }
provenant-os = { workspace = true }
provenant-core = { workspace = true }
provenant-config = { workspace = true }
provenant-records = { workspace = true }
provenant-supervisor = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

toml_edit = { workspace = true }

[features]
fixture = [
    "snapshot",
    "provenant-redact/fixture",
    "provenant-os/fixture",
    "provenant-core/fixture",
    "provenant-config/fixture",
    "provenant-records/fixture",
    "provenant-supervisor/fixture",
]
# Exposes the pure Seatbelt rendering path to the provider snapshot tests.
snapshot = []

[dev-dependencies]
provenant-test-support = { path = "../test-support", features = ["fixture"] }
provenant-fabric-store = { path = "../fabric-store", features = ["fixture"] }
provenant-os = { workspace = true, features = ["fixture"] }
provenant-supervisor = { workspace = true, features = ["fixture"] }
tempfile = { workspace = true }

[lints]
workspace = true
