[package]
name = "provenant-supervisor"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
provenant-core = { workspace = true }
provenant-records = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
provenant-supervisor = { workspace = true, features = ["fixture"] }
tempfile = { workspace = true }

[features]
fixture = []

[[test]]
name = "process"
path = "tests/process.rs"
harness = false
required-features = ["fixture"]

# Cargo cannot override one lint with lints.workspace = true.
# Mirror the workspace policy, lowering unsafe_code only so sys can allow it.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
float_cmp = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
disallowed_methods = "deny"

[[test]]
name = "custody"
path = "tests/custody.rs"
harness = false
required-features = ["fixture"]

[[test]]
name = "publication"
path = "tests/publication.rs"
harness = false
required-features = ["fixture"]
