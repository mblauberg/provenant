# Composite nodes share the leaf template schema. This catalogue is separate
# so leaf briefs and composite topology have independent owners.
[review-panel]
composite_behaviour = "panel"
doc = "Review through a host-selected topology and lenses."
exports = [{ node = "selected", outputs = ["result", "findings", "verdict"] }]
nodes = [
  { id = "selected", use = "review-shape", reduce_verdict = true },
]

# One shape serves every topology. The host binds `review-frame`, `review-verify`
# and `review-synthesis` at launch; a stage whose condition does not hold stays
# in the graph as a skipped row, and the stages around it ignore it.
[review-shape]
reduce_verdict = true
doc = "Review with a host-selected framing, verification and synthesis topology."
exports = [
  { node = "lenses", outputs = ["result", "findings", "verdict"], when = { review-synthesis = false } },
  { node = "verify", outputs = ["result", "findings", "verdict"], when = { review-synthesis = false } },
  { node = "synthesis", outputs = ["result", "findings", "verdict"], when = { review-synthesis = true } },
]
nodes = [
  { id = "frame", use = "task", when = { review-frame = true }, brief = "Frame the pinned review subject and its acceptance criteria for the independent lenses." },
  { id = "lenses", use = "review", over = "@review-panel", min_ok = "${min_ok}", after = ["frame"], inputs = [{ node = "frame", outputs = ["result"] }], reduce_verdict = true, with = { lens = "${item}", advice = { resolver = "review-advice-${item}" } }, required_verdict = "VERDICT: PASS" },
  { id = "verify", use = "review.verify", over = "@review-verifiers", when = { review-verify = true }, min_ok = "${min_ok}", reduce_verdict = true, after = ["lenses"], inputs = [{ node = "lenses", outputs = ["result", "findings"] }] },
  { id = "synthesis", use = "review.synthesis", when = { review-synthesis = true }, after = ["lenses", "verify"], require_findings = true, required_verdict = "VERDICT: PASS", inputs = [{ node = "lenses", outputs = ["result", "findings"] }, { node = "verify", outputs = ["result", "findings", "verdict"] }] },
]

[review-shape.parameters]
min_ok = { type = "integer", default = 1, min = 1 }

[research-swarm]
doc = "Research named questions and reconcile dated evidence."
nodes = [
  { id = "researchers", use = "research", over = "${items}", min_ok = "${min_ok}", brief = "${brief}: ${item}" },
  { id = "synthesis", use = "synthesise", after = ["researchers"], inputs = [{ node = "researchers", outputs = ["result"] }] },
]
[research-swarm.parameters]
brief = { type = "string", default = "Answer with cited evidence" }
items = { type = "list", default = ["the question in the brief"], min = 1 }
min_ok = { type = "integer", default = 1, min = 1 }

[explore-swarm]
doc = "Explore named areas and reconcile repository evidence."
nodes = [
  { id = "explorers", use = "explore", over = "${items}", min_ok = "${min_ok}", brief = "${brief}: ${item}" },
  { id = "synthesis", use = "synthesise", after = ["explorers"], inputs = [{ node = "explorers", outputs = ["result"] }] },
]
[explore-swarm.parameters]
brief = { type = "string", default = "Answer with cited evidence" }
items = { type = "list", default = ["the repository"], min = 1 }
min_ok = { type = "integer", default = 1, min = 1 }

[batch]
exports = [{ node = "repair", outputs = ["result"] }]
doc = "Implement named slices into one integration branch, then review it."
nodes = [
  { id = "slices", use = "implement", tier = "junior", over = "${items}", min_ok = "${min_ok}", brief = "Implement slice ${item}: ${brief}", delivery = "integrate:${integration_branch}", worktree = "${worktree}", write_scope = "${write_scope}" },
  { id = "review", use = "findings-panel", after = ["slices"], source = { type = "integration" } },
  { id = "repair", use = "review-repair", after = ["review"], inputs = [{ node = "review", outputs = ["findings", "verdict"] }], with = { worktree = "${worktree}", write_scope = "${write_scope}", integration_branch = "${integration_branch}", max_repair_cycles = "${max_repair_cycles}" } },
]
[batch.parameters]
max_repair_cycles = { type = "integer", default = 3, min = 1 }
items = { type = "list", default = ["implementation"], min = 1 }
min_ok = { type = "integer", default = 1, min = 1 }
brief = { type = "string", default = "Meet the acceptance checks." }
integration_branch = { type = "string", default = "batch/integration" }
worktree = { type = "string" }
write_scope = { type = "list", default = [] }

[deliver]
exports = [
  { node = "implement", outputs = ["branch", "commit"] },
  { node = "review", outputs = ["result", "findings", "verdict"] },
]
doc = "Implement an approved brief through CI, review and landing."
nodes = [
  { id = "implement", use = "implement", with = { bounded = "${bounded}" }, brief = "${brief}", delivery = "pr", worktree = "${worktree}", write_scope = "${write_scope}" },
  { id = "initial-review", use = "findings-panel", after = ["implement"], source = { type = "node", node = "implement" } },
  { id = "repair", use = "review-repair", after = ["initial-review"], inputs = [{ node = "initial-review", outputs = ["findings", "verdict"] }], with = { writer = "implement", worktree = "${worktree}", write_scope = "${write_scope}", max_repair_cycles = "${max_repair_cycles}" } },
  { id = "ci", kind = "gate", access = "read_only", after = ["repair"], condition = { type = "ci", target = { node = "implement" } } },
  { id = "review", use = "review-panel", after = ["ci"], source = { type = "head", node = "implement" } },
  { id = "accept", kind = "gate", access = "read_only", after = ["review"], condition = { type = "verdict", expected = "VERDICT: PASS", threshold = "all" }, inputs = [{ node = "review", outputs = ["verdict"] }] },
  { id = "land", kind = "land", access = "read_only", after = ["accept"], land = { node = "implement", tier = "substantial" } },
]
[deliver.parameters]
bounded = { type = "boolean", default = false, doc = "The implementation brief is already one sized slice or a plan output." }
max_repair_cycles = { type = "integer", default = 3, min = 1 }
brief = { type = "string", default = "Meet the acceptance checks." }
worktree = { type = "string" }
write_scope = { type = "list", default = [] }

[task-once]
nodes = [{ id = "task", use = "task", brief = "${brief}" }]
[task-once.parameters]
brief = { type = "string", default = "Do the brief." }

[plan-once]
nodes = [{ id = "plan", use = "plan", brief = "Plan: ${brief}" }]
[plan-once.parameters]
brief = { type = "string", default = "Scope the task." }

[task-chain]
nodes = [
  { id = "first", use = "task", brief = "${brief}" },
  { id = "second", use = "task", brief = "${brief}", after = ["first"], inputs = [{ node = "first", outputs = ["result"] }] },
]

[task-chain.parameters]
brief = { type = "string", default = "Do the brief." }

[task-fan-out]
exports = [{ node = "tasks", outputs = ["result"] }]
nodes = [{ id = "tasks", use = "task", over = "${items}", min_ok = "${min_ok}", brief = "${brief}: ${item}" }]
[task-fan-out.parameters]
brief = { type = "string", default = "Answer with cited evidence" }
items = { type = "list", default = ["first view", "second view"], min = 1 }
min_ok = { type = "integer", default = 1, min = 1 }

[task-fan-out-synthesise]
nodes = [
  { id = "tasks", use = "task-fan-out", with = { items = "${items}", min_ok = "${min_ok}", brief = "${brief}" } },
  { id = "synthesis", use = "synthesise", after = ["tasks"], inputs = [{ node = "tasks", outputs = ["result"] }] },
]
[task-fan-out-synthesise.parameters]
brief = { type = "string", default = "Answer with cited evidence" }
items = { type = "list", default = ["first view", "second view"], min = 1 }
min_ok = { type = "integer", default = 1, min = 1 }

[plan-then-deliver]
nodes = [
  { id = "plan", use = "plan", brief = "Plan: ${brief}" },
  { id = "deliver", use = "deliver", after = ["plan"], inputs = [{ node = "plan", outputs = ["result"] }], with = { brief = "${brief}", worktree = "${worktree}", write_scope = "${write_scope}" } },
]
[plan-then-deliver.parameters]
brief = { type = "string", default = "Meet the acceptance checks." }
worktree = { type = "string" }
write_scope = { type = "list", default = [] }

[findings-panel]
doc = "Collect qualified findings without treating reported defects as an execution failure."
exports = [{ node = "synthesis", outputs = ["result", "findings", "verdict"] }]
nodes = [
  { id = "lenses", use = "review", over = "@review-panel", min_ok = 1, with = { lens = "${item}", advice = { resolver = "review-advice-${item}" } } },
  { id = "synthesis", use = "review.synthesis", after = ["lenses"], require_findings = true, inputs = [{ node = "lenses", outputs = ["result", "findings"] }] },
]

[review-repair]
composite_behaviour = "review_repair"
doc = "Bounded repairs followed by principal scoping when the design cannot close review."
exports = [{ node = "cycles", outputs = ["result"] }, { node = "continue", outputs = ["result"] }]
nodes = [
  { id = "cycles", use = "repair", repeat = { until = "accepted", max_rounds = "${max_repair_cycles}", review_repair = true }, on_fail = "design", with = { worktree = "${worktree}", write_scope = "${write_scope}", writer = "${writer}", integration_branch = "${integration_branch}", lenses = "${lenses}" } },
  { id = "design", use = "design", after = ["cycles"], inputs = [{ node = "cycles", outputs = ["result", "findings"] }], brief = "Read only. Diagnose the checked shared flaw, writer design-cannot-hold report, concrete design defect or recurring finding. Say whether the findings share one flaw and what the right design is; reaching the third review round prompts this judgement and does not end the work, so further repair may be the recommendation. Return the root constraint, two or three options with trade-offs and migration implications, a comparison of the structural fix with the small one, one recommended slice, and acceptance evidence. End with a findings block containing schema_version 1, findings [], and repair_design with boolean within_scope and one_way_door fields. Set within_scope true only when the recommended slice stays inside approved scope. The host notifies the owner and gates changed scope or a one-way door. Do not change files or widen authority." },
  { id = "continue", use = "plan", after = ["design", "scope-approved"], inputs = [{ node = "design", outputs = ["result"] }], brief = "Turn the principal's recommended slice into a graph patch. Continue delivery using the authorised repair-slice template after the host scope gate. Owner approval does not expand the supplied literal write authority. Re-plan the full panel with @review-panel when risk tier or scope grows. Run verification and independent review of the new head. Keep all writes inside the supplied literal scope. You may recommend and continue further repair: use repair-slice and fresh independent review, and return to principal judgement if it reveals another shared flaw. Round count does not end the work." },
  { id = "scope", kind = "decide", access = "read_only", after = ["design"], extensions = { repair_scope_gate = true }, decide = { question = "Approve the principal's changed scope or one-way door? Read the principal design report before deciding. Approval does not expand the graph's literal write authority.", on_unanswered = "block_dependants", options = [{ id = "approve", label = "Approve the proposed slice" }, { id = "hold", label = "Hold for a revised design" }] } },
  { id = "scope-approved", kind = "gate", access = "read_only", after = ["scope"], inputs = [{ node = "scope", outputs = ["verdict"] }], condition = { type = "verdict", expected = "approve", threshold = "all" } },
]
[review-repair.parameters]
max_repair_cycles = { type = "integer", default = 3, min = 1 }
worktree = { type = "string", default = "" }
write_scope = { type = "list", default = [] }
writer = { type = "string", default = "" }
lenses = { type = "list", default = ["correctness", "security", "tests", "contract", "design", "adversarial"], min = 1 }
integration_branch = { type = "string", default = "" }
