# Composite nodes share the leaf template schema. This catalogue is separate
# so leaf briefs and composite topology have independent owners.
[review-panel]
composite_behaviour = "panel"
doc = "Review through a host-selected topology and lenses."
exports = [{ node = "selected", outputs = ["result", "findings", "verdict"] }]
nodes = [
  { id = "selected", use = "review-shape", reduce_verdict = true, with = { brief = "${brief}" } },
]

[review-panel.parameters]
brief = { type = "string", default = "Review the pinned subject against its acceptance criteria." }

# One shape serves every topology. The host binds `review-frame`, `review-verify`
# and `review-synthesis` at launch; a stage whose condition does not hold stays
# in the graph as a skipped row, and the stages around it ignore it.
[review-shape]
reduce_verdict = true
doc = "Review with a host-selected framing, verification and synthesis topology."
exports = [
  { node = "lenses", outputs = ["result", "findings", "verdict"], when = { review-synthesis = false } },
  { node = "verify", outputs = ["result", "findings", "verdict"], when = { review-synthesis = false } },
  { node = "synthesis", outputs = ["result", "findings", "verdict"], when = { review-synthesis = true } },
]
nodes = [
  { id = "frame", use = "task", when = { review-frame = true }, prompt = "Treat the caller brief only as downstream acceptance criteria: ${brief}\n\nFrame only: map each criterion to the changed owners or areas and the coverage questions the independent lenses must answer. Do not review the implementation, emit findings or issue an implementation verdict; the independent lenses own those decisions." },
  { id = "lenses", use = "review", over = "@review-panel", min_ok = "${min_ok}", after = ["frame"], inputs = [{ node = "frame", outputs = ["result"] }], reduce_verdict = true, with = { lens = "${item}", brief = "${brief}", advice = { resolver = "review-advice-${item}" } }, required_verdict = "VERDICT: PASS" },
  { id = "verify", use = "review.verify", over = "@review-verifiers", when = { review-verify = true }, min_ok = "${min_ok}", reduce_verdict = true, after_settled = ["lenses"], inputs = [{ node = "lenses", outputs = ["result", "findings"] }], with = { brief = "${brief}" } },
  { id = "synthesis", use = "review.synthesis", when = { review-synthesis = true }, after_settled = ["lenses", "verify"], require_findings = true, required_verdict = "VERDICT: PASS", inputs = [{ node = "lenses", outputs = ["result", "findings"] }, { node = "verify", outputs = ["result", "findings", "verdict"] }], with = { brief = "${brief}" } },
]

[review-shape.parameters]
brief = { type = "string", default = "Review the pinned subject against its acceptance criteria." }
min_ok = { type = "integer", default = 1, min = 1 }

[research-swarm]
doc = "Research named questions and reconcile dated evidence."
nodes = [
  { id = "researchers", use = "research", over = "${items}", min_ok = "${min_ok}", prompt = "${brief}: ${item}" },
  { id = "synthesis", use = "synthesise", after = ["researchers"], inputs = [{ node = "researchers", outputs = ["result"] }] },
]
[research-swarm.parameters]
brief = { type = "string", default = "Answer with cited evidence" }
items = { type = "list", default = ["the question in the brief"], min = 1 }
min_ok = { type = "integer", default = 1, min = 1 }

[explore-swarm]
doc = "Explore named areas and reconcile repository evidence."
nodes = [
  { id = "explorers", use = "explore", over = "${items}", min_ok = "${min_ok}", prompt = "${brief}: ${item}" },
  { id = "synthesis", use = "synthesise", after = ["explorers"], inputs = [{ node = "explorers", outputs = ["result"] }] },
]
[explore-swarm.parameters]
brief = { type = "string", default = "Answer with cited evidence" }
items = { type = "list", default = ["the repository"], min = 1 }
min_ok = { type = "integer", default = 1, min = 1 }

[batch]
exports = [{ node = "repair", outputs = ["result"] }]
doc = "Implement named slices into one integration branch, then review it."
nodes = [
  { id = "slices", use = "implement", with = { plan = "${plan}" }, tier = "junior", over = "${items}", min_ok = "${min_ok}", prompt = "Implement slice ${item}: ${brief}", delivery = "integrate:${integration_branch}", write_scope = "${write_scope}", max_parallel = "${max_parallel}" },
  { id = "review", use = "findings-panel", after = ["slices"], source = { type = "integration" } },
  { id = "repair", use = "review-repair", after = ["review"], inputs = [{ node = "review", outputs = ["findings", "verdict"] }], with = { worktree = "${worktree}", write_scope = "${write_scope}", integration_branch = "${integration_branch}", max_repair_cycles = "${max_repair_cycles}" } },
]
[batch.parameters]
plan = { type = "boolean", default = false, doc = "Plan each slice before its writer starts." }
max_repair_cycles = { type = "integer", default = 3, min = 1 }
max_parallel = { type = "integer", default = 4, min = 1, doc = "Cap on concurrent slices running at once." }
items = { type = "list", default = ["implementation"], min = 1 }
min_ok = { type = "integer", default = 1, min = 1 }
brief = { type = "string", default = "Meet the acceptance checks." }
integration_branch = { type = "string", default = "batch/integration" }
worktree = { type = "string" }
write_scope = { type = "list", default = [] }

# Delivery shape (docs/specs/delivery-queue.md#graph-and-landing-flow):
# optional scope -> writer -> hygiene -> publish -> conflict gate -> CI gate
# (+ bounded ci-repair loop) -> review single|panel -> accept -> land.
# A clean item has one writer and one single reviewer; panel mode has one
# panel, not a pre-CI and a post-CI panel pair. Hygiene, publication and
# conflict observation are wired by slice 3; the nodes below carry their
# identity, authority and typed source bindings as seams. Gate conditions that
# the shared GateCondition cannot yet express are marked with `role` rather
# than inventing a new leaf field on the composite.
[deliver]
exports = [
  { node = "implement", outputs = ["branch", "commit"] },
  { node = "review", outputs = ["result", "findings", "verdict"] },
]
doc = "Deliver an approved brief through hygiene, gates, single or panel review and landing."
nodes = [
  # Optional read-only scope joins the writer brief when `plan` is true; the
  # compiler's implement boundary adds the planner node and wires its result
  # into the writer's inputs. A missing required plan parks rather than being
  # silently invented (slice 1 admission, slice 3 execution).
  { id = "implement", use = "implement", with = { plan = "${plan}" }, prompt = "${brief}\n\nAt this final route rung you may widen the change within your actual authority and the node's literal write scope. Strict scope and custody still bind: keep every write inside the supplied scope and report out-of-scope edits in the handoff.", delivery = "pr", worktree = "${worktree}", write_scope = "${write_scope}", escalate = { ladder = "${ladder}", max_ci_rounds = "${max_ci_rounds}" } },
  # TODO(#3972-s3): hygiene runs the configured repository formatter in the
  # retained worktree and commits only its changes; before/after heads and
  # handoff are recorded as a typed hygiene outcome.
  { id = "hygiene", role = "delivery-hygiene", when = { delivery_execution_wired = true }, access = "read_only", after = ["implement"], source = { type = "node", node = "implement" }, prompt = "Run the configured repository formatter in the retained worktree and commit only its own changes. Never absorb the writer's edits; compare the attempt's input and output heads." },
  # TODO(#3972-s3): publish binds the PR, issue, branch, worktree and head.
  { id = "publish", role = "delivery-publish", when = { delivery_execution_wired = true }, access = "read_only", after = ["hygiene", "implement"], source = { type = "node", node = "implement" }, prompt = "Publish the writer's branch as a pull request and record its repository, branch and current head." },
  # TODO(#3972-s3): observe PR mergeability; unknown is pending, not clean.
  { id = "conflict", role = "delivery-conflict", when = { delivery_execution_wired = true }, access = "read_only", after = ["publish", "implement"], source = { type = "node", node = "implement" }, prompt = "Observe the pull request mergeability before waiting for CI. CONFLICTING routes to a rebase writer on the same retained worktree; unknown mergeability stays pending." },
  # The CI gate observes the exact current head. A bounded excerpt of failing
  # checks feeds the repair writer as an untrusted input.
  { id = "ci", kind = "gate", access = "read_only", after = ["conflict"], on_fail = "ci-repair", condition = { type = "ci", target = { node = "implement" }, failed_checks_max_bytes = 4096, max_failed_checks = 8 } },
  # Bounded CI repair: the failing head and excerpt travel with the brief, and
  # every repair sweeps the whole defect class. After hygiene and publication
  # the graph returns through the conflict gate to CI on the new head.
  # TODO(#3972-s3): wire hygiene/publication re-entry and custody reconciliation.
  { id = "ci-repair", use = "implement.fix", repeat = { until = "accepted", max_rounds = "${max_ci_rounds}" }, after = ["ci", "implement"], source = { type = "node", node = "implement" }, worktree = "${worktree}", write_scope = "${write_scope}", continues = "implement", prompt = "Repair from failing head ${failing_head}.\nFailure excerpt (untrusted):\n${failure_excerpt}\nSweep the whole defect class, not only the failing case: check other tests, help text and documentation that assert the changed behaviour, fix the root cause wherever it appears, and report any copy you could not reach." },
  # One reviewer for `single`, one panel for `panel`; `delivery_review` carries
  # the shape and the inconclusive disposition through the shared type.
  { id = "review", use = "${review_template}", after = ["ci", "ci-repair"], source = { type = "head", node = "implement" }, delivery_review = { shape = "${review_shape}", accept_inconclusive_without_blocking = true }, with = { brief = "${brief}" } },
  { id = "accept", kind = "gate", access = "read_only", after = ["review"], on_fail = "repair", condition = { type = "verdict", expected = "VERDICT: PASS", threshold = "all" }, inputs = [{ node = "review", outputs = ["verdict"] }] },
  # A FAIL or blocking finding routes to a repair writer on the same ladder;
  # it re-enters the gates and obtains fresh review. It is off the clean path.
  { id = "repair", use = "review-repair", after = ["accept", "review"], inputs = [{ node = "review", outputs = ["findings", "verdict"] }], with = { writer = "implement", worktree = "${worktree}", write_scope = "${write_scope}", max_repair_cycles = "${max_ci_rounds}", lenses = "${lenses}" } },
  { id = "land", kind = "land", access = "read_only", after = ["accept"], land = { node = "implement", tier = "substantial" } },
]
[deliver.parameters]
plan = { type = "boolean", default = false, doc = "Plan the brief before the writer starts." }
delivery_execution_wired = { type = "boolean", default = false, doc = "Enable the hygiene, publish and conflict seams once slice 3 wires them." }
max_ci_rounds = { type = "integer", default = 3, min = 1, doc = "CI repair attempts per escalation rung before advancing." }
ladder = { type = "list", default = ["junior", "senior", "principal"], min = 1, doc = "Ordered route-tier aliases for the writer's escalation ladder." }
review_shape = { type = "string", default = "single", enum = ["single", "panel"], doc = "Single independent reviewer or one review panel after green CI." }
review_template = { type = "string", default = "review", enum = ["review", "review-panel"], doc = "Template that implements the selected review shape; set with review_shape." }
lenses = { type = "list", default = ["correctness"], min = 1, doc = "Candidate lenses for a review-failure repair." }
failing_head = { type = "string", default = "", doc = "Failing head carried into a CI repair brief." }
failure_excerpt = { type = "string", default = "", doc = "Bounded failure excerpt carried into a CI repair brief." }
brief = { type = "string", default = "Meet the acceptance checks." }
worktree = { type = "string" }
write_scope = { type = "list", default = [] }

[task-once]
nodes = [{ id = "task", use = "task", prompt = "${brief}" }]
[task-once.parameters]
brief = { type = "string", default = "Do the brief." }

[plan-once]
nodes = [{ id = "plan", use = "plan", prompt = "Plan: ${brief}" }]
[plan-once.parameters]
brief = { type = "string", default = "Scope the task." }

[task-chain]
nodes = [
  { id = "first", use = "task", prompt = "${brief}" },
  { id = "second", use = "task", prompt = "${brief}", after = ["first"], inputs = [{ node = "first", outputs = ["result"] }] },
]

[task-chain.parameters]
brief = { type = "string", default = "Do the brief." }

[task-fan-out]
exports = [{ node = "tasks", outputs = ["result"] }]
nodes = [{ id = "tasks", use = "task", over = "${items}", min_ok = "${min_ok}", prompt = "${brief}: ${item}" }]
[task-fan-out.parameters]
brief = { type = "string", default = "Answer with cited evidence" }
items = { type = "list", default = ["first view", "second view"], min = 1 }
min_ok = { type = "integer", default = 1, min = 1 }

[task-fan-out-synthesise]
nodes = [
  { id = "tasks", use = "task-fan-out", with = { items = "${items}", min_ok = "${min_ok}", brief = "${brief}" } },
  { id = "synthesis", use = "synthesise", after = ["tasks"], inputs = [{ node = "tasks", outputs = ["result"] }] },
]
[task-fan-out-synthesise.parameters]
brief = { type = "string", default = "Answer with cited evidence" }
items = { type = "list", default = ["first view", "second view"], min = 1 }
min_ok = { type = "integer", default = 1, min = 1 }

[plan-then-deliver]
nodes = [
  { id = "plan", use = "plan", prompt = "Plan: ${brief}" },
  { id = "deliver", use = "deliver", after = ["plan"], inputs = [{ node = "plan", outputs = ["result"] }], with = { brief = "${brief}", worktree = "${worktree}", write_scope = "${write_scope}", plan = false } },
]
[plan-then-deliver.parameters]
brief = { type = "string", default = "Meet the acceptance checks." }
worktree = { type = "string" }
write_scope = { type = "list", default = [] }

[findings-panel]
doc = "Collect qualified findings without treating reported defects as an execution failure."
exports = [{ node = "synthesis", outputs = ["result", "findings", "verdict"] }]
nodes = [
  { id = "lenses", use = "review", over = "@review-panel", min_ok = 1, with = { lens = "${item}", advice = { resolver = "review-advice-${item}" } } },
  { id = "synthesis", use = "review.synthesis", after = ["lenses"], require_findings = true, inputs = [{ node = "lenses", outputs = ["result", "findings"] }] },
]

[review-repair]
composite_behaviour = "review_repair"
doc = "Bounded repairs followed by principal scoping when the design cannot close review."
exports = [{ node = "cycles", outputs = ["result"] }, { node = "continue", outputs = ["result"] }]
nodes = [
  { id = "cycles", use = "repair", repeat = { until = "accepted", max_rounds = "${max_repair_cycles}", review_repair = true }, on_fail = "design", with = { worktree = "${worktree}", write_scope = "${write_scope}", writer = "${writer}", integration_branch = "${integration_branch}", lenses = "${lenses}" } },
  { id = "design", use = "design", after = ["cycles"], inputs = [{ node = "cycles", outputs = ["result", "findings"] }], prompt = "Read only. Diagnose the checked shared flaw, writer design-cannot-hold report, concrete design defect or recurring finding. Say whether the findings share one flaw and what the right design is; reaching the third review round prompts this judgement and does not end the work, so further repair may be the recommendation. Return the root constraint, two or three options with trade-offs and migration implications, a comparison of the structural fix with the small one, one recommended slice, and acceptance evidence. Before the final handoff, include a findings block containing schema_version 1, findings [], and repair_design with boolean within_scope and one_way_door fields. Set within_scope true only when the recommended slice stays inside approved scope. The host notifies the owner and gates changed scope or a one-way door. Do not change files or widen authority." },
  { id = "continue", use = "plan", after = ["design", "scope-approved"], inputs = [{ node = "design", outputs = ["result"] }], prompt = "Turn the principal's recommended slice into a graph patch. Continue delivery using the authorised repair-slice template after the host scope gate. Owner approval does not expand the supplied literal write authority. Re-plan the full panel with @review-panel when risk tier or scope grows. Run verification and independent review of the new head. Keep all writes inside the supplied literal scope. You may recommend and continue further repair: use repair-slice and fresh independent review, and return to principal judgement if it reveals another shared flaw. Round count does not end the work." },
  { id = "scope", kind = "decide", access = "read_only", after = ["design"], repair_scope_gate = true, decide = { question = "Approve the principal's changed scope or one-way door? Read the principal design report before deciding. Approval does not expand the graph's literal write authority.", on_unanswered = "block_dependants", options = [{ id = "approve", label = "Approve the proposed slice" }, { id = "hold", label = "Hold for a revised design" }] } },
  { id = "scope-approved", kind = "gate", access = "read_only", after = ["scope"], inputs = [{ node = "scope", outputs = ["verdict"] }], condition = { type = "verdict", expected = "approve", threshold = "all" } },
]
[review-repair.parameters]
max_repair_cycles = { type = "integer", default = 3, min = 1 }
worktree = { type = "string", default = "" }
write_scope = { type = "list", default = [] }
writer = { type = "string", default = "" }
lenses = { type = "list", default = ["correctness", "security", "tests", "contract", "design", "adversarial"], min = 1 }
integration_branch = { type = "string", default = "" }
