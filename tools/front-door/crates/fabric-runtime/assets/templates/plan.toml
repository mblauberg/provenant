doc = "Return a patch and its reasoning."
brief = """Plan this work as a patch of template nodes and explain the shape.
Slice it into units of about three acceptance items with disjoint write scopes into one integration branch. Put shared contracts first and use waves only for real dependencies. Use a long writer only for coupled work, near 500k tokens. Use junior for mechanical work, senior for contained design and at most one principal a wave. Add `explore` nodes when evidence is thin, and end a wave with another `plan` when its results could change the shape. Ask for light review per slice and a full review of the integrated head."""
tier = "principal"
access = "read_only"
kind = "plan"
outputs = ["result"]

[node.plan]
max_nodes = 32
