doc = "Return a patch and its reasoning."
brief = """Plan this work as a patch of template nodes and explain the shape.
Slice it into units of about three acceptance items and schedule them by actual dependencies. Paths in optional write-scope metadata are advisory; the declared worktree is the Git-isolation boundary, and each writer may use its whole worktree. Put shared contracts first and use waves only for real dependencies. Use a long writer only for coupled work, near 500k tokens, perhaps a senior calling juniors. Default implementation slices to junior; use senior for contained design and at most one principal a wave. Add `explore` nodes when evidence is thin, and end a wave with another `plan` when its results could change the shape. Give each slice acceptance evidence, targeted checks and a light independent review. Merge completed slices in dependency order into the integration branch, run the affected checks, then review the pinned integrated head with the full required panel, choosing lens breadth before reviewer family. Add bounded repair and independent delta review for qualified findings; a failed gate blocks landing. Consult recorded cost per template. Explain the dependencies and review phases, then return the graph patch in the final fenced `patch` JSON block ({"schema_version":1,"nodes":[...]})."""
tier = "principal"
access = "read_only"
kind = "task"
outputs = ["result"]
