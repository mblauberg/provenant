composite_behaviour = "repair"
doc = "Repair qualified findings and re-review their delta through the raising lenses. Repeat with review_repair = true and at most three rounds."
nodes = [
  { id = "fix", use = "implement.fix", extensions = { repair_writer = true }, worktree = "${worktree}", write_scope = "${write_scope}", continues = "${writer}", distinct_from = "dependencies", distinct_strength = "prefer", inputs = [{ node = "previous.synthesis", outputs = ["findings"] }] },
  { id = "check", use = "review", over = "${lenses}", after = ["fix"], source = { type = "node", node = "fix" }, inputs = [{ node = "fix", outputs = ["result"] }], with = { lens = "${item}" }, extensions = { repair_lens = "${item}", repair_risk_assessment = true }, distinct_from = "writer", distinct_strength = "prefer", brief = "Review the repair delta at the pinned head through the ${item} lens. Check closure of the invariant under repair across all relevant paths and copies, not only named files, and relevant tests. Preserve finding IDs, lens, severity, location, evidence and proposed_fix. In the findings block, include a top-level risk_tier set to routine, substantial, crucial or terminal as your independent assessment of the repaired change, even when findings is empty. If the delta grows risk tier or scope, record risk_grew=true or scope_grew=true in a finding so the host re-plans the full @review-panel. End with VERDICT: PASS if all blocking findings are resolved, VERDICT: FAIL if any remain, or VERDICT: INCONCLUSIVE if evidence is insufficient." },
  { id = "synthesis", use = "synthesise", after = ["check", "fix"], inputs = [{ node = "check", outputs = ["result", "findings"] }, { node = "fix", outputs = ["result"] }], extensions = { repair_triage = true }, require_findings = true, brief = "Check every delta finding and writer repair_item against the code and invariant under repair. Preserve every qualified finding, including rejected findings. For each emit triage with decision confirmed or rejected, reason, worth_fixing boolean, root_cause naming the invariant, blocking_class acceptance/default_path_defect/boundary/data_loss/none, shared_flaw boolean. Group worthwhile confirmed findings by cause. A disputed item is a claim to judge, not automatically unresolved. Reject a falsified premise with evidence. Flag a shared design flaw design_defect=true. End with VERDICT: PASS if no repair-eligible finding remains and evidence is complete, otherwise VERDICT: FAIL or VERDICT: INCONCLUSIVE." },
  { id = "accepted", kind = "gate", access = "read_only", after = ["synthesis"], inputs = [{ node = "synthesis", outputs = ["verdict"] }], condition = { type = "verdict", expected = "VERDICT: PASS", threshold = "all" } },
]
exports = [{ node = "accepted", outputs = ["result"] }]

[parameters.worktree]
type = "string"
doc = "Registered worktree the fix writes in"

[parameters.write_scope]
type = "list"
min = 1
doc = "Relative paths the fix may write"

[parameters.lenses]
type = "list"
default = ["correctness"]
min = 1
doc = "Candidate lenses; the host selects those that raised findings"

[parameters.writer]
type = "string"
default = ""
doc = "Delivering writer to continue when repairing a pull request"

[parameters.integration_branch]
type = "string"
default = ""
doc = "Integration branch for batch repair commits"
