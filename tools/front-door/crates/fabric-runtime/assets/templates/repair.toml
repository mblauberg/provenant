composite_behaviour = "repair"
doc = "Repair qualified findings and re-review their delta through the raising lenses. Repeat with review_repair = true and at most three rounds."
nodes = [
  { id = "fix", use = "implement.fix", repair_writer = true, worktree = "${worktree}", write_scope = "${write_scope}", continues = "${writer}", distinct_from = "dependencies", distinct_strength = "prefer", inputs = [{ node = "previous.synthesis", outputs = ["findings"] }] },
  { id = "check", use = "review", over = "${lenses}", after = ["fix"], source = { type = "node", node = "fix" }, inputs = [{ node = "fix", outputs = ["result"] }], with = { lens = "${item}" }, repair_lens = "${item}", repair_risk_assessment = true, distinct_from = "writer", distinct_strength = "prefer", prompt = "Review only the repair delta at the pinned head through the ${item} lens, against the named invariants from the blocking findings; this is not a fresh full panel. Check closure of each invariant across all relevant paths and copies, not only named files, and relevant tests. Name the invariant you checked in the top-level `class` of every finding; a finding without one is flagged at settlement and a blocking finding without one is refused. Preserve finding IDs, lens, severity, location, evidence and proposed_fix. In the findings block, include a top-level risk_tier set to routine, substantial, crucial or terminal as your independent assessment of the repaired change, even when findings is empty. If the delta grows risk tier or scope, record risk_grew=true or scope_grew=true in a finding so the host re-plans the full @review-panel. A lens may raise a new invariant; it then follows the same named-invariant contract. Give VERDICT: PASS if all blocking findings are resolved, VERDICT: FAIL if any remain, or VERDICT: INCONCLUSIVE if evidence is insufficient." },
  { id = "synthesis", use = "synthesise", after = ["check", "fix"], inputs = [{ node = "check", outputs = ["result", "findings"] }, { node = "fix", outputs = ["result"] }], repair_triage = true, require_findings = true, prompt = "Check every delta finding and writer repair_item against the code and invariant under repair. Preserve every qualified finding, including rejected findings. For each emit triage with decision confirmed or rejected, reason, worth_fixing boolean, root_cause naming the invariant, blocking_class acceptance/default_path_defect/boundary/data_loss/none, shared_flaw boolean, and set the top-level `class` to the named invariant. Two distinct findings with the same invariant are one shared flaw and route to design. Group worthwhile confirmed findings by cause. A disputed item is a claim to judge, not automatically unresolved. Reject a falsified premise with evidence. Flag a shared design flaw design_defect=true. Check each repair_item carries the sweep it ran, every site it changed and a test that pins its invariant. Give VERDICT: PASS if no repair-eligible finding remains and evidence is complete, otherwise VERDICT: FAIL or VERDICT: INCONCLUSIVE." },
  { id = "accepted", kind = "gate", access = "read_only", after = ["synthesis"], inputs = [{ node = "synthesis", outputs = ["verdict"] }], condition = { type = "verdict", expected = "VERDICT: PASS", threshold = "all" } },
]
exports = [{ node = "accepted", outputs = ["result"] }]

[parameters.worktree]
type = "string"
doc = "Registered worktree the fix writes in"

[parameters.write_scope]
type = "list"
default = []
doc = "Optional advisory relative paths; empty means the writer may use its whole worktree"

[parameters.lenses]
type = "list"
default = ["correctness"]
min = 1
doc = "Candidate lenses; the host selects those that raised findings"

[parameters.writer]
type = "string"
default = ""
doc = "Delivering writer to continue when repairing a pull request; an authored writer id resolves to its expanded node id"

[parameters.integration_branch]
type = "string"
default = ""
doc = "Integration branch for batch repair commits"
