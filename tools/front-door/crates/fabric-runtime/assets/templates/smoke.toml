doc = "Exercise the main lane paths with small, disposable work."
nodes = [
  { id = "read", use = "task", tier = "junior", fixture = "fixture.txt", prompt = "Read the supplied fixture and report its single stated fact." },
  { id = "review", use = "review", tier = "junior", review_base = "${diff_base}", over = ["correctness", "tests"], min_ok = 2, after = ["read"], prompt = "Review this trivial fixture: the only expected fact is that smoke checks work." },
  { id = "write", use = "implement", tier = "junior", after = ["review"], worktree = "${worktree}", attempt = "${write_attempt}", when = { smoke-write = true }, prompt = "In the supplied scratch worktree, create exactly one file named smoke.txt containing 'smoke ok', then commit it." },
  { id = "retry-route", use = "task", tier = "junior", after = ["review"], when = { smoke-retry = true }, fixture = "fixture.txt", prompt = "Report the supplied fixture's single stated fact. This node checks that the smoke run has a free-capable route for the retry path; it does not itself retry a failed node." },
  { id = "steer-route", use = "task", tier = "junior", after = ["review"], when = { smoke-steer = true }, fixture = "fixture.txt", prompt = "Report the supplied fixture's single stated fact. This node checks that the smoke run has a free-capable route for the steer path; it does not itself steer a running lane." },
]
exports = [
  { node = "review", outputs = ["result"], when = { smoke-write = false } },
  { node = "write", outputs = ["result"], when = { smoke-write = true } },
]

[parameters]
worktree = { type = "string", default = "", doc = "Scratch worktree for the writer node (--worktree, or --branch to create one); without one the writer node is skipped and reported." }
write_attempt = { type = "table", default = {}, doc = "Attempt settings for the writer node, such as a new worktree; bound from --branch and --base." }
smoke-write = { type = "boolean", default = false, doc = "Whether to run the write node; enabled when worktree is provided and local." }
diff_base = { type = "string", default = "", doc = "Commit the review nodes compare against; a launch supplies the fixture's base. Empty leaves the review nodes unbound, so the per-node no-base refusal applies." }
smoke-retry = { type = "boolean", default = true, doc = "Whether to run the retry-route probe, which checks a free-capable route for the retry path without retrying a node; disable with --set smoke-retry=false." }
smoke-steer = { type = "boolean", default = true, doc = "Whether to run the steer-route probe, which checks a free-capable route for the steer path without steering a lane; disable with --set smoke-steer=false." }
