agent_label = ""
client_label = "agent"
ssh_executable = "" # empty selects shared system SSH discovery
home_hosts = {}
peers = {}
[lanes]
memory_pressure_threshold = "critical"
# A build throttle for cooperative fair sharing of CPU and memory among lanes, not a hard cap:
# lanes' `cargo` commands that compile wait for a slot; direct `~/.cargo/bin/cargo`, rustc and non-cargo builds are not gated.
max_concurrent_builds = -1 # host-wide builds at once, 1-64; automatic: max(1, min(cores / cargo_build_jobs, GiB of RAM / 6))
build_wait_minutes = -1 # minutes a build waits for a slot or Cargo lock before giving up, 1-1440; automatic: 30
max_writer_lanes = -1 # writer lanes live at once across the host, 1-64; automatic: 40
max_project_writer_lanes = -1 # writer lanes live at once per project, 1-32 and at most max_writer_lanes; automatic: 30
cargo_build_jobs = -1 # automatic: half the available cores, at least 1
[lanes.cargo_seed]
enabled = false
max_generations = 3
max_bytes = 21474836480
[lanes.priority]
writer = 10
read-only = 5
build-heavy = 15
[limits]
body_bytes = 65536
input_frame_bytes = 1048576
json_depth = 64
page_rows = 100
output_lines = 500
output_bytes = 65536
result_bytes = 1048576
lease_seconds = 3600
peer_seconds = 30
graph_timeout_seconds = 14400
bundle_bytes = 67108864

[graph.limits]
continuations = 2
nodes = 512
edges = 4096
routes_per_node = 16
node_prompt_bytes = 262144
graph_prompt_bytes = 4194304
expansion_depth = 32
fan_out_width = 32
concurrency = 0 # 0 uses host lane caps


[graph.budget]
unknown_usage = "warn"

[graph.budget.per_node]
[graph.budget.per_graph]
