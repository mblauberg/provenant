agent_label = ""
client_label = "agent"
ssh_executable = "" # empty selects shared system SSH discovery
home_hosts = {}
peers = {}
[lanes.cargo_seed]
enabled = false
[lanes.priority]
writer = 10
read-only = 5
build-heavy = 15
[limits]
body_bytes = 65536
input_frame_bytes = 1048576
json_depth = 64
page_rows = 100
output_lines = 500
output_bytes = 65536
result_bytes = 1048576
lease_seconds = 3600
peer_seconds = 30
graph_timeout_seconds = 14400
bundle_bytes = 67108864

[graph.limits]
nodes = 512
edges = 4096
routes_per_node = 16
node_prompt_bytes = 262144
graph_prompt_bytes = 4194304
expansion_depth = 4
fan_out_width = 32
concurrency = 0 # 0 uses host lane caps

# Omitted ceiling fields inherit their configured graph.limits values.
[graph.limit_ceiling]

[graph.budget]
unknown_usage = "warn"

[graph.budget.per_node]
[graph.budget.per_graph]
