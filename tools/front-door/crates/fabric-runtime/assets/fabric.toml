agent_label = ""
client_label = "agent"
ssh_executable = "" # empty selects shared system SSH discovery
home_hosts = {}
peers = {}
commands = {} # named command tables, e.g. fmt-check = { argv = ["cargo", "fmt", "--check"], runtimes = [] }
[lanes]
memory_pressure_threshold = "critical"
# A build throttle for cooperative fair sharing of CPU and memory among lanes, not a hard cap:
# lanes' `cargo` commands that compile wait for a slot; direct `~/.cargo/bin/cargo`, rustc and non-cargo builds are not gated.
max_concurrent_builds = -1 # host-wide builds at once, 1-64; automatic: max(1, min(cores / cargo_build_jobs, GiB of RAM / 6))
build_wait_minutes = -1 # minutes a build waits for a slot or Cargo lock before giving up, 1-1440; automatic: 30
max_writer_lanes = -1 # writer lanes live at once across the host, 1-64; automatic: unlimited
lane_port_base = -1 # first port of the range split into per-writer-lane blocks, 1024-65535; automatic: 30000
lane_port_block = -1 # ports in each writer lane's block, 1-1024; automatic: 16
lane_port_blocks = -1 # blocks in the range, 0-1024, the base plus blocks times block size at most 65536; 0 turns allocation off; automatic: 64
max_project_writer_lanes = -1 # writer lanes live at once per project, 1-32 and at most max_writer_lanes; automatic: unlimited
cargo_build_jobs = -1 # automatic: half the available cores, at least 1
[lanes.cargo_seed]
enabled = true # macOS only; clones host Cargo registry, Git and target seeds, and falls back where the volume cannot clone
max_generations = 3
max_bytes = 21474836480
[lanes.settlement]
notice = true # post one terse notice to the dispatching chair's inbox when a lane settles
notice_read_only = false # also notify for read-only lanes
chair_log = true # append an entry to the dispatching chair's session log
[lanes.priority]
writer = 10
read-only = 5
build-heavy = 15
[limits]
body_bytes = 65536
input_frame_bytes = 1048576
json_depth = 64
page_rows = 100
output_lines = 500
output_bytes = 65536
result_bytes = 1048576
lease_seconds = 3600
peer_seconds = 30
graph_timeout_seconds = 14400
store_busy_timeout_ms = 30000 # wait for a contended store before reporting contention, 0-600000; 0 fails fast

# The planner front-end for `provenant run --preset`: a principal planner shapes
# the graph from the preset's allow-listed patterns when --plan is on, or when
# --plan is auto and the work is large or underspecified.
[plan]
mode = "auto" # auto, on or off; --plan overrides it
route = "principal" # route alias the planner node runs on
max_nodes = 24 # nodes and pattern instances one plan may emit, 1-512

[plan.auto]
acceptance_items = 6 # more acceptance items than this turns planning on
write_crates = 2 # a write scope spanning more crates than this turns it on
batch_issues = 2 # this many distinct issues in one brief turns it on

[graph]
writer_launch_seconds = 55 # launch allowance for run and tick; minimum per writer binding
ci_poll_overrides = {}

[graph.ci_poll_backoff]
initial_seconds = 0 # eligible on every tick; set both values for a longer backoff
max_seconds = 0

[graph.limits]
continuations = 2
nodes = 512
edges = 4096
routes_per_node = 16
review_substitutions = 1 # 0 disables review member substitutions
node_prompt_bytes = 262144
graph_prompt_bytes = 4194304
expansion_depth = 64
fan_out_width = 32
concurrency = 0 # 0 uses host lane caps


[graph.budget]
unknown_usage = "warn"

[graph.budget.per_node]
[graph.budget.per_graph]

# Graph `land` node policy per risk tier: "auto" or "ask". An unset tier uses
# the built-in default (routine and substantial auto, crucial and terminal ask).
# Per-project values go under [graph.land.projects."PROJECT_ID"].
[graph.land]
