[package]
name = "provenant-fabric-runtime"
version = "1.6.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
provenant-os = { workspace = true }
provenant-config = { workspace = true }
provenant-core = { workspace = true }
provenant-records = { workspace = true }
provenant-routing = { workspace = true }
provenant-fabric-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
toml_edit = { workspace = true }

[features]
# Lets tests seed associations sealed before derived child run IDs existed.
retained-seed = []

[dev-dependencies]
provenant-test-support = { path = "../test-support" }
rusqlite = { workspace = true }
provenant-os = { workspace = true, features = ["fixture"] }
tempfile = { workspace = true }

[lints]
workspace = true
