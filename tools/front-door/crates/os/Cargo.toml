[package]
name = "provenant-os"
version = "1.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
jiff = { workspace = true }
provenant-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
fixture = []

# Cargo cannot override one lint with lints.workspace = true.
# Mirror the workspace policy, lowering unsafe_code only so sys can allow it.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
float_cmp = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
disallowed_methods = "deny"
