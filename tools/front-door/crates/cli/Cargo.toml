[package]
name = "provenant-cli"
version = "2.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
fixture = [
    "dep:provenant-test-support",
    "provenant-run/fixture",
    "provenant-supervisor/fixture",
    "provenant-routing/fixture",
    "provenant-test-support/fixture",
    "provenant-os/fixture",
    "provenant-quota/fixture",
    "provenant-config/fixture",
    "provenant-confinement/fixture",
    "provenant-core/fixture",
    "provenant-fabric-runtime/fixture",
    "provenant-fabric-store/fixture",
    "provenant-records/fixture",
    "provenant-workflow/fixture",
    "provenant-providers/fixture",
    "provenant-telemetry/fixture",
]

[dependencies]
provenant-test-support = { path = "../test-support", optional = true }
provenant-os = { workspace = true }
provenant-quota = { workspace = true }
clap = { workspace = true, features = ["unstable-ext"] }
jiff = { workspace = true }
libc = { workspace = true }
provenant-config = { workspace = true }
provenant-confinement = { workspace = true }
provenant-core = { workspace = true }
provenant-fabric-runtime = { workspace = true }
provenant-fabric-store = { workspace = true }
provenant-records = { workspace = true }
provenant-routing = { workspace = true }
provenant-run = { workspace = true }
provenant-workflow = { workspace = true }
provenant-providers = { workspace = true }
provenant-supervisor = { workspace = true }
provenant-telemetry = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
provenant-fabric-runtime = { workspace = true, features = ["fixture"] }
provenant-routing = { workspace = true, features = ["fixture"] }
provenant-supervisor = { workspace = true, features = ["fixture"] }
provenant-providers = { workspace = true, features = ["fixture"] }
provenant-records = { workspace = true, features = ["fixture"] }
provenant-confinement = { workspace = true, features = ["fixture"] }
provenant-test-support = { path = "../test-support", features = ["fixture"] }
provenant-os = { workspace = true, features = ["fixture"] }
tempfile = { workspace = true }
rusqlite = { workspace = true }

[lints]
workspace = true
