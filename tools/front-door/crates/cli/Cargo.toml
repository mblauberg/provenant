[package]
name = "provenant-cli"
version = "1.6.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
fixture = ["dep:provenant-test-support", "provenant-run/fixture", "provenant-supervisor/fixture", "provenant-routing/fixture"]

[dependencies]
provenant-test-support = { path = "../test-support", optional = true }
provenant-os = { workspace = true }
provenant-quota = { workspace = true }
clap = { workspace = true, features = ["unstable-ext"] }
jiff = { workspace = true }
libc = { workspace = true }
provenant-config = { workspace = true }
provenant-confinement = { workspace = true }
provenant-core = { workspace = true }
provenant-fabric-runtime = { workspace = true }
provenant-fabric-mcp = { workspace = true }
provenant-fabric-store = { workspace = true }
provenant-records = { workspace = true }
provenant-routing = { workspace = true }
provenant-run = { workspace = true }
provenant-workflow = { workspace = true }
provenant-providers = { workspace = true }
provenant-supervisor = { workspace = true }
provenant-telemetry = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
provenant-supervisor = { workspace = true, features = ["fixture"] }
provenant-providers = { workspace = true, features = ["fixture"] }
provenant-records = { workspace = true, features = ["registry-fixture"] }
provenant-confinement = { workspace = true, features = ["snapshot"] }
provenant-test-support = { path = "../test-support" }
provenant-os = { workspace = true, features = ["fixture"] }
provenant-fabric-runtime = { workspace = true, features = ["retained-seed"] }
tempfile = { workspace = true }
rusqlite = { workspace = true }

[lints]
workspace = true
