[bans.build]
# Only crates in the current lockfile that actually contain build scripts.
# libsqlite3-sys builds bundled SQLite; the others probe compiler/platform
# capabilities or generate bindings/tables/macros on the supported targets.
allow-build-scripts = [
  { name = "encoding_rs" },
  { name = "getrandom" },
  { name = "libc" },
  { name = "libsqlite3-sys" },
  { name = "num-traits" },
  { name = "portable-atomic" },
  { name = "portable-atomic-util" },
  { name = "proc-macro2" },
  { name = "quote" },
  { name = "rustix" },
  { name = "rustversion" },
  { name = "serde" },
  { name = "serde_core" },
  { name = "serde_json" },
  { name = "thiserror" },
  { name = "zmij" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
