# ADR 0028: licences, advisories, sources and the approved transitive set.
# tests/workspace_policy.rs separately enforces the direct dependency list.
[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]

[licenses]
allow = [
  "MIT",          # Project licence and the ADR 0028 default.
  "Apache-2.0",   # The other ADR 0028 default; used across the dependency tree.
]

exceptions = [
  { crate = "unicode-ident", allow = ["Unicode-3.0"] },
  # Already in the approved transitive set and lockfile through hashbrown.
  # Keep this exception version-scoped; no additional crate or feature is enabled.
  { crate = "foldhash@=0.2.0", allow = ["Zlib"] },
  # Required by serde-saphyr for UTF-16 reader support.
  { crate = "encoding_rs@=0.8.42", allow = ["BSD-3-Clause"] },
]

[bans]
multiple-versions = "deny"
# Include workspace members as well as registry crates. This is an allowlist,
# not a wildcard for the transitive dependencies of an approved direct crate.
allow = [
  "aho-corasick",
