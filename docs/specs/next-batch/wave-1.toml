# Next batch, wave 1: seam cores.
# Design: docs/specs/next-batch.md#build-plan. Launch from the root of the checkout
# holding this file (brief_file paths resolve against the working directory):
#   provenant run --file docs/specs/next-batch/wave-1.toml --explain
# with.worktree is the clean review-repair checkout; create it first with
#   provenant worktree create batch/next-repair --base main
# Waves 2 and 3: set review_base to the previous wave's integrated tip before launch.
use = "batch"
integration_branch = "batch/next"
review_base = "origin/main"

[with]
worktree = "/Users/user/Repos/provenant/.worktrees/batch-next-repair"
integration_branch = "batch/next"
max_parallel = 6
items = [
  { id = "w1-interfaces", brief_file = "docs/specs/next-batch/briefs/w1-interfaces.md", model = "opencode/opencode-go/deepseek-v4.1-flash", write_scope = ["tools/front-door/crates/records/src/provenance.rs", "tools/front-door/crates/records/src/warning.rs", "tools/front-door/crates/records/src/usage.rs", "tools/front-door/crates/records/src/migrate.rs", "tools/front-door/crates/records/src/lib.rs", "tools/front-door/crates/core/src/names.rs", "tools/front-door/crates/core/src/lib.rs", "tools/front-door/src/install/migrations.rs", "tools/front-door/src/install.rs"] },
  { id = "w1-registry", brief_file = "docs/specs/next-batch/briefs/w1-registry.md", model = "opencode/opencode-go/deepseek-v4.1-flash", write_scope = ["tools/front-door/src/lib.rs", "tools/front-door/src/commands/", "tools/front-door/crates/cli/src/lib.rs", "tools/front-door/crates/cli/src/external_contract.rs", "tools/front-door/src/usage.rs", "tools/front-door/tests/workspace_policy.rs", "tools/front-door/clippy.toml"] },
  { id = "w1-envelope", brief_file = "docs/specs/next-batch/briefs/w1-envelope.md", model = "opencode/opencode-go/deepseek-v4.1-flash", write_scope = ["tools/front-door/src/output.rs", "tools/front-door/src/lib.rs", "tools/front-door/src/commands/mod.rs", "tools/front-door/crates/records/src/command_result.rs", "tools/front-door/crates/records/src/wire/mod.rs", "tools/front-door/crates/records/src/policy.rs", "tools/front-door/crates/cli/src/render.rs", "tools/front-door/crates/config/src/loader.rs", "tools/front-door/src/roots.rs", "tools/front-door/crates/sqlite/", "tools/front-door/clippy.toml", "tools/front-door/crates/cli/src/bin/generate-swift-fixtures.rs"], after = ["w1-interfaces", "w1-registry"] },
  { id = "w1-provenance", brief_file = "docs/specs/next-batch/briefs/w1-provenance.md", model = "opencode/opencode-go/deepseek-v4.1-flash", write_scope = ["tools/front-door/crates/records/src/limit.rs", "tools/front-door/crates/records/src/ports.rs", "tools/front-door/crates/records/src/run.rs", "tools/front-door/crates/records/src/diagnostic.rs", "tools/front-door/crates/config/src/ports.rs", "tools/front-door/src/install/migrations.rs", "tools/front-door/crates/records/src/install.rs", "docs/ARCHITECTURE.md"], after = ["w1-interfaces"] },
  { id = "w1-record-migration", brief_file = "docs/specs/next-batch/briefs/w1-record-migration.md", model = "opencode/opencode-go/deepseek-v4.1-flash", write_scope = ["tools/front-door/crates/records/src/policy.rs", "tools/front-door/crates/records/src/run.rs", "tools/front-door/src/install/migrations.rs", "tools/front-door/crates/records/tests/forward_compatibility.rs"], after = ["w1-interfaces"] },
  { id = "w1-names", brief_file = "docs/specs/next-batch/briefs/w1-names.md", model = "opencode/opencode-go/deepseek-v4.1-flash", write_scope = ["tools/front-door/crates/core/src/lib.rs", "tools/front-door/crates/fabric-runtime/src/graph/template.rs", "tools/front-door/crates/config/src/knobs.rs", "tools/front-door/crates/routing/src/catalog.rs", "tools/front-door/crates/cli/src/lib.rs", "tools/front-door/crates/cli/src/route.rs", "tools/front-door/crates/cli/src/route/", "tools/front-door/crates/cli/src/run/provider/preparation.rs"], after = ["w1-interfaces"] },
  { id = "w1-forge", brief_file = "docs/specs/next-batch/briefs/w1-forge.md", model = "opencode/opencode-go/deepseek-v4.1-flash", write_scope = ["tools/front-door/crates/config/src/forge.rs", "tools/front-door/crates/config/src/ports.rs", "tools/front-door/src/pr.rs", "tools/front-door/src/tracker.rs", "tools/front-door/src/pr/open.rs", "tools/front-door/src/retention_owner.rs", "tools/front-door/src/pr/status/batch.rs", "tools/front-door/src/pr/landing/adapters.rs", "tools/front-door/src/pr/observer/port.rs", "tools/front-door/src/install.rs", "tools/front-door/crates/run/src/delivery.rs", "tools/front-door/crates/cli/src/run.rs", "tools/front-door/src/fabric/owner.rs", "tools/front-door/src/fabric/interface.rs"], after = ["w1-interfaces"] },
