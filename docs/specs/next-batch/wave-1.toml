  { id = "w1-project-dirs", brief_file = "docs/specs/next-batch/briefs/w1-project-dirs.md", model = "opencode/opencode-go/deepseek-v4.1-flash", write_scope = ["tools/front-door/crates/config/src/project_binding.rs", "tools/front-door/crates/config/src/overlays.rs", "tools/front-door/crates/config/src/admission.rs", "tools/front-door/src/install/migrations.rs"], after = ["w1-interfaces"] },
  { id = "w1-writer-settlement", brief_file = "docs/specs/next-batch/briefs/w1-writer-settlement.md", model = "opencode/opencode-go/deepseek-v4.1-flash", write_scope = ["tools/front-door/crates/run/src/writer.rs", "tools/front-door/crates/confinement/src/worktrees/custody.rs", "tools/front-door/crates/run/src/objects/view.rs"] },
]
