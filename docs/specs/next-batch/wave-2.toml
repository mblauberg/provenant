# Next batch, wave 2: move every caller.
# Design: docs/specs/next-batch.md#build-plan. Launch from the root of the checkout
# holding this file (brief_file paths resolve against the working directory):
#   provenant run --file docs/specs/next-batch/wave-2.toml --explain
# with.worktree is the clean review-repair checkout; create it first with
#   provenant worktree create batch/next-repair --base main
# Waves 2 and 3: set review_base to the previous wave's integrated tip before launch.
use = "batch"
integration_branch = "batch/next"
review_base = "origin/main"

[with]
worktree = "/Users/user/Repos/provenant/.worktrees/batch-next-repair"
integration_branch = "batch/next"
max_parallel = 7
items = [
  { id = "w2-warn-lib-a", brief_file = "docs/specs/next-batch/briefs/w2-warn-lib-a.md", model = "opencode/opencode-go/hy4-flash-free", write_scope = ["tools/front-door/crates/config/", "tools/front-door/crates/records/", "tools/front-door/crates/core/", "tools/front-door/crates/routing/", "tools/front-door/crates/quota/", "tools/front-door/crates/providers/", "tools/front-door/crates/os/", "tools/front-door/crates/sqlite/", "tools/front-door/crates/telemetry/", "tools/front-door/clippy.toml"] },
  { id = "w2-warn-lib-b", brief_file = "docs/specs/next-batch/briefs/w2-warn-lib-b.md", model = "opencode/opencode-go/hy4-flash-free", write_scope = ["tools/front-door/crates/run/", "tools/front-door/crates/confinement/", "tools/front-door/crates/supervisor/", "tools/front-door/crates/fabric-runtime/", "tools/front-door/crates/workflow/"] },
  { id = "w2-warn-cli", brief_file = "docs/specs/next-batch/briefs/w2-warn-cli.md", model = "opencode/opencode-go/hy4-flash-free", write_scope = ["tools/front-door/crates/cli/"] },
  { id = "w2-warn-src", brief_file = "docs/specs/next-batch/briefs/w2-warn-src.md", model = "opencode/opencode-go/hy4-flash-free", write_scope = ["tools/front-door/src/"] },
  { id = "w2-sources-config", brief_file = "docs/specs/next-batch/briefs/w2-sources-config.md", model = "opencode/opencode-go/hy4-flash-free", write_scope = ["tools/front-door/crates/config/src/knobs.rs", "tools/front-door/crates/config/src/schema.rs", "tools/front-door/crates/config/src/overlays.rs", "tools/front-door/crates/config/src/admission.rs", "tools/front-door/crates/records/src/diagnostic.rs", "tools/front-door/crates/cli/src/config_reads.rs", "tools/front-door/src/lib.rs"] },
  { id = "w2-sources-other", brief_file = "docs/specs/next-batch/briefs/w2-sources-other.md", model = "opencode/opencode-go/hy4-flash-free", write_scope = ["tools/front-door/crates/records/src/run.rs", "tools/front-door/crates/routing/src/resolve.rs", "tools/front-door/crates/fabric-runtime/src/config.rs", "tools/front-door/crates/fabric-runtime/src/graph/template.rs", "tools/front-door/src/pr/landing/policy.rs", "tools/front-door/crates/confinement/src/run_config.rs"] },
  { id = "w2-remote-literals", brief_file = "docs/specs/next-batch/briefs/w2-remote-literals.md", model = "opencode/opencode-go/hy4-flash-free", write_scope = ["tools/front-door/src/handoff.rs", "tools/front-door/src/cloud.rs", "tools/front-door/src/gc_support.rs", "tools/front-door/crates/confinement/src/worktrees/gc.rs", "tools/front-door/crates/run/src/delivery.rs", "tools/front-door/crates/confinement/src/worktrees/lifecycle.rs", "tools/front-door/crates/run/src/writer.rs", "tools/front-door/src/lane_cleanup.rs"] },
]
