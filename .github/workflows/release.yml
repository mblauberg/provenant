name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PROVENANT_ROOT: ${{ github.workspace }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check release inputs
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$(uname -m)" = arm64
          test -f "docs/release-notes/$RELEASE_TAG.md"
      - name: Install pinned toolchain
        uses: ./.github/actions/install-rust
        with:
          components: rustfmt clippy
      - name: Build and package
        working-directory: tools/front-door
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          CARGO_BUILD_BUILD_DIR: ${{ runner.temp }}/cargo-target
          RUSTC_WRAPPER: .cargo/rustc-wrapper.sh
        run: |
          cargo build --release --locked --bin provenant
          codesign --force --sign - "$CARGO_TARGET_DIR/release/provenant"
          cargo run --release --locked --bin package-release -- --binary "$CARGO_TARGET_DIR/release/provenant" --out "$RUNNER_TEMP/release"
          "$PROVENANT_ROOT/apps/quota-menubar/bundle" "$RUNNER_TEMP/apps"
          apps_archive="$RUNNER_TEMP/provenant-apps-aarch64-apple-darwin.tar.gz"
          tar -czf "$apps_archive" -C "$RUNNER_TEMP/apps" .
          archive="$RUNNER_TEMP/provenant-aarch64-apple-darwin.tar.gz"
          tar -czf "$archive" -C "$RUNNER_TEMP/release" .
          cp "$PROVENANT_ROOT/docs/release-notes/$RELEASE_TAG.md" "$RUNNER_TEMP/$RELEASE_TAG.md"
          cd "$RUNNER_TEMP"
          shasum -a 256 "$(basename "$archive")" > "$archive.sha256"
          shasum -a 256 "$(basename "$apps_archive")" > "$apps_archive.sha256"
      - name: Check candidate release range
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! published_releases="$(gh release list \
            --repo "$GH_REPO" \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName,publishedAt \
            --limit 1000)"; then
            echo "Cannot check candidate release: unable to read published GitHub Releases." >&2
            exit 1
          fi
          if ! base_tag="$(printf '%s\n' "$published_releases" | python3 -c '
          import json
          import os
          import sys

          candidate = os.environ["RELEASE_TAG"]
          releases = [
              release
              for release in json.load(sys.stdin)
              if release.get("tagName") != candidate and release.get("publishedAt")
          ]
          releases.sort(key=lambda release: release["publishedAt"], reverse=True)
          if not releases:
              print("No prior published GitHub Release is available as the candidate base.", file=sys.stderr)
              raise SystemExit(1)
          print(releases[0]["tagName"])
          ')"; then
            echo "Cannot check candidate release: no prior published release tag was found." >&2
            exit 1
          fi
          if ! release_head="$(git rev-parse --verify --end-of-options "${GITHUB_SHA}^{commit}")"; then
            echo "Cannot check candidate release: the event SHA is not available as a commit." >&2
            exit 1
          fi
          checked_head="$(git rev-parse --verify --end-of-options 'HEAD^{commit}')"
          if [ "$release_head" != "$checked_head" ]; then
            echo "Cannot check candidate release: checkout HEAD does not match the tag event SHA." >&2
            exit 1
          fi
          if ! release_base="$(git rev-parse --verify --end-of-options "${base_tag}^{commit}")"; then
            echo "Cannot check candidate release: published base tag '$base_tag' is unavailable." >&2
            exit 1
          fi
          if [ "$release_base" = "$release_head" ] \
            || ! git merge-base --is-ancestor "$release_base" "$release_head"; then
            echo "Cannot check candidate release: published base '$base_tag' is not a nonempty ancestor of $RELEASE_TAG." >&2
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/release-check-home" "$RUNNER_TEMP/release-check-state"
          HOME="$RUNNER_TEMP/release-check-home" "$RUNNER_TEMP/release/bin/provenant" \
            --state-dir "$RUNNER_TEMP/release-check-state" check release \
            --base "$release_base" --head "$release_head"
      - name: Upload release artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ runner.temp }}/provenant-aarch64-apple-darwin.tar.gz
            ${{ runner.temp }}/provenant-aarch64-apple-darwin.tar.gz.sha256
            ${{ runner.temp }}/provenant-apps-aarch64-apple-darwin.tar.gz
            ${{ runner.temp }}/provenant-apps-aarch64-apple-darwin.tar.gz.sha256
            ${{ runner.temp }}/${{ github.ref_name }}.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum -c provenant-aarch64-apple-darwin.tar.gz.sha256
          sha256sum -c provenant-apps-aarch64-apple-darwin.tar.gz.sha256
          gh release create "$RELEASE_TAG" \
            provenant-aarch64-apple-darwin.tar.gz \
            provenant-aarch64-apple-darwin.tar.gz.sha256 \
            provenant-apps-aarch64-apple-darwin.tar.gz \
            provenant-apps-aarch64-apple-darwin.tar.gz.sha256 \
            --verify-tag --title "$RELEASE_TAG" \
            --notes-file "$RELEASE_TAG.md"
