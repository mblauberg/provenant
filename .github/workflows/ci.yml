name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merge queue: the queue waits for `ci-status` on the temporary merge-group
  # ref, so the workflow must run there or entries time out.
  merge_group:
    types: [checks_requested]

# Least privilege: the workflow grants nothing by default; every job
# declares exactly what it needs.
permissions: {}

env:
  PROVENANT_ROOT: ${{ github.workspace }}

# Concurrency policy (issue #170, deferred from #150/#168): PR runs cancel
# their predecessor on the same ref — a superseded push means the stale run's
# result can never matter, so cancelling it just frees runners faster.
#
# Main runs share a separate group with cancellation disabled. The active run
# finishes, and GitHub retains only the newest pending push for that group.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-{0}-main', github.workflow) || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    name: Harness asset checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tools/front-door/target
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/front-door
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check harness assets
        working-directory: tools/front-door
        env:
          PROVENANT_ROOT: ${{ github.workspace }}
          PROVENANT_STATE_DIR: ${{ runner.temp }}/provenant-state
          TMPDIR: ${{ runner.temp }}
        run: cargo run --locked -q -p provenant --bin provenant -- check harness --project "$GITHUB_WORKSPACE"

  rust:
    name: Rust front door
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tools/front-door/target
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image ships rustup; the toolchain is pinned here and in
      # tools/front-door/rust-toolchain.toml (ADR 0027).
      - name: Set Rust temporary directory
        env:
          TMPDIR: ${{ runner.temp }}
        run: printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/front-door
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        working-directory: tools/front-door
        run: cargo fmt --all --check
      - name: Lint
        working-directory: tools/front-door
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Install nextest
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149
      - name: Run workspace tests
        working-directory: tools/front-door
        run: cargo nextest run --profile ci --workspace --locked
      - name: Run documentation tests
        working-directory: tools/front-door
        run: cargo test --doc --workspace --locked
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-nextest-junit
          path: tools/front-door/target/nextest/ci/junit.xml
          if-no-files-found: warn

  rust-dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Rust temporary directory
        env:
          TMPDIR: ${{ runner.temp }}
        run: printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install dependency tools
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.14.0
      - name: Check advisories, licences and dependency allowlist
        working-directory: tools/front-door
        run: cargo deny check
      - name: Check for unused dependencies
        working-directory: tools/front-door
        run: cargo shear

  # #1339: stripping proc-macro dylibs broke macOS release builds at install
  # time. Exercise the front door's release build.
  rust-macos-release:
    name: Rust macOS release smoke
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Rust temporary directory
        env:
          TMPDIR: ${{ runner.temp }}
        run: printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Run macOS supervisor custody tests
        working-directory: tools/front-door
        env:
          PROVENANT_CONFINEMENT_REQUIRED: "1"
        run: cargo test -p provenant-supervisor -p provenant-confinement --locked
      - name: Run writer dispatch integration tests
        working-directory: tools/front-door
        env:
          PROVENANT_CONFINEMENT_REQUIRED: "1"
        run: |
          cargo test --test worktrees --locked -- --exact writer_dispatch_edits_a_linked_worktree
          cargo test --test worktrees --locked -- --exact second_writer_is_refused_while_first_holds_the_worktree
          cargo test --test worktrees --locked -- --exact writer_terminal_refuses_sequencer_state
      - name: Run menu bar tests
        working-directory: apps/quota-menubar
        run: swift test
      # No target cache: install builds from a clean target, and cached
      # proc-macro dylibs would hide the failure this job exists to catch.
      - name: Build release front door
        working-directory: tools/front-door
        run: |
          cargo build --release --locked -p provenant --bin provenant

      - name: Package release and preview isolated installation
        working-directory: tools/front-door
        run: |
          cargo run --release --locked --example package-release -- --out "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/release/bin/provenant" \
            --state-dir "$RUNNER_TEMP/state" install --source "$RUNNER_TEMP/release" \
            --harness claude --harness codex --bin-dir "$RUNNER_TEMP/bin" --dry-run
          test -z "$(ls -A "$RUNNER_TEMP/home")"
          test ! -e "$RUNNER_TEMP/bin"

  generic-checks:
    name: Spelling, workflows and Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install spelling checker
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: typos-cli@1.51.1
      # These tools are not in install-action's supported binary catalogue.
      # Verify the pinned upstream release archives before executing them.
      - name: Install actionlint, ShellCheck and lychee
        env:
          TOOL_DIR: ${{ runner.temp }}/generic-tools
        run: |
          mkdir -p "$TOOL_DIR/bin"
          cd "$TOOL_DIR"
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz -C bin actionlint
          curl --fail --silent --show-error --location --output shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz' | sha256sum --check
          tar -xJf shellcheck.tar.xz --strip-components=1 -C bin shellcheck-v0.11.0/shellcheck
          curl --fail --silent --show-error --location --output lychee.tar.gz \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo '1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee.tar.gz' | sha256sum --check
          tar -xzf lychee.tar.gz --strip-components=1 -C bin lychee-x86_64-unknown-linux-gnu/lychee
          echo "$TOOL_DIR/bin" >> "$GITHUB_PATH"
      - name: Check spelling
        run: git ls-files | typos --file-list - --force-exclude
      - name: Check workflows and their shell blocks
        run: actionlint
      - name: Check shell scripts
        run: |
          { git ls-files '*.sh'; grep -lE '^#!.*\b(ba)?sh\b' scripts/* 2>/dev/null; } | sort -u | xargs -r shellcheck
      - name: Check local Markdown links and fragments
        run: git ls-files '*.md' | lychee --offline --include-fragments --files-from -
      - name: Check retired names
        run: scripts/check-retired-names

  zizmor:
    name: Workflow security lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.31.1"
          # Audit workflow definitions on every tested tree.
          inputs: ".github/workflows"
          online-audits: "false"
          advanced-security: "false"
          annotations: "true"

  # Every surviving job runs on every tested tree. Keep one required check
  # and fail closed on failure, cancellation or an unexpectedly skipped job.
  ci-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      - docs
      - rust
      - rust-macos-release
      - rust-dependencies
      - zizmor
      - generic-checks
    if: always()
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          blocking="$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[]
             | select(.value.result != "success")
             | "\(.key)=\(.value.result)"')"
          if [ -n "$blocking" ]; then
            echo "Blocking job results:"
            echo "$blocking"
            exit 1
          fi
          echo "All needed jobs succeeded."
