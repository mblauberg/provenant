name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merge queue: the queue waits for `ci-status` on the temporary merge-group
  # ref, so the workflow must run there or entries time out.
  merge_group:
    types: [checks_requested]

# Least privilege: the workflow grants nothing by default; every job
# declares exactly what it needs.
permissions: {}

# Concurrency policy (issue #170, deferred from #150/#168): PR runs cancel
# their predecessor on the same ref — a superseded push means the stale run's
# result can never matter, so cancelling it just frees runners faster.
#
# Main runs share a separate group with cancellation disabled. The active run
# finishes, and GitHub retains only the newest pending push for that group.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-{0}-main', github.workflow) || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Path filtering happens here, never via workflow-level `paths:`, so the
  # aggregate `ci-status` check below always reports and merges can never
  # deadlock on a required check that stays pending.
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      # Pushes to main always run every job: full post-merge verification
      # and warm caches on the default branch for pull requests to reuse.
      # Merge-group runs do the same: the queued commit is the exact tree that
      # will land, so it gets the full gate rather than a path-filtered one.
      # A pull request that changes only prose documents skips the full Python
      # suite (harness) and runs the quick `docs` job instead; see the
      # classification step below.
      harness: ${{ github.event_name != 'pull_request' && 'true' || (steps.filter.outputs.harness == 'true' && steps.docs.outputs.docs-only != 'true') }}
      docs: ${{ github.event_name == 'pull_request' && steps.filter.outputs.harness == 'true' && steps.docs.outputs.docs-only == 'true' }}
      workflows: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.workflows }}
      rust: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.rust }}
      lane: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.lane }}
      tree: ${{ steps.tree.outputs.tree }}
      passed-tree: ${{ steps.tree.outputs.passed-tree }}
    steps:
      - name: Check out tested tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for a passing PR run on this tree
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "passed-tree=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            exit 0
          fi
          name="ci-passed-tree-$tree"
          if ! artifacts="$(gh api "repos/$REPO/actions/artifacts?name=$name")"; then
            echo "Artifact lookup failed; running Python shards."
            exit 0
          fi
          # Trust a marker only from a successful ci.yml run on this repository's
          # own branches: a fork PR runs its own workflow file and could upload
          # any artifact name without testing anything.
          runs="$(printf '%s' "$artifacts" | jq -r --arg name "$name" \
            '.artifacts[]? | select(.name == $name and .expired == false
              and .workflow_run.head_repository_id == .workflow_run.repository_id)
              | .workflow_run.id')"
          for run in $runs; do
            if gh api "repos/$REPO/actions/runs/$run" | jq -e --arg repo "$REPO" \
              '.path == ".github/workflows/ci.yml" and .conclusion == "success"
                and .head_repository.full_name == $repo' >/dev/null 2>&1; then
              echo "Python shards passed in run $run on this tree; skipping them."
              echo "passed-tree=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done
      # Docs-only classification. A change is docs-only when every changed
      # path (including rename sources) is a Markdown file under docs/ that no
      # test reads for its content. The carved-out documents are read by
      # tests (worktrees.md, ARCHITECTURE.md, evals/ fixtures, the
      # model-benchmarks dataset), so editing them still runs the full suite.
      # The `harness` path filter below is unchanged and still the
      # source of the every-tracked-file-matches invariant; this step only
      # narrows what a matching pull request has to run. It fails closed:
      # any API error fails detect-changes, and so ci-status.
      - name: Classify docs-only changes
        id: docs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"
          prose='^docs/.+\.md$'
          read_by_tests='^docs/(worktrees\.md|ARCHITECTURE\.md|evals/|research/model-benchmarks/)'
          other="$( { printf '%s\n' "$files" | grep -Ev "$prose" || true
                      printf '%s\n' "$files" | grep -E "$read_by_tests" || true; } | sed '/^$/d')"
          count="$(printf '%s\n' "$files" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ -z "$other" ] && [ "$count" -gt 0 ] && [ "$count" -lt 2900 ]; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Invariant: every tracked file matches at least one filter, so no
          # change can skip every build job while ci-status reports green.
          # The harness filter covers the Python tests and ordinary repository
          # checks run by this job, including scripts, skills, tests and documents.
          filters: |
            ci-contract: &ci-contract
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            node-workspace: &node-workspace
              - 'package.json'
              - 'package-lock.json'
            harness:
              - *ci-contract
              - *node-workspace
              - '.github/**'
              - 'apps/**'
              - 'config/**'
              - 'docs/**'
              - 'evals/**'
              - 'library/**'
              - 'runtime/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'skills/**'
              - 'tests/**'
              - 'tools/**'
              - '.gitignore'
              - '_typos.toml'
              - 'ACKNOWLEDGEMENTS.md'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'HARNESS.md'
              - 'LICENSE'
              - 'LICENSES/**'
              - 'MAINTAINING.md'
              - 'NOTICE'
              - 'README.md'
              - 'SECURITY.md'
              - 'THIRD_PARTY_NOTICES.md'
              # Locked Python test tooling for this job's own gate.
              - 'pyproject.toml'
              - 'uv.lock'
            rust:
              - *ci-contract
              - 'tools/front-door/**'
              - 'tests/support/front_door.py'
              - 'scripts/check_target.py'
              - 'scripts/worktree.py'
            lane:
              - *ci-contract
              - 'tools/**'
              - 'skills/orchestrate/scripts/**'
              - 'skills/_shared/**'
              - 'tests/lane_conformance/**'
              - 'tests/support/**'
              - 'tests/cf_dispatch_support.py'
              - 'tests/conftest.py'
              - 'config/model-routing.json'
              - 'scripts/lib/jsonc.py'
              - 'scripts/fabric_hosts.py'
              - 'pyproject.toml'
              - 'uv.lock'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/zizmor.yml'
              - '.github/actionlint.yaml'

  harness-checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.harness == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history supports the frozen eval-predecessor test's
          # historical blob lookup in tests/test_skill_eval_fixtures.py.
          # PR-scoped timebomb fixture lint also needs origin/main for its
          # changed-context diff.
          fetch-depth: 0
      - name: Set up Node.js workspace
        uses: $/.github/actions/setup-node-workspace
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked harness test dependencies
        run: uv sync --locked --only-group test
      - name: Run workspace checks
        run: npm run check
      - name: Run ordinary checks
        env:
          # Remaining Python checks use an isolated checkout fixture.
          AGENT_FABRIC_PRODUCT_ROOT: ${{ github.workspace }}
          AGENT_FABRIC_INSTANCE_ROOT: ${{ github.workspace }}
          HARNESS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: scripts/check-harness --checks-only

  python-tests:
    name: Python tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The slow Fabric host file is pinned to shard 1; path hashes split the
    # remaining files across shards 2 and 3.
    timeout-minutes: 20
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.harness == 'true' && needs.detect-changes.outputs.passed-tree != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [fabric-hosts, python-a, python-b]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js workspace
        uses: $/.github/actions/setup-node-workspace
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked harness test dependencies
        run: uv sync --locked --only-group test
      - name: Build Rust front door before parallel test collection
        run: |
          cargo build --release --locked --manifest-path tools/front-door/Cargo.toml
          printf 'PROVENANT_FRONT_DOOR_BIN=%s\n' "$GITHUB_WORKSPACE/tools/front-door/target/release/provenant" >> "$GITHUB_ENV"
      - name: Run Python test shard
        env:
          AGENT_FABRIC_PRODUCT_ROOT: ${{ github.workspace }}
          AGENT_FABRIC_INSTANCE_ROOT: ${{ github.workspace }}
          PROVENANT_TEST_SHARD: ${{ matrix.shard == 'fabric-hosts' && '1/3' || matrix.shard == 'python-a' && '2/3' || '3/3' }}
        # The process conformance suite has its own serial, cross-platform job.
        run: .venv/bin/python -m pytest -q --durations=30 --durations-min=1 -n auto --ignore=tests/lane_conformance

  lane-conformance:
    name: Lane conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.lane == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked harness test dependencies
        run: uv sync --locked --only-group test
      - name: Run lane conformance serially
        run: .venv/bin/python -m pytest tests/lane_conformance -q

  # Quick path for pull requests that change only prose under docs/: the
  # frontmatter, link and issue-form checks plus the two tests that read every
  # document. Runs only when `harness` is skipped; push, merge-group and any
  # non-prose change run the full suite instead.
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true' && needs.detect-changes.outputs.harness != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js workspace
        uses: $/.github/actions/setup-node-workspace
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked harness test dependencies
        run: uv sync --locked --only-group test
      - name: Run document and link checks
        env:
          AGENT_FABRIC_PRODUCT_ROOT: ${{ github.workspace }}
          AGENT_FABRIC_INSTANCE_ROOT: ${{ github.workspace }}
        run: |
          .venv/bin/python scripts/check_harness.py
          .venv/bin/python -m pytest -q tests/test_harness_document_contract.py

  rust:
    name: Rust front door
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tools/front-door/target
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image ships rustup; the toolchain is pinned here and in
      # tools/front-door/rust-toolchain.toml (ADR 0027).
      - name: Set Rust temporary directory
        env:
          TMPDIR: ${{ runner.temp }}
        run: printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/front-door
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked harness test dependencies
        run: uv sync --locked --only-group test
      # Port differential tests run the Python/TS oracles and must not skip
      # in CI (PORTING R9).
      - name: Set up Node.js workspace
        uses: $/.github/actions/setup-node-workspace
      - name: Require port differential oracles
        run: |
          {
            echo "PROVENANT_PORT_DIFF_REQUIRED=1"
            echo "PROVENANT_PORT_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python"
            echo "PROVENANT_PORT_NODE=$(command -v node)"
          } >> "$GITHUB_ENV"
      - name: Check formatting
        working-directory: tools/front-door
        run: cargo fmt --all --check
      - name: Lint
        working-directory: tools/front-door
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Install nextest
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149
      - name: Run workspace tests
        working-directory: tools/front-door
        run: cargo nextest run --profile ci --workspace --locked
      - name: Run fault-injection tests
        working-directory: tools/front-door
        run: cargo nextest run --profile ci -p provenant --features fault-injection --locked
      - name: Run documentation tests
        working-directory: tools/front-door
        run: cargo test --doc --workspace --locked
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-nextest-junit
          path: tools/front-door/target/nextest/ci/junit.xml
          if-no-files-found: warn
      - name: Build release binary
        working-directory: tools/front-door
        run: |
          cargo build --release --locked
      - name: Run the golden CLI suite
        run: PROVENANT_GOLDEN_REQUIRED=1 PROVENANT_GOLDEN_BIN="$CARGO_TARGET_DIR/release/provenant" .venv/bin/python -m pytest tests/golden -q

  rust-dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Rust temporary directory
        env:
          TMPDIR: ${{ runner.temp }}
        run: printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install dependency tools
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.14.0
      - name: Check advisories, licences and dependency allowlist
        working-directory: tools/front-door
        run: cargo deny check
      - name: Check for unused dependencies
        working-directory: tools/front-door
        run: cargo shear

  # #1339: stripping proc-macro dylibs broke macOS release builds at install
  # time. Share the Rust path filter and exercise the front door's release build.
  rust-macos-release:
    name: Rust macOS release smoke
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Rust temporary directory
        env:
          TMPDIR: ${{ runner.temp }}
        run: printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      # No target cache: install builds from a clean target, and cached
      # proc-macro dylibs would hide the failure this job exists to catch.
      - name: Build release front door
        working-directory: tools/front-door
        run: |
          cargo build --release --locked -p provenant --bin provenant

  generic-checks:
    name: Spelling, workflows and Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install spelling checker
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: typos-cli@1.51.1
      # These tools are not in install-action's supported binary catalogue.
      # Verify the pinned upstream release archives before executing them.
      - name: Install actionlint, ShellCheck and lychee
        env:
          TOOL_DIR: ${{ runner.temp }}/generic-tools
        run: |
          mkdir -p "$TOOL_DIR/bin"
          cd "$TOOL_DIR"
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz -C bin actionlint
          curl --fail --silent --show-error --location --output shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz' | sha256sum --check
          tar -xJf shellcheck.tar.xz --strip-components=1 -C bin shellcheck-v0.11.0/shellcheck
          curl --fail --silent --show-error --location --output lychee.tar.gz \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo '1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee.tar.gz' | sha256sum --check
          tar -xzf lychee.tar.gz --strip-components=1 -C bin lychee-x86_64-unknown-linux-gnu/lychee
          echo "$TOOL_DIR/bin" >> "$GITHUB_PATH"
      - name: Check spelling
        run: git ls-files | typos --file-list - --force-exclude
      - name: Check workflows and their shell blocks
        run: actionlint
      - name: Check local Markdown links and fragments
        run: git ls-files '*.md' | lychee --offline --include-fragments --files-from -

  zizmor:
    name: Workflow security lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.workflows == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.31.1"
          # Audit exactly the surfaces this job is path-filtered on.
          inputs: ".github/workflows .github/actions"
          config: .github/zizmor.yml
          online-audits: "false"
          advanced-security: "false"
          annotations: "true"

  # Single required check. Succeeds only when every needed job either
  # succeeded or was skipped by the path filter; fails closed on any
  # failure or cancellation, including detect-changes itself.
  ci-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      - detect-changes
      - harness-checks
      - python-tests
      - lane-conformance
      - docs
      - rust
      - rust-macos-release
      - rust-dependencies
      - zizmor
      - generic-checks
    if: always()
    steps:
      - name: Fail unless every needed job succeeded or was skipped by filter
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          blocking="$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[]
             | select(.value.result != "success" and .value.result != "skipped")
             | "\(.key)=\(.value.result)"')"
          if [ -n "$blocking" ]; then
            echo "Blocking job results:"
            echo "$blocking"
            exit 1
          fi
          echo "All needed jobs succeeded or were skipped by the path filter."
      - name: Write tested tree marker
        if: github.event_name == 'pull_request' && needs.detect-changes.outputs.harness == 'true'
        env:
          TREE_SHA: ${{ needs.detect-changes.outputs.tree }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-tree"
          printf '%s\n' "$TREE_SHA" > "$RUNNER_TEMP/ci-tree/tree-sha"
      - name: Record passing PR tree
        if: github.event_name == 'pull_request' && needs.detect-changes.outputs.harness == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-passed-tree-${{ needs.detect-changes.outputs.tree }}
          path: ${{ runner.temp }}/ci-tree/tree-sha
          if-no-files-found: error
