name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merge queue: the queue waits for `ci-status` on the temporary merge-group
  # ref, so the workflow must run there or entries time out.
  merge_group:
    types: [checks_requested]

# Least privilege: the workflow grants nothing by default; every job
# declares exactly what it needs.
permissions: {}

# Concurrency policy (issue #170, deferred from #150/#168): PR runs cancel
# their predecessor on the same ref — a superseded push means the stale run's
# result can never matter, so cancelling it just frees runners faster.
#
# Main runs share a separate group with cancellation disabled. The active run
# finishes, and GitHub retains only the newest pending push for that group.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-{0}-main', github.workflow) || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Path filtering happens here, never via workflow-level `paths:`, so the
  # aggregate `ci-status` check below always reports and merges can never
  # deadlock on a required check that stays pending.
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      # Pushes to main always run every job: full post-merge verification
      # and warm caches on the default branch for pull requests to reuse.
      # Merge-group runs do the same: the queued commit is the exact tree that
      # will land, so it gets the full gate rather than a path-filtered one.
      # A pull request that changes only prose documents skips the full Python
      # suite (harness) and runs the quick `docs` job instead; see the
      # classification step below.
      harness: ${{ github.event_name != 'pull_request' && 'true' || (steps.filter.outputs.harness == 'true' && steps.docs.outputs.docs-only != 'true') }}
      docs: ${{ github.event_name == 'pull_request' && steps.filter.outputs.harness == 'true' && steps.docs.outputs.docs-only == 'true' }}
      fabric: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.fabric }}
      split-root: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.split-root }}
      workflows: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.workflows }}
      rust: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.rust }}
      lane: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.lane }}
      tree: ${{ steps.tree.outputs.tree }}
      passed-tree: ${{ steps.tree.outputs.passed-tree }}
    steps:
      - name: Check out tested tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for a passing PR run on this tree
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "passed-tree=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            exit 0
          fi
          name="ci-passed-tree-$tree"
          if ! artifacts="$(gh api "repos/$REPO/actions/artifacts?name=$name")"; then
            echo "Artifact lookup failed; running Python shards."
            exit 0
          fi
          # Trust a marker only from a successful ci.yml run on this repository's
          # own branches: a fork PR runs its own workflow file and could upload
          # any artifact name without testing anything.
          runs="$(printf '%s' "$artifacts" | jq -r --arg name "$name" \
            '.artifacts[]? | select(.name == $name and .expired == false
              and .workflow_run.head_repository_id == .workflow_run.repository_id)
              | .workflow_run.id')"
          for run in $runs; do
            if gh api "repos/$REPO/actions/runs/$run" | jq -e --arg repo "$REPO" \
              '.path == ".github/workflows/ci.yml" and .conclusion == "success"
                and .head_repository.full_name == $repo' >/dev/null 2>&1; then
              echo "Python shards passed in run $run on this tree; skipping them."
              echo "passed-tree=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done
      # Docs-only classification. A change is docs-only when every changed
      # path (including rename sources) is a Markdown file under docs/ that no
      # test reads for its content. The carved-out documents are read by
      # tests (worktrees.md, ARCHITECTURE.md, evals/ fixtures, the
      # model-benchmarks dataset), so editing them still runs the full suite.
      # The `harness` path filter below is unchanged and still the
      # source of the every-tracked-file-matches invariant; this step only
      # narrows what a matching pull request has to run. It fails closed:
      # any API error fails detect-changes, and so ci-status.
      - name: Classify docs-only changes
        id: docs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"
          prose='^docs/.+\.md$'
          read_by_tests='^docs/(worktrees\.md|ARCHITECTURE\.md|evals/|research/model-benchmarks/)'
          other="$( { printf '%s\n' "$files" | grep -Ev "$prose" || true
                      printf '%s\n' "$files" | grep -E "$read_by_tests" || true; } | sed '/^$/d')"
          count="$(printf '%s\n' "$files" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ -z "$other" ] && [ "$count" -gt 0 ] && [ "$count" -lt 2900 ]; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Invariant: every tracked file matches at least one filter, so no
          # change can skip every build job while ci-status reports green.
          # The harness filter covers the Python tests and ordinary repository
          # checks run by this job, including scripts, skills, tests and documents.
          filters: |
            ci-contract: &ci-contract
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            node-workspace: &node-workspace
              - 'package.json'
              - 'package-lock.json'
            harness:
              - *ci-contract
              - *node-workspace
              - '.github/**'
              - 'apps/**'
              - 'config/**'
              - 'docs/**'
              - 'evals/**'
              - 'library/**'
              - 'runtime/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'skills/**'
              - 'tests/**'
              - 'tools/**'
              - 'workflows/**'
              - '.gitignore'
              - 'ACKNOWLEDGEMENTS.md'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'HARNESS.md'
              - 'LICENSE'
              - 'LICENSES/**'
              - 'MAINTAINING.md'
              - 'NOTICE'
              - 'README.md'
              - 'SECURITY.md'
              - 'THIRD_PARTY_NOTICES.md'
              # Locked Python test tooling for this job's own gate.
              - 'pyproject.toml'
              - 'uv.lock'
            fabric:
              - *ci-contract
              - *node-workspace
              - 'config/**'
              - 'pyproject.toml'
              - 'scripts/**'
              - 'skills/**'
              - 'uv.lock'
              - 'runtime/fabric/**'
            split-root:
              - *ci-contract
              - *node-workspace
              # Install/instance/contract surfaces only. runtime/** and
              # scripts/** stay because the job runs `npm run check` and the
              # provisioner under genuinely split ambient roots: a
              # root-resolution regression that passes fused would otherwise
              # skip split entirely (fail-open), and install-harness calls
              # helpers beyond install*/instance* (manage_installation,
              # configure-*, write-product-root-pointer, lib/**,
              # the installed command). tests/ narrows to exactly the contract
              # files this job runs — every other test rides the harness
              # fused suite. Broader docs/skills changes skip split;
              # the harness filter stays near-total by design.
              - 'config/**'
              - 'runtime/**'
              - 'scripts/**'
              - 'tests/test_split_root_contract.py'
              - 'tests/test_install_harness.py'
              - 'tests/test_install_provenant_command.py'
              - 'tests/test_install_skills.py'
              - 'tests/test_instance_installation.py'
              - 'tests/test_check_provenant_install.py'
              - 'docs/worktrees.md'
            rust:
              - *ci-contract
              - 'tools/front-door/**'
              - 'tests/test_stale.py'
              - 'tests/support/front_door.py'
              - 'scripts/check_target.py'
              - 'scripts/lib/front_door_build.py'
              - 'scripts/lib/product_root_resolver.py'
              - 'scripts/lib/stale_checkout.py'
              - 'scripts/worktree.py'
            lane:
              - *ci-contract
              - 'tools/**'
              - 'skills/orchestrate/scripts/**'
              - 'skills/_shared/**'
              - 'tests/lane_conformance/**'
              - 'tests/support/**'
              - 'tests/cf_dispatch_support.py'
              - 'tests/conftest.py'
              - 'config/model-routing.json'
              - 'scripts/lib/jsonc.py'
              - 'scripts/fabric_hosts.py'
              - 'pyproject.toml'
              - 'uv.lock'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/zizmor.yml'

  harness-checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.harness == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history is load-bearing here, not incidental: the frozen
          # eval-predecessor test resolves a pinned historical blob
          # (`git show <commit>:docs/evals/...` in
          # tests/test_skill_eval_fixtures.py) and the ui provenance tests
          # diff working files against a pinned modification baseline
          # (`git show <baseline>:skills/ui-ux-design/...` in
          # tests/test_ui_ux_provenance_contract.py). A depth-1 checkout of
          # this job was verified to fail exactly those four tests while
          # 1891 others passed. This harness job uses fetch-depth 0 because
          # PR-scoped timebomb fixture lint needs origin/main for its
          # changed-context diff. Only the split-root job below, whose
          # narrowed contract set is HEAD-local, checks out shallow.
          fetch-depth: 0
      - name: Set up Node.js workspace
        uses: $/.github/actions/setup-node-workspace
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked harness test dependencies
        run: uv sync --locked --only-group test
      - name: Run ordinary checks
        env:
          # A source checkout is the fused product/instance fixture for this
          # job. The split-root job below provisions and verifies the installed
          # two-root contract separately.
          AGENT_FABRIC_PRODUCT_ROOT: ${{ github.workspace }}
          AGENT_FABRIC_INSTANCE_ROOT: ${{ github.workspace }}
          HARNESS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: scripts/check-harness --checks-only

  python-tests:
    name: Python tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The slow Fabric host file is pinned to shard 1; path hashes split the
    # remaining files across shards 2 and 3.
    timeout-minutes: 20
    env:
      TMPDIR: ${{ runner.temp }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/tools/front-door/target
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.harness == 'true' && needs.detect-changes.outputs.passed-tree != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [fabric-hosts, python-a, python-b]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js workspace
        uses: $/.github/actions/setup-node-workspace
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked harness test dependencies
        run: uv sync --locked --only-group test
      - name: Build Rust front door before parallel test collection
        run: |
          binary="$(.venv/bin/python scripts/lib/front_door_build.py build tools/front-door tools/front-door/target)"
          printf 'PROVENANT_FRONT_DOOR_BIN=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Run Python test shard
        env:
          AGENT_FABRIC_PRODUCT_ROOT: ${{ github.workspace }}
          AGENT_FABRIC_INSTANCE_ROOT: ${{ github.workspace }}
          PROVENANT_TEST_SHARD: ${{ matrix.shard == 'fabric-hosts' && '1/3' || matrix.shard == 'python-a' && '2/3' || '3/3' }}
        # The process conformance suite has its own serial, cross-platform job.
        run: .venv/bin/python -m pytest -q --durations=30 --durations-min=1 -n auto --ignore=tests/lane_conformance

  lane-conformance:
    name: Lane conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.lane == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked harness test dependencies
        run: uv sync --locked --only-group test
      - name: Run lane conformance serially
        run: .venv/bin/python -m pytest tests/lane_conformance -q

  # Quick path for pull requests that change only prose under docs/: the
  # frontmatter, link and issue-form checks plus the two tests that read every
  # document. Runs only when `harness` is skipped; push, merge-group and any
  # non-prose change run the full suite instead.
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true' && needs.detect-changes.outputs.harness != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # test_fabric_skill_params exports the tool schemas with tsx.
      - name: Set up Node.js workspace
        uses: $/.github/actions/setup-node-workspace
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked harness test dependencies
        run: uv sync --locked --only-group test
      - name: Run document and link checks
        env:
          AGENT_FABRIC_PRODUCT_ROOT: ${{ github.workspace }}
          AGENT_FABRIC_INSTANCE_ROOT: ${{ github.workspace }}
        run: |
          .venv/bin/python scripts/check_harness.py
          .venv/bin/python -m pytest -q tests/test_harness_document_contract.py tests/test_fabric_skill_params.py

  fabric:
    name: Fabric typecheck, tests and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.fabric == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js workspace
        uses: $/.github/actions/setup-node-workspace
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked orchestration dependencies
        run: uv sync --locked --only-group test
      - name: Run typecheck and tests
        run: npm run check
      - name: Verify packed Fabric CLI and MCP bins
        run: npm run test:package-install --workspace @local/fabric
      - name: Drive the registered MCP launcher end to end
        env:
          HARNESS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: node runtime/fabric/mcp-smoke.mjs
      - name: Audit production dependencies
        run: npm audit --workspace=@local/fabric --omit=dev --audit-level=high

  split-root:
    name: Split-root contract rig
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.split-root == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Shallow is enough for the narrowed contract set below: every one
          # of those files is HEAD-local or fixture-scoped, verified by
          # running the exact subset green in a depth-1 checkout. The harness
          # job keeps full history for its pinned-blob tests (see its
          # checkout comment); the old claim that retained-receipt tests need
          # origin/main here was stale — no such test exists.
          fetch-depth: 1
      - name: Set up Node.js workspace
        uses: $/.github/actions/setup-node-workspace
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked harness test dependencies
        run: uv sync --locked --only-group test
      - name: Provision genuinely split roots through install-harness
        run: |
          set -euo pipefail
          split_parent="$(mktemp -d "${RUNNER_TEMP}/provenant-split.XXXXXX")"
          split_home="$split_parent/home"
          split_instance="$split_parent/instance"
          mkdir -p "$split_home/.codex" "$split_instance"
          export HOME="$split_home"
          export CODEX_HOME="$split_home/.codex"
          export PROVENANT_BIN_DIR="$split_home/.local/bin"
          export AGENT_FABRIC_PRODUCT_ROOT="$GITHUB_WORKSPACE"
          export AGENT_FABRIC_INSTANCE_ROOT="$split_instance"
          unset AGENTS_HOME
          export PATH="$PROVENANT_BIN_DIR:$PATH"
          scripts/install-harness --platform codex
          test -f "$split_instance/AGENTS.md"
          test -f "$split_instance/config/model-routing.json"
          test -f "$split_instance/config/model-preferences.json"
          test "$AGENT_FABRIC_PRODUCT_ROOT" != "$AGENT_FABRIC_INSTANCE_ROOT"
          printf 'product root: %s\ninstance root: %s\n' "$AGENT_FABRIC_PRODUCT_ROOT" "$AGENT_FABRIC_INSTANCE_ROOT"
          # Export the two roots and nothing else.  The seeding above needs a
          # split HOME, CODEX_HOME and PROVENANT_BIN_DIR, but exporting those
          # to later steps makes the suite fail on the ambient installer
          # environment rather than on the split roots, which is not what this
          # job is for.
          {
            echo "AGENT_FABRIC_PRODUCT_ROOT=$AGENT_FABRIC_PRODUCT_ROOT"
            echo "AGENT_FABRIC_INSTANCE_ROOT=$AGENT_FABRIC_INSTANCE_ROOT"
          } >> "$GITHUB_ENV"
      - name: Run install and relocation contract under split roots
        env:
          HARNESS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          set -euo pipefail
          # The full Python suite already ran fused in the harness job; under
          # split roots only the install/relocation/reconciliation contract
          # matters (ADR 0019). Same checks, cheaper placement.
          # One case is deselected, not dropped: ..._fused_desired_state
          # asserts workstation state of the live checkout (its ignored
          # installation.json), not the split contract — it still runs in the
          # harness fused suite. In the full suite it passes only via an
          # earlier test's side effect on the checkout; that latent
          # order-dependence is recorded for hygiene follow-up.
          $HARNESS_PYTHON -m pytest tests/test_split_root_contract.py \
            tests/test_instance_installation.py tests/test_install_harness.py \
            tests/test_install_provenant_command.py \
            tests/test_install_skills.py tests/test_check_provenant_install.py \
            --deselect tests/test_instance_installation.py::test_the_repository_ships_a_valid_fused_desired_state -q
      # The workspace suite already ran fused in the fabric job (`npm run
      # check`); under split roots the same command re-proves the JS side
      # against genuinely split product/instance roots without a second full
      # `npm test` placement.
      - name: Run workspace checks under split roots
        run: npm run check

  rust:
    name: Rust front door
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image ships rustup; the toolchain is pinned here and in
      # tools/front-door/rust-toolchain.toml (ADR 0027).
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/front-door
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked harness test dependencies
        run: uv sync --locked --only-group test
      # Port differential tests run the Python/TS oracles and must not skip
      # in CI (PORTING R9).
      - name: Set up Node.js workspace
        uses: $/.github/actions/setup-node-workspace
      - name: Require port differential oracles
        run: |
          {
            echo "PROVENANT_PORT_DIFF_REQUIRED=1"
            echo "PROVENANT_PORT_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python"
            echo "PROVENANT_PORT_NODE=$(command -v node)"
          } >> "$GITHUB_ENV"
      - name: Check formatting
        working-directory: tools/front-door
        run: cargo fmt --all --check
      - name: Lint
        working-directory: tools/front-door
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run unit tests
        working-directory: tools/front-door
        run: cargo test --workspace --locked
      - name: Build release binary
        working-directory: tools/front-door
        run: |
          PROVENANT_FD_SOURCE_SHA256="$(python3 ../../scripts/lib/front_door_build.py digest .)" \
            cargo build --release --locked
      - name: Run stale-checkout coverage against the binary
        run: PROVENANT_FRONT_DOOR_BIN="$CARGO_TARGET_DIR/release/provenant" .venv/bin/python -m pytest tests/test_stale.py -q
      - name: Run the golden CLI suite
        run: PROVENANT_GOLDEN_REQUIRED=1 PROVENANT_GOLDEN_BIN="$CARGO_TARGET_DIR/release/provenant" .venv/bin/python -m pytest tests/golden -q

  # #1339: stripping proc-macro dylibs broke macOS release builds at install
  # time. Share the Rust path filter and exercise the front door's release build.
  rust-macos-release:
    name: Rust macOS release smoke
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      # No target cache: install builds from a clean target, and cached
      # proc-macro dylibs would hide the failure this job exists to catch.
      - name: Build release front door
        working-directory: tools/front-door
        run: |
          PROVENANT_FD_SOURCE_SHA256="$(python3 ../../scripts/lib/front_door_build.py digest .)" \
            cargo build --release --locked -p provenant --bin provenant

  zizmor:
    name: Workflow security lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.workflows == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.31.1"
          # Audit exactly the surfaces this job is path-filtered on.
          inputs: ".github/workflows .github/actions"
          config: .github/zizmor.yml
          online-audits: "false"
          advanced-security: "false"
          annotations: "true"

  # Single required check. Succeeds only when every needed job either
  # succeeded or was skipped by the path filter; fails closed on any
  # failure or cancellation, including detect-changes itself.
  ci-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      - detect-changes
      - harness-checks
      - python-tests
      - lane-conformance
      - docs
      - fabric
      - split-root
      - rust
      - rust-macos-release
      - zizmor
    if: always()
    steps:
      - name: Fail unless every needed job succeeded or was skipped by filter
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          blocking="$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[]
             | select(.value.result != "success" and .value.result != "skipped")
             | "\(.key)=\(.value.result)"')"
          if [ -n "$blocking" ]; then
            echo "Blocking job results:"
            echo "$blocking"
            exit 1
          fi
          echo "All needed jobs succeeded or were skipped by the path filter."
      - name: Write tested tree marker
        if: github.event_name == 'pull_request' && needs.detect-changes.outputs.harness == 'true'
        env:
          TREE_SHA: ${{ needs.detect-changes.outputs.tree }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-tree"
          printf '%s\n' "$TREE_SHA" > "$RUNNER_TEMP/ci-tree/tree-sha"
      - name: Record passing PR tree
        if: github.event_name == 'pull_request' && needs.detect-changes.outputs.harness == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-passed-tree-${{ needs.detect-changes.outputs.tree }}
          path: ${{ runner.temp }}/ci-tree/tree-sha
          if-no-files-found: error
