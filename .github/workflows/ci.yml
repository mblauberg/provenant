name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow grants nothing by default; every job
# declares exactly what it needs.
permissions: {}

# Concurrency policy (issue #170, deferred from #150/#168): PR runs cancel
# their predecessor on the same ref — a superseded push means the stale run's
# result can never matter, so cancelling it just frees runners faster.
#
# Main-push runs are exempt from cancellation. detect-changes forces every
# path-filter output true on `push` (see below), so every job — including
# ci-status, the single required check pinned on the branch protection
# ruleset — always runs to completion on main. If a second push to main
# cancelled an in-flight run, the earlier merged commit would keep a
# "cancelled" ci-status forever: main is never re-pushed, so the verdict is
# not regenerated, and that commit's regression signal is silently lost.
# (PR merging is unaffected — required checks are evaluated on the PR head,
# not on main's own commits — so this is about main's audit trail, not a
# merge deadlock.) Excluding main from cancel-in-progress keeps every
# main-push run alive to completion, so main always ends with a definitive
# ci-status result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Path filtering happens here, never via workflow-level `paths:`, so the
  # aggregate `ci-status` check below always reports and merges can never
  # deadlock on a required check that stays pending.
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      # Pushes to main always run every job: full post-merge verification
      # and warm caches on the default branch for pull requests to reuse.
      harness: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.harness }}
      fabric: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.fabric }}
      split-root: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.split-root }}
      workflows: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.workflows }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Invariant: every tracked file matches at least one filter, so no
          # change can skip every build job while ci-status reports green.
          # The harness filter covers the Python tests and ordinary repository
          # checks run by this job, including scripts, skills, tests and documents.
          filters: |
            ci-contract: &ci-contract
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            node-workspace: &node-workspace
              - 'package.json'
              - 'package-lock.json'
            harness:
              - *ci-contract
              - *node-workspace
              - '.github/**'
              - 'agents/**'
              - 'config/**'
              - 'docs/**'
              - 'evals/**'
              - 'runtime/**'
              - 'scripts/**'
              - 'skills/**'
              - 'tests/**'
              - 'workflows/**'
              - '.gitignore'
              - 'ACKNOWLEDGEMENTS.md'
              - 'AGENTS.md'
              - 'CHANGELOG.md'
              - 'HARNESS.md'
              - 'LICENSE'
              - 'LICENSES/**'
              - 'MAINTAINING.md'
              - 'NOTICE'
              - 'README.md'
              - 'SECURITY.md'
              - 'THIRD_PARTY_NOTICES.md'
              # Locked Python test tooling for this job's own gate.
              - 'pyproject.toml'
              - 'uv.lock'
            fabric:
              - *ci-contract
              - *node-workspace
              - 'runtime/fabric/**'
            split-root:
              - *ci-contract
              - *node-workspace
              - 'config/**'
              - 'runtime/**'
              - 'scripts/**'
              - 'tests/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/zizmor.yml'

  harness:
    name: Python checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.harness == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked harness test dependencies
        run: uv sync --locked --only-group test
      - name: Run ordinary checks and Python tests
        env:
          HARNESS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: scripts/check-harness

  fabric:
    name: Fabric typecheck, tests and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.fabric == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Run typecheck and tests
        run: npm run check
      - name: Drive the registered MCP launcher end to end
        run: node runtime/fabric/mcp-smoke.mjs
      - name: Audit production dependencies
        run: npm audit --workspace=@local/fabric --omit=dev --audit-level=high

  split-root:
    name: Split-root contract rig
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.split-root == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Retained-receipt tests resolve `origin/main` and historical blobs,
          # so this job needs the same full history the harness job takes.
          fetch-depth: 0
      - name: Set up Node.js workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked harness test dependencies
        run: uv sync --locked --only-group test
      - name: Provision genuinely split roots through install-harness
        run: |
          set -euo pipefail
          split_parent="$(mktemp -d "${RUNNER_TEMP}/provenant-split.XXXXXX")"
          split_home="$split_parent/home"
          split_instance="$split_parent/instance"
          mkdir -p "$split_home/.codex" "$split_instance"
          export HOME="$split_home"
          export CODEX_HOME="$split_home/.codex"
          export PROVENANT_BIN_DIR="$split_home/.local/bin"
          export AGENT_FABRIC_PRODUCT_ROOT="$GITHUB_WORKSPACE"
          export AGENT_FABRIC_INSTANCE_ROOT="$split_instance"
          unset AGENTS_HOME
          export PATH="$PROVENANT_BIN_DIR:$PATH"
          scripts/install-harness --platform codex
          test -f "$split_instance/AGENTS.md"
          test -f "$split_instance/config/model-routing.json"
          test -f "$split_instance/config/model-preferences.json"
          test "$AGENT_FABRIC_PRODUCT_ROOT" != "$AGENT_FABRIC_INSTANCE_ROOT"
          printf 'product root: %s\ninstance root: %s\n' "$AGENT_FABRIC_PRODUCT_ROOT" "$AGENT_FABRIC_INSTANCE_ROOT"
          # Export the two roots and nothing else.  The seeding above needs a
          # split HOME, CODEX_HOME and PROVENANT_BIN_DIR, but exporting those
          # to later steps makes the suite fail on the ambient installer
          # environment rather than on the split roots, which is not what this
          # job is for.
          {
            echo "AGENT_FABRIC_PRODUCT_ROOT=$AGENT_FABRIC_PRODUCT_ROOT"
            echo "AGENT_FABRIC_INSTANCE_ROOT=$AGENT_FABRIC_INSTANCE_ROOT"
          } >> "$GITHUB_ENV"
      - name: Run full Python suite under split roots
        env:
          HARNESS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          set -euo pipefail
          $HARNESS_PYTHON -m pytest tests/ -q
      # Both split-root failure ledgers are gone with the daemon that owned
      # every entry in them: each named a provisioning, seat or lease case in
      # the retired coordination runtime. The workspace suite is now an
      # ordinary must-be-green step under split roots.
      - name: Run full workspace suite under split roots
        run: npm test

  zizmor:
    name: Workflow security lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: detect-changes
    if: needs.detect-changes.outputs.workflows == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          version: "1.27.0"
          # Audit exactly the surfaces this job is path-filtered on.
          inputs: ".github/workflows .github/actions"
          config: .github/zizmor.yml
          online-audits: "false"
          advanced-security: "false"
          annotations: "true"

  # Single required check. Succeeds only when every needed job either
  # succeeded or was skipped by the path filter; fails closed on any
  # failure or cancellation, including detect-changes itself.
  ci-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      - detect-changes
      - harness
      - fabric
      - split-root
      - zizmor
    if: always()
    steps:
      - name: Fail unless every needed job succeeded or was skipped by filter
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          blocking="$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[]
             | select(.value.result != "success" and .value.result != "skipped")
             | "\(.key)=\(.value.result)"')"
          if [ -n "$blocking" ]; then
            echo "Blocking job results:"
            echo "$blocking"
            exit 1
          fi
          echo "All needed jobs succeeded or were skipped by the path filter."
