name: Dependabot auto-merge

# Metadata and changed paths are read through the API; the PR head is never
# checked out. GitHub's required ci-status check still gates the merge.
#
on:
  pull_request:

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}

jobs:
  automerge:
    name: Auto-merge eligible Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Belt and braces: only Dependabot's own PRs against this repository (not
    # a fork opening a PR while impersonating the actor name) reach the merge
    # step below.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          eligible=false
          if jq -e 'length > 0 and all(.[]; (.prevVersion | length > 0) and (.newVersion | length > 0) and (.updateType == "version-update:semver-patch" or .updateType == "version-update:semver-minor"))' <<< "$DEPENDENCIES" >/dev/null; then
            files=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100")
            if jq -e --argjson count "$CHANGED_FILES" '
              [ .[][] | .filename ] as $paths |
              ($paths | length) == $count and $count > 0 and
              all($paths[]; test("(^|/)(Cargo\\.toml|Cargo\\.lock|package\\.json|package-lock\\.json|npm-shrinkwrap\\.json|yarn\\.lock|pnpm-lock\\.yaml)$"))
            ' <<< "$files" >/dev/null; then
              eligible=true
            fi
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"
