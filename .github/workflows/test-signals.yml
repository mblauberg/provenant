name: Test signals

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly run at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

# Advisory test-strength signals. Nothing here joins ci-status in ci.yml, and
# every script exits 0, so these only warn.
permissions: {}

concurrency:
  group: test-signals-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  assertion-diff:
    name: Assertion diff signals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    outputs:
      has_changed_tests: ${{ steps.changed.outputs.has_changed_tests }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed Rust tests
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          filter="$(scripts/find-changed-tests --base "$BASE_SHA" --head "$HEAD_SHA" --format nextest-expr)"
          if [ -n "$filter" ]; then
            echo 'has_changed_tests=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_changed_tests=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Run script tests
        run: |
          scripts/test-assertion-diff
          scripts/test-cleanup-signals
          scripts/test-find-changed-tests
          scripts/test-run-stress-tests
      - name: Check PR test assertions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/assertion-diff --base "$BASE_SHA" --head "$HEAD_SHA" --annotate --github-summary

  stress-tests:
    name: Changed-test stress signals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: assertion-diff
    # A failed selector leaves an empty output and runs stress conservatively.
    if: >-
      always() && github.event_name == 'pull_request' && github.event.action != 'labeled' &&
      needs.assertion-diff.outputs.has_changed_tests != 'false'
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set Rust temporary directory
        env:
          TMPDIR: ${{ runner.temp }}
        run: printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/front-door
          shared-key: front-door-ci-test-recording
          add-job-id-key: false
          save-if: false
      - name: Install nextest
        uses: ./.github/actions/install-nextest
        timeout-minutes: 10
      - name: Stress-run changed tests
        env:
          PROVENANT_ROOT: ${{ github.workspace }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/run-stress-tests "$BASE_SHA" "$HEAD_SHA"

  harness-stress:
    name: Nightly harness stress (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install nextest
        uses: ./.github/actions/install-nextest
        timeout-minutes: 10
      - name: Stress harness binaries
        working-directory: tools/front-door
        env:
          TMPDIR: ${{ runner.temp }}
        # Confinement is mandatory only where Seatbelt exists; the variable is
        # checked for presence, so it must be absent on Linux.
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export PROVENANT_CONFINEMENT_REQUIRED=1
          else
            export RUSTFLAGS="-C link-arg=-fuse-ld=lld"
          fi
          cargo nextest run --profile ci --ignore-default-filter --workspace --locked \
            --features provenant-providers/recording --stress-count 5 --retries 0 \
            -E 'binary(=worktrees) | binary(=custody) | binary(=graph_provider) |
            binary(=process) | binary(=pr) | binary(=publication) | binary(=fake_provider)'

  mutation-tests:
    name: Advisory mutation signals
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'mutants') &&
      (github.event.action != 'labeled' || github.event.label.name == 'mutants'))
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set Rust temporary directory
        env:
          TMPDIR: ${{ runner.temp }}
        run: printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/front-door
          shared-key: front-door-ci-test-recording
          add-job-id-key: false
          save-if: false
      - name: Install nextest
        uses: ./.github/actions/install-nextest
        timeout-minutes: 10
      - name: Install mutation testing
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        timeout-minutes: 3
        with:
          tool: cargo-mutants@25.3.1
      - name: Run mutation testing
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || 'HEAD' }}
        run: scripts/run-mutants "$BASE_SHA" "$HEAD_SHA"
