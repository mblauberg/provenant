version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Only labels declared in .github/labels.yml; without this Dependabot
    # recreates its per-ecosystem default labels that the label sync prunes.
    labels:
      - dependencies

  # Rust workspace dependencies approved by ADR 0028.
  - package-ecosystem: cargo
    directory: /tools/front-door
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
