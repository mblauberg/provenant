# Declarative source of truth for this repository's labels.
#
# Synced by .github/workflows/labels.yml (crazy-max/ghaction-github-labeler)
# with pruning enabled: a label that is not in this file is deleted from the
# live repository on the next sync. Native issue types say what an item is;
# Project Status carries progress and labels carry only signal. Do not add
# status labels here.

- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation

- name: dependencies
  color: "0366d6"
  description: Dependency updates, including Dependabot pull requests

- name: governance
  color: "5319e7"
  description: Repository policy, process, or architecture governance

- name: user-gate
  color: "d93f0b"
  description: Merge leaves a decision or action only the user can take

- name: source:agent
  color: "c5def5"
  description: Filed by an agent; the issue body records filer and run provenance

- name: mutants
  color: "fbca04"
  description: Run advisory mutation testing on this pull request

- name: ci:full
  color: "1d76db"
  description: Run every CI suite on this pull request, including main-tier macOS suites

- name: ci:red-main
  color: "b60205"
  description: CI failed on main; fix forward
