name: Skill proposal
description: Propose a new Agent Skill, or a material revision to an existing one.
type: Feature
body:
  - type: markdown
    attributes:
      value: >-
        Every skill costs tokens in every session and competes with its
        neighbours for routing, so the bar is high. The `improve` skill's
        authoring guidance sets it. A capability that cannot fill these fields is
        usually a project rule, a script or hook, or a reference inside an
        existing skill: that is a good outcome, not a rejection.

  - type: input
    id: name
    attributes:
      label: Skill name
      description: >-
        kebab-case capability name.
      placeholder: threat-modelling
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: One-line description
      description: >-
        This is all a model sees when it routes (at most 1024 characters). Put the
        trigger terms first and the nearest exclusion next. Shape: "Use for X. Not
        for Y; use Z."
      placeholder: "Use for X, Y and Z. Not for W; use <nearest-skill>."
    validations:
      required: true

  - type: textarea
    id: triggers
    attributes:
      label: Trigger terms
      description: >-
        The words and phrasings a user would really say to reach this skill, not
        the vocabulary you would prefer they used.
    validations:
      required: true

  - type: input
    id: nearest
    attributes:
      label: Nearest existing skill
      description: The one skill in skills/ that a reasonable person would reach for instead.
      placeholder: code-review
    validations:
      required: true

  - type: textarea
    id: boundary
    attributes:
      label: Why this is not that skill
      description: >-
        Name the difference in trigger, authority, artefacts or completion
        gates. A skill that cannot hold a stable boundary against its nearest
        neighbour gets merged into it rather than added beside it.
    validations:
      required: true

  - type: dropdown
    id: container
    attributes:
      label: Smallest correct container
      description: >-
        The smallest container that holds the capability. Be honest: a global
        skill is the most expensive answer.
      options:
        - A global Agent Skill (this proposal)
        - An always-loaded project rule
        - A deterministic script or hook
        - A reference file inside an existing skill
        - An external MCP or app capability
        - An independently versioned plugin
    validations:
      required: true

  - type: textarea
    id: container-why
    attributes:
      label: Why a global skill and not the cheaper container
      description: >-
        If you chose anything other than a global skill above, say so here and
        we will route it. If you chose a global skill, argue why the cheaper
        containers fail.
    validations:
      required: true

  - type: checkboxes
    id: budget
    attributes:
      label: Cost and safety
      options:
        - label: SKILL.md stays small and routes; depth goes in narrowly named reference files loaded only when needed.
          required: true
        - label: The skill grants no authority by itself; metadata and tool lists may narrow invocation but never widen permission.
          required: true
        - label: Any third-party material I am adapting has a redistribution licence, and I will preserve its notices.
          required: true
