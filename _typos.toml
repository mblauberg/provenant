# Australian prose; API identifiers and malformed fixtures retain their spelling.
[default]
locale = "en-au"
# Code spans quote identifiers verbatim, including upstream API spellings.
extend-ignore-re = ["`[^`\\n]+`"]

[files]
# Vendored bundles are generated upstream.
extend-exclude = ["runtime/ui-live/modern-screenshot.umd.js", "runtime/ui-evidence/detector/detect-antipatterns-browser.js"]

